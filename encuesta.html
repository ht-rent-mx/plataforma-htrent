<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Encuesta de satisfacción · HT Rent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<!-- Encuesta de satisfacción a 25 días de la entrega (2026-11-26, pedido de Rogelio).
     Página pública: el cliente entra con el enlace único de su correo (?t=<token>).
     Lee y guarda solo con las funciones sc_encuesta_abrir / sc_encuesta_responder. -->
<style>
  :root{--navy:#0B3D66;--navy-2:#0F4C7E;--ink:#1B2A5C;--lime:#3CE81E;--lime-ink:#1B7F0A;--lime-soft:#E4FADF;
    --red:#C63A2F;--red-soft:#FBE6E4;--bg:#EDF0F5;--surface:#fff;--text:#15203B;--muted:#5A6680;--line:#D5DBE5;--r:6px;
    --display:"Saira","Arial Narrow",Arial,sans-serif;--sans:"Barlow","Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  header{background:var(--navy);border-bottom:5px solid var(--lime);color:#fff}
  header .in{max-width:760px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .marca{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;letter-spacing:.5px}
  .marca span{color:var(--lime)}
  .lema{font-size:12px;color:#B9C8DC;text-align:right;line-height:1.3}
  main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
  h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;color:var(--ink);line-height:1.15;margin-bottom:8px}
  h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:20px;color:var(--navy);margin-bottom:4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--lime-soft);color:var(--lime-ink);padding:2px 8px;border-radius:3px;margin-bottom:8px}
  .p{padding:14px 0;border-top:1px solid var(--line)}
  .p:first-of-type{border-top:0}
  .p label.q{display:block;font-weight:600;margin-bottom:8px}
  .escala{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .escala.n11{grid-template-columns:repeat(11,1fr)}
  .escala button,.opc button{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:10px 0;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;min-height:44px}
  .escala button:hover,.opc button:hover{border-color:var(--navy)}
  .escala button.sel,.opc button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
  .extremos{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .opc{display:flex;gap:8px;flex-wrap:wrap}
  .opc button{padding:10px 18px}
  .p.falta label.q{color:var(--red)}
  .p.falta .escala button,.p.falta .opc button{border-color:var(--red)}
  textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:var(--r);padding:10px;font:inherit;resize:vertical}
  .enviar{display:block;width:100%;background:var(--navy);color:#fff;border:0;border-radius:var(--r);padding:14px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
  .enviar:hover{background:var(--navy-2)}
  .enviar:disabled{opacity:.6;cursor:wait}
  .error{background:var(--red-soft);color:var(--red);border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:12px;display:none}
  .centro{text-align:center;padding:36px 20px}
  .centro .ico{font-size:44px;line-height:1;color:var(--lime-ink);margin-bottom:10px}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px}
  @media (max-width:520px){.escala.n11{grid-template-columns:repeat(6,1fr)} h1{font-size:22px}}
</style>
</head>
<body>
<header><div class="in">
  <div class="marca">HT <span>RENT</span></div>
  <div class="lema">ARRENDA Y CRECE<br>Servicio a Clientes</div>
</div></header>

<main id="app">
  <div class="card centro" id="cargando"><p class="sub">Cargando su encuesta…</p></div>
</main>
<footer>HT Rent · Sus respuestas se usan solo para mejorar nuestro servicio.</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL  = 'https://ahfjstuwekcuxshclprl.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoZmpzdHV3ZWtjdXhzaGNscHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDg2MjYsImV4cCI6MjEwMzYyNDYyNn0.lf1uw8WHPRy21GuYlK9NzeI5JgJK2be1LrODq22CodM';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: false } });

const app = document.getElementById('app');
const token = new URLSearchParams(location.search).get('t') || '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fecha = (d) => { if (!d) return ''; const [y,m,dd] = d.split('-').map(Number); return `${dd} de ${MESES[m-1]} de ${y}`; };

function mensaje(titulo, texto, ok = true) {
  app.innerHTML = `<div class="card centro"><div class="ico" style="color:${ok ? 'var(--lime-ink)' : 'var(--red)'}">${ok ? '✓' : '!'}</div>
    <h1>${esc(titulo)}</h1><p class="sub" style="margin:0">${esc(texto)}</p></div>`;
}

const ESC5 = ['Muy malo','Excelente'];
const preguntas = (ej) => [
  { sec: 'ejecutivo' },
  { k: 'ej_atencion',    q: `¿Cómo califica la atención y amabilidad de ${ej}?` },
  { k: 'ej_respuesta',   q: `¿Qué tan rápido respondió ${ej} a sus llamadas, mensajes o correos?` },
  { k: 'ej_claridad',    q: `¿Qué tan clara fue la información que le dio sobre el proceso (documentos, contrato, entrega)?` },
  { k: 'ej_seguimiento', q: `¿Cómo califica el seguimiento que le dio hasta la entrega de sus unidades?` },
  { k: 'ej_general',     q: `En general, ¿qué tan satisfecho está con el servicio de ${ej}?` },
  { sec: 'empresa' },
  { k: 'emp_unidades',   q: '¿En qué condiciones recibió sus unidades?' },
  { k: 'emp_documentos', q: '¿Qué tan sencillo fue el proceso de documentos y firma de contrato?' },
  { k: 'emp_tiempos',    q: '¿Cumplimos con los tiempos de entrega acordados?' },
  { k: 'emp_general',    q: 'En general, ¿qué tan satisfecho está con HT Rent como empresa?' },
  { k: 'recomendaria',   q: '¿Qué tan probable es que recomiende HT Rent a un colega o conocido?', tipo: 'n11' },
  { k: 'volveria',       q: '¿Volvería a contratar con HT Rent?', tipo: 'opc',
    opciones: [['si','Sí'],['tal_vez','Tal vez'],['no','No']] },
  { sec: 'cierre' },
  { k: 'comentario',     q: '¿Algo que quiera contarnos o que podamos mejorar? (opcional)', tipo: 'texto' },
  { k: 'quiere_contacto', q: '¿Desea que nos comuniquemos con usted?', tipo: 'opc', opcional: true,
    opciones: [[true,'Sí, por favor'],[false,'No es necesario']] },
];

function pintar(info) {
  const ej = info.ejecutivo || 'su ejecutivo(a)';
  const unidades = info.equipos ? `${esc(info.equipos)}, entregadas el ${fecha(info.fecha_entrega)}` : `entregadas el ${fecha(info.fecha_entrega)}`;
  let html = `<div class="card">
    <span class="badge">Encuesta de satisfacción</span>
    <h1>Hola, ${esc(info.cliente)}</h1>
    <p class="sub" style="margin:0">Gracias por confiar en HT Rent (${unidades}). La encuesta toma unos 2 minutos.
    Se enfoca principalmente en la atención de <b>${esc(ej)}</b> y, en segundo lugar, en su percepción de HT Rent como empresa.</p>
  </div>`;
  let abierta = false;
  for (const p of preguntas(ej)) {
    if (p.sec) {
      if (abierta) html += `</div>`;
      const t = { ejecutivo: [`1. Su ejecutivo(a): ${esc(ej)}`, 'Califique de 1 (muy malo) a 5 (excelente).'],
                  empresa: ['2. HT Rent como empresa', 'Califique de 1 (muy malo) a 5 (excelente).'],
                  cierre: ['3. Para terminar', ''] }[p.sec];
      html += `<div class="card"><h2>${t[0]}</h2>${t[1] ? `<p class="sub">${t[1]}</p>` : ''}`;
      abierta = true;
      continue;
    }
    html += `<div class="p" data-k="${p.k}" data-tipo="${p.tipo || 'n5'}"${p.opcional || p.tipo === 'texto' ? ' data-opcional="1"' : ''}><label class="q">${esc(p.q)}</label>`;
    if (!p.tipo) {
      html += `<div class="escala">${[1,2,3,4,5].map((n) => `<button type="button" data-v="${n}">${n}</button>`).join('')}</div>
               <div class="extremos"><span>${ESC5[0]}</span><span>${ESC5[1]}</span></div>`;
    } else if (p.tipo === 'n11') {
      html += `<div class="escala n11">${[...Array(11).keys()].map((n) => `<button type="button" data-v="${n}">${n}</button>`).join('')}</div>
               <div class="extremos"><span>Nada probable</span><span>Muy probable</span></div>`;
    } else if (p.tipo === 'opc') {
      html += `<div class="opc">${p.opciones.map(([v,t]) => `<button type="button" data-v="${v}">${t}</button>`).join('')}</div>`;
    } else {
      html += `<textarea maxlength="2000" placeholder="Escriba aquí sus comentarios"></textarea>`;
    }
    html += `</div>`;
  }
  html += `</div><div class="error" id="err"></div>
    <button class="enviar" id="enviar" type="button">Enviar respuestas</button>`;
  app.innerHTML = html;

  const resp = {};
  app.querySelectorAll('.p').forEach((div) => {
    div.querySelectorAll('button[data-v]').forEach((b) => b.addEventListener('click', () => {
      div.querySelectorAll('button').forEach((x) => x.classList.remove('sel'));
      b.classList.add('sel');
      const raw = b.dataset.v;
      resp[div.dataset.k] = div.dataset.tipo === 'opc' ? (raw === 'true' ? true : raw === 'false' ? false : raw) : Number(raw);
      div.classList.remove('falta');
    }));
  });

  document.getElementById('enviar').addEventListener('click', async () => {
    const err = document.getElementById('err');
    err.style.display = 'none';
    let primera = null;
    app.querySelectorAll('.p').forEach((div) => {
      if (div.dataset.opcional) return;
      if (resp[div.dataset.k] === undefined) { div.classList.add('falta'); primera ??= div; }
    });
    if (primera) {
      err.textContent = 'Falta contestar algunas preguntas (marcadas en rojo).';
      err.style.display = 'block';
      primera.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    resp.comentario = app.querySelector('textarea')?.value.trim() || '';
    const btn = document.getElementById('enviar');
    btn.disabled = true; btn.textContent = 'Enviando…';
    const { error } = await sb.rpc('sc_encuesta_responder', { p_token: token, r: resp });
    if (error) {
      btn.disabled = false; btn.textContent = 'Enviar respuestas';
      err.textContent = 'No se pudo guardar su respuesta. Intente de nuevo en un momento.';
      err.style.display = 'block';
      return;
    }
    mensaje('¡Gracias por su tiempo!', `Recibimos sus respuestas. ${resp.quiere_contacto ? `${ej} se pondrá en contacto con usted.` : 'Nos ayudan a darle un mejor servicio.'}`);
    window.scrollTo(0, 0);
  });
}

(async () => {
  if (token.length < 32) return mensaje('Enlace no válido', 'Abra la encuesta desde el botón del correo que le enviamos.', false);
  const { data, error } = await sb.rpc('sc_encuesta_abrir', { p_token: token });
  if (error) return mensaje('No pudimos abrir la encuesta', 'Intente de nuevo en un momento.', false);
  if (!data) return mensaje('Enlace no válido', 'Abra la encuesta desde el botón del correo que le enviamos.', false);
  if (data.respondida) return mensaje('Esta encuesta ya fue contestada', '¡Gracias! Ya recibimos sus respuestas.');
  if (data.cancelada) return mensaje('Encuesta no disponible', 'Esta encuesta ya no está activa.', false);
  pintar(data);
})();
</script>
</body>
</html>
