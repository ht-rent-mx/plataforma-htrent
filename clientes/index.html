  const guardarLimpio=()=>onSave({...f,tipoPersona:f.tipoPersona||"",equipos:f.equipos.filter(e=>e.tipo.trim()).map(e=>({tipo:e.tipo.trim(),cantidad:Number(e.cantidad)||1,marca:e.marca||"",anio:e.anio||"",condicion:e.condicion||"",precio:(e.precio===""||e.precio==null)?"":Number(e.precio)})),entregaModo:f.entregaModo||"",nivsEntrega:(f.nivsEntrega||[]).map(x=>({niv:(x.niv||"").trim(),entregado:!!x.entregado})).filter(x=>x.niv||x.entregado),devueltoComercial:!!f.devueltoComercial,fechaDevuelto:f.devueltoComercial?(f.fechaDevuelto||HOY):"",motivoDevuelto:f.devueltoComercial?(f.motivoDevuelto||""):""});

  return (<div className="fixed inset-0 z-50 flex justify-end" style={{background:"rgba(5,15,30,.55)"}} onClick={onClose}>
    <div className="h-full w-full sm:max-w-2xl overflow-y-auto bg-white shadow-2xl" style={{paddingBottom:"env(safe-area-inset-bottom,0px)"}} onClick={e=>e.stopPropagation()}>
      <div className="sticky top-0 z-10 flex items-center justify-between gap-3 border-b-4 border-lime bg-navy px-5 py-3.5" style={{paddingTop:"calc(14px + env(safe-area-inset-top,0px))"}}><h2 className="font-display text-xl text-white leading-tight truncate">{inicial?(inicial.cliente||"Ficha del cliente"):"Nuevo cliente"}</h2><button onClick={onClose} aria-label="Cerrar" className="grid h-9 w-9 shrink-0 place-items-center rounded border border-navy-edge text-white hover:bg-navy-2"><Icon name="x" size={18}/></button></div>
      <datalist id="dl-ejec">{ejecutivos.map(x=><option key={x} value={x}/>)}</datalist>
      <datalist id="dl-cli">{clientesSug.map(x=><option key={x} value={x}/>)}</datalist>
      <datalist id="dl-emp">{EMPRESAS.map(x=><option key={x} value={x}/>)}</datalist>
      <div className="p-5 space-y-4">
        <div className="grid grid-cols-2 gap-3"><Campo label="Ejecutivo"><input list="dl-ejec" value={f.ejecutivo} onChange={e=>set("ejecutivo",e.target.value)} className={inp} placeholder="Nombre…"/></Campo><Campo label="Empresa / Marca"><input list="dl-emp" value={f.empresa} onChange={e=>set("empresa",e.target.value)} className={inp} placeholder="HT / JJ / 3C"/></Campo></div>
        <Campo label="Cliente"><input list="dl-cli" value={f.cliente} onChange={e=>set("cliente",e.target.value)} className={inp} placeholder="Nombre o empresa del cliente…"/></Campo>
        <div className="grid grid-cols-2 gap-3"><Campo label="Folio Venta"><input value={f.folioVenta} onChange={e=>set("folioVenta",e.target.value)} className={inp} placeholder="Ej. V-10245"/></Campo><Campo label="Folio JJ"><input value={f.folioJJ} onChange={e=>set("folioJJ",e.target.value)} className={inp} placeholder="Ej. JJ-8891"/></Campo></div>

        {/* Tipo de cliente */}
        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Tipo de cliente</span>
          <div className="grid grid-cols-2 gap-2">{TIPO_CLIENTE.map(op=>{const a=f.tipoCliente===op;return <button key={op} onClick={()=>setTC(op)} className={`rounded-lg border px-2 py-2 text-sm font-medium ${a?"bg-slate-800 text-white border-slate-800":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{op}</button>;})}</div>
          <p className="mt-1 text-xs text-slate-400">Cambia el listado de requisitos del expediente.</p>
        </div>

        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Tipo de persona</span>
          <div className="grid grid-cols-2 gap-2">{TIPO_PERSONA.map(op=>{const a=(f.tipoPersona||"")===op;return <button key={op} onClick={()=>set("tipoPersona",a?"":op)} className={`rounded-lg border px-2 py-2 text-sm font-medium ${a?"bg-navy text-white border-navy":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{op}</button>;})}</div>
          <p className="mt-1 text-xs text-slate-400">Las personas morales pasan por dictamen del área legal antes de contratos.</p>
        </div>

        <div className="grid grid-cols-2 gap-3"><Campo label="Correo electrónico"><input type="email" value={f.correo} onChange={e=>set("correo",e.target.value)} className={inp} placeholder="cliente@correo.com"/></Campo><Campo label="Teléfono"><input value={f.telefono} onChange={e=>set("telefono",e.target.value)} className={inp} placeholder="871 000 0000"/></Campo></div>

        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Equipo / remolque</span><div className="flex gap-2 mb-1 text-[10px] uppercase tracking-wide text-slate-400 font-semibold"><span className="flex-1">Descripción</span><span className="w-16 text-center">Cant.</span>{f.equipos.length>1 && <span className="w-8"></span>}</div><div className="space-y-2">{f.equipos.map((eq,i)=>{const sub=precioEquipoLinea(eq)*(Number(eq.cantidad)||0);const vars=variantesDe(eq.tipo);const curKey=(eq.marca&&eq.anio&&eq.condicion)?(eq.marca+"|"+eq.anio+"|"+eq.condicion):"";const auto=precioCombo(eq.tipo,eq.marca,eq.anio,eq.condicion);return (
                <div key={i} className="rounded-lg border border-stone-200 bg-stone-50/50 p-2 space-y-2">
                  <div className="flex items-center gap-2">
                    <input list="dl-catalogo" value={eq.tipo} onChange={e=>setEq(i,"tipo",e.target.value)} placeholder="Equipo (escribe o elige del catálogo)…" className="flex-1 min-w-0 rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"/>
                    <input type="number" min="1" value={eq.cantidad} onChange={e=>setEq(i,"cantidad",e.target.value)} title="Cantidad" className="w-14 shrink-0 text-center rounded-lg border border-stone-300 bg-white px-2 py-2 text-sm outline-none focus:border-slate-400"/>
                    {f.equipos.length>1 && <button onClick={()=>delEq(i)} className="grid h-8 w-8 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-stone-100 hover:text-red-500"><Icon name="x" size={16}/></button>}
                  </div>
                  {vars.length>0 ? <select value={curKey} onChange={e=>setEq(i,"variante",e.target.value)} className="w-full rounded-lg border border-stone-300 bg-white px-2 py-2 text-sm outline-none focus:border-slate-400"><option value="">Elige marca · año · condición ({vars.length} opciones)…</option>{vars.map(v=><option key={v.key} value={v.key}>{v.m} · {v.a} · {condLabel(v.m,v.c)} — {pesos(v.p)}</option>)}</select>
                    : (eq.tipo ? <p className="text-[11px] text-amber-600 px-0.5">Este equipo no está en el catálogo de costos · captura el precio a mano.</p> : null)}
                  <div className="flex items-center gap-2 pl-0.5">
                    <span className="text-[11px] font-medium text-slate-400">Precio unit.</span><span className="text-slate-400 text-sm">$</span>
                    <input type="number" min="0" value={eq.precio===""||eq.precio==null?"":eq.precio} onChange={e=>setEq(i,"precio",e.target.value)} placeholder={auto?String(auto):"captura o elige de la lista"} className="w-32 rounded-lg border border-stone-300 bg-white px-2 py-1 text-sm mono outline-none focus:border-slate-400"/>
                    {auto>0 && (eq.precio===""||eq.precio==null) && <span className="text-[10px] text-emerald-600">✓ del catálogo</span>}
                    <span className="ml-auto text-xs font-bold text-slate-600 mono">{sub>0?pesos(sub):""}</span>
                  </div>
                </div>);})}
              <datalist id="dl-catalogo">{EQUIPOS_CAT.map(n=><option key={n} value={n}/>)}</datalist></div><div className="mt-2 flex items-center justify-between"><button onClick={addEq} className="inline-flex items-center gap-1 text-sm font-semibold text-slate-600 hover:text-slate-900"><Icon name="plus" size={15}/> Agregar equipo</button>{valorVenta(f)>0 && <span className="text-sm font-bold text-slate-800">Valor de la venta: <span className="mono text-emerald-700">{pesos(valorVenta(f))}</span></span>}</div></div>

        <div className="rounded-xl border border-stone-200 p-3">
          <h3 className="text-sm font-bold text-slate-700 inline-flex items-center gap-1.5 mb-2"><Icon name="truck" size={15}/> Entrega de equipos</h3>
          <div className="grid grid-cols-3 gap-2">
            {[["","Sin entregar"],["parcial","Entrega parcial"],["completa","Entrega completa"]].map(([v,l])=>{const a=(f.entregaModo||"")===v;return <button key={v} onClick={()=>setF(p=>({...p,entregaModo:v}))} className={`rounded-lg border px-2 py-2 text-xs font-semibold ${a?(v==="completa"?"border-teal-500 bg-teal-600 text-white":v==="parcial"?"border-amber-500 bg-amber-500 text-white":"border-slate-400 bg-slate-700 text-white"):"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{l}</button>;})}
          </div>
          {f.entregaModo==="completa" && <p className="mt-2 text-xs text-teal-700 font-medium">Los {unidades(f)} equipos del cliente quedan como entregados.</p>}
          {f.entregaModo==="parcial" && <div className="mt-3">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-xs font-semibold text-slate-500">NIVs entregados: {(f.nivsEntrega||[]).filter(e=>e.entregado).length} de {unidades(f)} · faltan {Math.max(0,unidades(f)-(f.nivsEntrega||[]).filter(e=>e.entregado).length)}</span>
              {unidades(f)>0 && (f.nivsEntrega||[]).length===0 && <button onClick={()=>setF(p=>({...p,nivsEntrega:Array.from({length:unidades(p)},()=>({niv:"",entregado:false}))}))} className="text-xs font-semibold text-amber-700 hover:underline">Generar {unidades(f)} filas</button>}
            </div>
            <div className="space-y-1.5">{(f.nivsEntrega||[]).map((e,i)=>(
              <div key={i} className="flex items-center gap-2">
                <button onClick={()=>setF(p=>({...p,nivsEntrega:p.nivsEntrega.map((x,j)=>j===i?{...x,entregado:!x.entregado}:x)}))} className={`grid h-7 w-7 shrink-0 place-items-center rounded-md border ${e.entregado?"border-teal-500 bg-teal-600 text-white":"border-stone-300 bg-white text-transparent"}`}><Icon name="check" size={14}/></button>
                <input value={e.niv} onChange={ev=>setF(p=>({...p,nivsEntrega:p.nivsEntrega.map((x,j)=>j===i?{...x,niv:ev.target.value}:x)}))} placeholder={`NIV del equipo ${i+1}`} className={`flex-1 rounded-lg border px-3 py-1.5 text-sm mono outline-none focus:border-slate-400 ${e.entregado?"border-teal-200 bg-teal-50/40":"border-stone-300"}`}/>
                <button onClick={()=>setF(p=>({...p,nivsEntrega:p.nivsEntrega.filter((_,j)=>j!==i)}))} className="grid h-7 w-7 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-stone-100 hover:text-red-500"><Icon name="x" size={14}/></button>
              </div>))}</div>
            <button onClick={()=>setF(p=>({...p,nivsEntrega:[...(p.nivsEntrega||[]),{niv:"",entregado:false}]}))} className="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-slate-600 hover:text-slate-900"><Icon name="plus" size={14}/> Agregar NIV</button>
          </div>}
        </div>

        <div className={`rounded-xl border p-3 ${f.devueltoComercial?"border-purple-300 bg-purple-50/50":"border-stone-200"}`}>
          <div className="flex items-center justify-between">
            <div><h3 className="text-sm font-bold text-slate-700 inline-flex items-center gap-1.5"><Icon name="left" size={15}/> Devuelto a comercial</h3><p className="text-[11px] text-slate-400">Para clientes que no responden o no avanzan. Conserva su etapa actual.</p></div>
            <button onClick={()=>setF(p=>({...p,devueltoComercial:!p.devueltoComercial,fechaDevuelto:!p.devueltoComercial?(p.fechaDevuelto||HOY):p.fechaDevuelto}))} className={`shrink-0 rounded-lg border px-3 py-2 text-xs font-semibold ${f.devueltoComercial?"border-purple-500 bg-purple-600 text-white":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{f.devueltoComercial?"✓ Devuelto":"Marcar devuelto"}</button>
          </div>
          {f.devueltoComercial && <div className="mt-2 grid gap-2 sm:grid-cols-3">
            <label className="text-xs"><span className="text-slate-500 font-medium">Fecha</span><input type="date" value={f.fechaDevuelto||""} onChange={e=>setF(p=>({...p,fechaDevuelto:e.target.value}))} className="mt-1 w-full rounded-lg border border-stone-300 bg-white px-2 py-1.5 text-sm outline-none focus:border-purple-400"/></label>
            <label className="text-xs sm:col-span-2"><span className="text-slate-500 font-medium">Motivo (opcional)</span><input value={f.motivoDevuelto||""} onChange={e=>setF(p=>({...p,motivoDevuelto:e.target.value}))} placeholder="Ej. no responde, sin avance…" className="mt-1 w-full rounded-lg border border-stone-300 bg-white px-2 py-1.5 text-sm outline-none focus:border-purple-400"/></label>
          </div>}
        </div>

        <Campo label="NIV de equipo"><textarea value={f.niv} onChange={e=>set("niv",e.target.value)} rows={2} placeholder="Captura uno o varios NIV (uno por línea o separados por coma)" className={inp}/></Campo>
        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Tipo de contrato</span><div className="grid grid-cols-2 gap-2">{TIPO_CONTRATO.map(op=>{const a=f.tipoContrato===op;return <button key={op} onClick={()=>set("tipoContrato",a?"":op)} className={`rounded-lg border px-2 py-2 text-sm font-medium ${a?(op==="Notariado"?"bg-violet-600 text-white border-violet-600":"bg-sky-600 text-white border-sky-600"):"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{op}</button>;})}</div></div>
        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Tipo de venta</span><div className="grid grid-cols-2 gap-2">{TIPOVENTA.map(op=>{const a=f.tipoVenta===op;return <button key={op} onClick={()=>setTV(a?"":op)} className={`rounded-lg border px-2 py-2 text-sm font-medium ${a?"bg-slate-800 text-white border-slate-800":"border-stone-300 text-slate-600 hover:bg-stone-50"}`}>{op}</button>;})}</div>{plazosDisp.length>0 && (<div className="mt-2 rounded-lg bg-stone-50 border border-stone-200 p-2"><span className="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-slate-500">Plazo</span><div className="flex flex-wrap gap-1.5">{plazosDisp.map(p=>{const a=f.plazo===p;return <button key={p} onClick={()=>set("plazo",a?"":p)} className={`rounded-full border px-3 py-1 text-xs font-semibold ${a?"bg-amber-500 text-white border-amber-500":"border-stone-300 text-slate-600 hover:bg-white"}`}>{p} meses</button>;})}</div></div>)}</div>

        <div><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Adicionales del equipo</span><div className="flex flex-wrap gap-1.5">{ADICIONALES.map(a=>{const sel=f.adicionales.includes(a);return <button key={a} onClick={()=>toggleAdi(a)} className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-xs font-medium ${sel?"bg-amber-50 text-amber-800 border-amber-300":"border-stone-300 text-slate-500 hover:bg-stone-50"}`}>{sel && <Icon name="check" size={12}/>}{a}</button>;})}</div></div>

        {/* Bitácora */}
        <div className="rounded-xl border border-slate-200 bg-slate-50 p-3">
          <div className="flex items-center gap-1.5 mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="history" size={14}/> Registrar interacción</div>
          <div className="grid grid-cols-2 gap-2 mb-2"><input type="date" value={nb.fecha} onChange={e=>setNb({...nb,fecha:e.target.value})} className={inp}/><select value={nb.tipo} onChange={e=>setNb({...nb,tipo:e.target.value})} className={inp}>{TIPOS.map(t=><option key={t}>{t}</option>)}</select></div>
          <div className="grid grid-cols-2 gap-2 mb-2">{CONTACTO.map(op=>{const a=nb.contacto===op;const s=op==="Contestó"?(a?"bg-emerald-600 text-white border-emerald-600":"border-stone-300 text-slate-600 hover:bg-emerald-50"):(a?"bg-red-500 text-white border-red-500":"border-stone-300 text-slate-600 hover:bg-red-50");return <button key={op} onClick={()=>setNb({...nb,contacto:op})} className={`rounded-lg border px-2 py-2 text-sm font-medium ${s}`}>{op}</button>;})}</div>
          <textarea value={nb.resultado} onChange={e=>setNb({...nb,resultado:e.target.value})} rows={2} placeholder="¿Qué pasó en esta interacción? (resultado, qué se pidió, siguiente paso…)" className={inp}/>
          <button onClick={addBit} className="mt-2 inline-flex items-center gap-1 rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-800"><Icon name="plus" size={13}/> Agregar a la bitácora</button>
          {bitOrd.length>0 && (<div className="mt-3 space-y-1.5 border-t border-slate-200 pt-2">{bitOrd.map(be=>(<div key={be.id} className="flex items-start gap-2 rounded-md bg-white border border-stone-200 px-2 py-1.5 text-xs"><TipoTag tipo={be.tipo}/><div className="min-w-0 flex-1"><div className="flex items-center gap-1.5"><span className="font-semibold text-slate-600">{corto(be.fecha)}</span><ContactoTag contacto={be.contacto} compacto/></div>{be.resultado && <p className="text-slate-600">{be.resultado}</p>}</div><button onClick={()=>delBit(be.id)} className="text-slate-300 hover:text-red-500"><Icon name="x" size={13}/></button></div>))}</div>)}
        </div>

        <Campo label="Estatus de la solicitud (marca todas las etapas que apliquen)"><div className="flex flex-wrap gap-1.5">{ESTATUS.map(est=>{const on=(f.estatuses||[]).includes(est);return <button key={est} onClick={()=>toggleEst(est)} className={`rounded-full border px-2.5 py-1 text-xs font-medium ${on?ESTATUS_COLOR[est].chip+" ring-2 ring-offset-1 ring-slate-300":"border-stone-300 text-slate-500 hover:bg-stone-50"}`}>{on?"✓ ":""}{est}</button>;})}</div><span className="mt-1.5 block text-[11px] text-slate-400">En el tablero y los conteos aparece según la etapa más avanzada marcada: <span className="font-semibold text-slate-600">{principal(f.estatuses||[])}</span></span></Campo>

        <SolicitudResumen f={f} sinGuardar={solSinGuardar} onAbrir={()=>setSolAbierta(true)}/>
        <div className="rounded-xl border border-stone-200 bg-stone-50 p-3"><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="clip" size={14}/> Requisitos · {f.tipoCliente==="Cliente Recurrente"?"Recurrente":"Nuevo"}</div><span className={`text-xs font-bold mono ${st.completo?"text-emerald-600":"text-indigo-600"}`}>{st.completo?"Completo":`${st.recibido}/${st.aplicables}`}</span></div><p className="text-xs text-slate-400 mb-2">Clic para alternar: <span className="text-slate-500 font-medium">Pendiente → Recibido → No aplica</span> · 📷 escanea con la cámara · 📎 sube archivo o PDF</p><div className="space-y-1.5">{reqListFor(f.tipoCliente).map(k=>{const v=f.requisitos[k]||"pendiente";const s=v==="recibido"?"bg-emerald-600 text-white border-emerald-600":v==="na"?"bg-stone-100 text-slate-400 border-stone-200 line-through":"bg-white border-stone-300 text-slate-600 hover:bg-stone-50";const lista=((f.archivos||{})[k])||[];return (<div key={k} className="rounded-lg border border-stone-200 bg-white p-1.5"><div className="flex items-center gap-1.5"><button onClick={()=>ciclaReq(k)} className={`flex flex-1 min-w-0 items-center gap-1.5 rounded-md border px-2.5 py-1.5 text-xs font-medium text-left ${s}`}><span className="shrink-0">{v==="recibido"?<Icon name="check" size={13}/>:v==="na"?<Icon name="x" size={12}/>:<span className="inline-block h-3 w-3 rounded-full border border-current opacity-40"></span>}</span><span className="truncate">{k}</span>{lista.length>0&&<span className="ml-auto shrink-0 rounded-full bg-black/10 px-1.5 py-0.5 text-[10px] font-bold">{lista.length}</span>}</button><label title="Escanear con la cámara" className="cursor-pointer shrink-0 rounded-md border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">📷<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subirArchivo(k,fl);e.target.value="";}}/></label><label title="Subir archivo o PDF" className="cursor-pointer shrink-0 rounded-md border border-stone-300 bg-white px-2 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50">📎<input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subirArchivo(k,fl);e.target.value="";}}/></label></div>{subiendo===k && <p className="mt-1 text-[11px] font-medium text-sky-600">Subiendo…</p>}{lista.length>0 && <div className="mt-1.5 flex flex-wrap gap-1.5">{lista.map((a,i)=>(<div key={i} className="relative"><a href={a.url} target="_blank" rel="noopener"><img src={`https://drive.google.com/thumbnail?id=${a.id}&sz=w120`} alt={a.nombre} className="h-12 w-12 rounded border border-stone-200 object-cover bg-stone-50"/></a><button onClick={()=>quitarArchivo(k,i)} className="absolute -right-1 -top-1 grid h-4 w-4 place-items-center rounded-full border border-stone-200 bg-white text-slate-400 shadow hover:text-red-500"><Icon name="x" size={9}/></button></div>))}</div>}</div>);})}</div>{f.tipoCliente==="Cliente Recurrente" && <CargaMasiva lista={((f.archivos||{})[DOC_MASIVO])||[]} subiendo={subiendo===DOC_MASIVO} progreso={progMasivo} puedeEditar={puedeEditar} onArchivos={fl=>subirVarios(DOC_MASIVO,fl)} onQuitar={i=>quitarArchivo(DOC_MASIVO,i)}/>}</div>

        <Campo label="Pendiente actual (nota)"><textarea value={f.queFalta} onChange={e=>set("queFalta",e.target.value)} rows={2} placeholder="Algo fuera del expediente (ej. cliente confirma plazo)…" className={inp}/></Campo>
        <div className="rounded-xl border border-stone-200 bg-stone-50 p-3 space-y-3"><div className="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500"><Icon name="alarm" size={14}/> Próximo compromiso de llamada</div><input type="datetime-local" value={f.compromiso} onChange={e=>set("compromiso",e.target.value)} className={inp}/>{f.compromiso && <label className="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" checked={f.compromisoCumplido} onChange={e=>set("compromisoCumplido",e.target.checked)} className="h-4 w-4"/> Ya realicé esta llamada</label>}<p className="text-xs text-slate-400">Con fecha y hora, el cliente se marca en rojo (vencida) o ámbar (por marcar pronto).</p></div>
        <Campo label="Patio de entrega"><select value={f.patioEntrega} onChange={e=>set("patioEntrega",e.target.value)} className={inp}><option value="">— Selecciona patio —</option>{PATIOS.map(p=><option key={p}>{p}</option>)}</select></Campo>
        <div className="grid grid-cols-2 gap-3"><Campo label="Entrega de fábrica o taller" hint="Cuándo llega el equipo"><input type="date" value={f.entregaFabrica} onChange={e=>set("entregaFabrica",e.target.value)} className={inp}/></Campo><Campo label="Fecha de entrega al cliente"><input type="date" value={f.entregaProgramada} onChange={e=>set("entregaProgramada",e.target.value)} className={inp}/></Campo></div>
        <Campo label="Notas (opcional)"><textarea value={f.notas} onChange={e=>set("notas",e.target.value)} rows={2} className={inp}/></Campo>
        {inicial && inicial.id>0 && USUARIO && <BloqueDictamen r={{...inicial,requisitos:f.requisitos,tipoCliente:f.tipoCliente,tipoPersona:f.tipoPersona,estatuses:f.estatuses,enviadoLegal:f.enviadoLegal,abogadoDictamen:f.abogadoDictamen,dictamenLegal:f.dictamenLegal,archivos:f.archivos||inicial.archivos}} expedienteCompleto={listoParaDictamen({...inicial,requisitos:f.requisitos,tipoCliente:f.tipoCliente})} onAplicar={patch=>setF(p=>{const es=Array.from(new Set([...(p.estatuses||[]),...(patch.agregar||[])]));return {...p,...(patch.campos||{}),estatuses:es,estatus:principal(es)};})} onCambio={onCambiado}/>}
        {inicial && inicial.id>0 && USUARIO && <HistorialCambios id={inicial.id}/>}
      </div>
      {solAbierta && <SolicitudAlta f={f} puedeEditar={puedeEditar} subirDoc={subirDesdeSolicitud} onClose={()=>setSolAbierta(false)} onAplicar={(sol,patch)=>{setF(p=>({...p,...patch,solicitud:sol}));setSolSinGuardar(true);setSolAbierta(false);}}/>}
      <div className="sticky bottom-0 flex justify-end gap-2 border-t border-stone-200 bg-white px-5 py-3">{inicial && inicial.id>0 && puedeEditar && !ES_LEGAL() && <button onClick={eliminarTarjeta} disabled={eliminando} className="mr-auto rounded-lg border border-red-200 bg-white px-3.5 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 disabled:opacity-40">{eliminando?"Eliminando…":"🗑 Eliminar tarjeta"}</button>}<button onClick={onClose} className="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cancelar</button><button onClick={()=>valido&&guardarLimpio()} disabled={!valido||!puedeEditar} title={puedeEditar?"":"Modo consulta: no puedes guardar"} className="rounded-lg border border-lime bg-lime px-5 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{inicial?"Guardar cambios":"Crear cliente"}</button></div>
    </div>
  </div>);
}

/* ---------- Carga masiva de documentos (clientes recurrentes) ---------- */
function CargaMasiva({lista,subiendo,progreso,puedeEditar,onArchivos,onQuitar,titulo}){
  const [sobre,setSobre]=useState(false);
  return (<div className="mt-3 rounded-lg border-2 border-dashed border-teal-300 bg-teal-50/50 p-3">
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div className="min-w-0">
        <p className="text-xs font-bold uppercase tracking-wide text-teal-800">{titulo||"Carga masiva de documentos"}{lista.length>0&&<span className="ml-2 rounded-full bg-teal-700 px-2 py-0.5 text-[10px] font-bold text-white">{lista.length}</span>}</p>
        <p className="text-[11px] text-slate-500">Actas, asambleas, poderes y cualquier otro documento que pida Legal. Puedes seleccionar varios a la vez.</p>
      </div>
      {puedeEditar && <label className="cursor-pointer shrink-0 rounded-md border border-teal-600 bg-teal-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-teal-700">📎 Seleccionar archivos
        <input type="file" multiple accept="image/*,application/pdf" className="hidden" onChange={e=>{const fl=Array.from(e.target.files||[]);e.target.value="";if(fl.length)onArchivos(fl);}}/></label>}
    </div>
    {puedeEditar && <div onDragOver={e=>{e.preventDefault();setSobre(true);}} onDragLeave={()=>setSobre(false)}
      onDrop={e=>{e.preventDefault();setSobre(false);const fl=Array.from(e.dataTransfer.files||[]);if(fl.length)onArchivos(fl);}}
      className={`mt-2 hidden sm:block rounded-md border px-3 py-3 text-center text-[11px] ${sobre?"border-teal-500 bg-teal-100 text-teal-800":"border-teal-200 bg-white text-slate-400"}`}>
      Arrastra aquí los archivos (PDF o imagen)</div>}
    {subiendo && <p className="mt-2 text-[11px] font-semibold text-sky-600">{progreso||"Subiendo…"}</p>}
    {lista.length>0
      ? <ul className="mt-2 space-y-1">{lista.map((a,i)=>(<li key={i} className="flex items-center gap-2 rounded border border-stone-200 bg-white px-2 py-1 text-xs">
          <a className="min-w-0 flex-1 truncate font-semibold text-navy underline" href={a.url} target="_blank" rel="noopener">{a.nombre}</a>
          <span className="shrink-0 text-slate-400">{a.fecha}</span>
          {puedeEditar && onQuitar && <button onClick={()=>onQuitar(i)} title="Quitar" className="shrink-0 text-slate-400 hover:text-red-500"><Icon name="x" size={11}/></button>}
        </li>))}</ul>
      : <p className="mt-2 text-[11px] text-slate-400">Sin documentos adicionales cargados.</p>}
  </div>);
}

/* ---------- Ficha reducida para el área legal ---------- */
function FichaLegal({r, onClose, onCambio}){
  const [archivos,setArchivos]=useState(()=>JSON.parse(JSON.stringify(r.archivos||{})));
  const [subiendo,setSubiendo]=useState("");const [nota,setNota]=useState("");
  const [err,setErr]=useState("");const [msg,setMsg]=useState("");const [ocupado,setOcupado]=useState(false);
  const dias=diasDesde(r.enviadoLegal);
  const vencido=enDictamen(r)&&dias!=null&&dias>PLAZO_DICTAMEN;
  const tieneDictamen=((archivos[DOC_DICTAMEN])||[]).length>0;
  async function subir(docKey,file){
    try{setSubiendo(docKey);setErr("");
      const c=await comprimir(file);
      const j=await apiUpload(String(r.cliente||"").trim(), docKey, c.nombre, c.mime, c.b64);
      const nuevos={...archivos,[docKey]:[...((archivos[docKey])||[]),{id:j.id,url:j.url,nombre:c.nombre,fecha:HOY}]};
      setArchivos(nuevos);
      await apiSave({...r, archivos:nuevos});
    }catch(e){setErr("No se pudo subir: "+e.message);}finally{setSubiendo("");}
  }
  const [progMasivo,setProgMasivo]=useState("");
  async function subirVarios(docKey,files){
    let acum={...archivos};const fallos=[];setSubiendo(docKey);setErr("");
    for(let i=0;i<files.length;i++){
      setProgMasivo(`Subiendo ${i+1} de ${files.length}: ${files[i].name}`);
      try{const c=await comprimir(files[i]);const j=await apiUpload(String(r.cliente||"").trim(),docKey,c.nombre,c.mime,c.b64);
        acum={...acum,[docKey]:[...((acum[docKey])||[]),{id:j.id,url:j.url,nombre:c.nombre,fecha:HOY}]};setArchivos(acum);
      }catch(e){fallos.push(files[i].name);}
    }
    try{await apiSave({...r, archivos:acum});}catch(e){setErr("No se pudo guardar: "+e.message);}
    setSubiendo("");setProgMasivo("");
    if(fallos.length)setErr("No se pudieron subir: "+fallos.join(", "));
  }
  async function dictaminar(){
    if(ocupado)return;
    if(!tieneDictamen){setErr("Primero sube el archivo del dictamen.");return;}
    setOcupado(true);setErr("");
    try{ await apiDictaminado(r.id, nota.trim()); setMsg("Dictamen enviado a Servicio a Clientes."); setTimeout(()=>onCambio&&onCambio(),900); }
    catch(e){ setErr(e.message); } finally{ setOcupado(false); }
  }
  const Doc=({k, destacado})=>{
    const lista=(archivos[k])||[];
    return (<div className={`rounded-lg border p-3 ${destacado?"border-lime bg-lime-soft/40":"border-stone-200"}`}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <span className="text-sm font-semibold text-navy">{k}{lista.length>0 && <span className="ml-2 rounded-full bg-navy px-2 py-0.5 text-[10px] font-bold text-white">{lista.length}</span>}</span>
        <div className="flex gap-1.5">
          <label className="cursor-pointer rounded-md border border-emerald-300 bg-emerald-50 px-2.5 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">📷 Cámara
            <input type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subir(k,fl);e.target.value="";}}/></label>
          <label className="cursor-pointer rounded-md border border-stone-300 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50">📎 Archivo
            <input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>{const fl=e.target.files[0];if(fl)subir(k,fl);e.target.value="";}}/></label>
        </div>
      </div>
      {subiendo===k && <p className="mt-1 text-[11px] font-semibold text-sky-600">Subiendo…</p>}
      {lista.length>0
        ? (destacado ? <ArchivosDictamen lista={lista}/> : <ul className="mt-2 space-y-1">{lista.map((a,i)=>(<li key={i} className="text-xs"><a className="font-semibold text-navy underline" href={a.url} target="_blank" rel="noopener">{a.nombre}</a> <span className="text-slate-400">· {a.fecha}</span></li>))}</ul>)
        : <p className="mt-1 text-xs text-slate-400">{destacado?"Sin archivo cargado. Súbelo con 📎 Archivo (PDF o imagen).":"Sin archivo cargado."}</p>}
    </div>);
  };
  return (<div className="fixed inset-0 z-50 flex justify-end" style={{background:"rgba(5,15,30,.55)"}} onClick={onClose}>
    <div className="h-full w-full sm:max-w-2xl overflow-y-auto bg-white shadow-2xl" onClick={e=>e.stopPropagation()}>
      <div className="sticky top-0 z-10 flex items-center justify-between gap-3 border-b-4 border-lime bg-navy px-5 py-3.5" style={{paddingTop:"calc(14px + env(safe-area-inset-top,0px))"}}>
        <div className="min-w-0"><h2 className="font-display text-xl text-white leading-tight truncate">{r.cliente}</h2>
          <p className="text-[12px] truncate" style={{color:"#B9C8DC"}}>Dictamen legal · {r.empresa||"—"}</p></div>
        <button onClick={onClose} aria-label="Cerrar" className="grid h-9 w-9 shrink-0 place-items-center rounded border border-navy-edge text-white hover:bg-navy-2"><Icon name="x" size={18}/></button>
      </div>

      <div className="p-5 space-y-4">
        {enDictamen(r) && <div className={`rounded-lg border border-l-[6px] px-4 py-2 text-sm font-semibold ${vencido?"border-red-500 bg-red-50 text-red-700":"border-lime bg-lime-soft text-navy"}`}>
          {dias==null?"Expediente recibido para dictamen":`Día ${dias} de ${PLAZO_DICTAMEN} para dictaminar${vencido?" · vencido":""}`}</div>}

        <div className="rounded-lg border border-stone-200 p-3">
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Datos del cliente</h3>
          <dl className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
            <div><dt className="text-xs text-slate-500">Cliente</dt><dd className="font-semibold">{r.cliente}</dd></div>
            <div><dt className="text-xs text-slate-500">Tipo de persona</dt><dd className="font-semibold">{r.tipoPersona||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Empresa</dt><dd>{r.empresa||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Ejecutivo</dt><dd>{r.ejecutivo||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Folio de venta</dt><dd className="mono">{r.folioVenta||"—"}</dd></div>
            <div><dt className="text-xs text-slate-500">Tipo de venta</dt><dd>{r.tipoVenta||"—"}{r.plazo?` · ${r.plazo} meses`:""}</dd></div>
            <div className="col-span-2"><dt className="text-xs text-slate-500">Equipos</dt><dd>{equiposTxt(r)||"—"}</dd></div>
            {r.tipoContrato && <div className="col-span-2"><dt className="text-xs text-slate-500">Tipo de contrato</dt><dd>{r.tipoContrato}</dd></div>}
          </dl>
        </div>

        <div>
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Documentos legales</h3>
          <div className="space-y-2">{DOCS_LEGALES.map(k=><Doc key={k} k={k}/>)}</div>
          {(r.tipoCliente==="Cliente Recurrente" || ((archivos[DOC_MASIVO])||[]).length>0) &&
            <CargaMasiva titulo="Documentos adicionales del cliente" lista={(archivos[DOC_MASIVO])||[]} subiendo={subiendo===DOC_MASIVO} progreso={progMasivo} puedeEditar={true} onArchivos={fl=>subirVarios(DOC_MASIVO,fl)}/>}
        </div>

        <div>
          <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Tu dictamen</h3>
          <Doc k={DOC_DICTAMEN} destacado/>
          <textarea rows={3} value={nota} onChange={e=>setNota(e.target.value)} placeholder="Resumen o conclusión del dictamen (opcional)…" className="mt-2 w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-navy focus:ring-2 focus:ring-lime-soft"/>
        </div>

        {err && <p className="rounded-lg border border-l-[6px] border-red-500 bg-red-50 px-3 py-2 text-xs font-semibold text-red-700">{err}</p>}
        {msg && <p className="rounded-lg border border-l-[6px] border-lime bg-lime-soft px-3 py-2 text-xs font-semibold text-navy">{msg}</p>}
      </div>

      <div className="sticky bottom-0 flex flex-wrap items-center justify-end gap-2 border-t border-stone-200 bg-white px-5 py-3" style={{paddingBottom:"calc(12px + env(safe-area-inset-bottom,0px))"}}>
        {!tieneDictamen && <span className="mr-auto text-xs text-slate-400">Sube el archivo del dictamen para poder enviarlo.</span>}
        <button onClick={onClose} className="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cerrar</button>
        <button onClick={dictaminar} disabled={ocupado||!tieneDictamen} className="rounded-lg border border-lime bg-lime px-5 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{ocupado?"Enviando…":"Enviar a Servicio a Clientes"}</button>
      </div>
    </div>
  </div>);
}

/* ---------- Dictamen legal (persona moral) ---------- */
function BloqueDictamen({r, expedienteCompleto, onCambio, onAplicar}){
  const [msg,setMsg]=useState("");const [err,setErr]=useState("");const [ocupado,setOcupado]=useState(false);
  const [nota,setNota]=useState("");
  const [abogado,setAbogado]=useState("");
  const legal=ES_LEGAL();
  const ab=r.abogadoDictamen||null;
  const abTxt=ab&&Array.isArray(ab.nombres)&&ab.nombres.length?ab.nombres.join(" y "):"el área legal";
  const moral=(r.tipoPersona||"")==="Persona moral";
  const dict=r.dictamenLegal||null;
  const dias=diasDesde(r.enviadoLegal);
  const vencido=enDictamen(r)&&dias!=null&&dias>PLAZO_DICTAMEN;
  if(!moral && !enDictamen(r) && !yaDictaminado(r)) return null;
  async function accion(fn,txt,patch){
    if(ocupado)return; setOcupado(true); setErr(""); setMsg("");
    try{ const res=await fn(); setMsg(txt); if(onAplicar&&patch)onAplicar(typeof patch==="function"?patch(res):patch); onCambio&&onCambio(); }
    catch(e){ setErr(e.message); } finally{ setOcupado(false); }
  }
  return (<div className="rounded-lg border border-stone-200 p-3">
    <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
      <h3 className="text-xs font-bold uppercase tracking-wide text-slate-500">Dictamen legal</h3>
      {enDictamen(r) && <span className={`rounded-full px-2 py-0.5 text-[11px] font-bold ${vencido?"bg-red-50 text-red-700":"bg-sky-50 text-sky-700"}`}>
        {dias==null?"En dictamen":`Día ${dias} de ${PLAZO_DICTAMEN}${vencido?" · vencido":""}`}</span>}
    </div>

    {yaDictaminado(r) ? <p className="text-sm">Dictaminado{dict?` por ${dict.por||"—"} · ${String(dict.fecha||"").replace("T"," ")}`:""}.{dict&&dict.nota?<span className="block text-slate-600">{dict.nota}</span>:null}</p>
     : enDictamen(r) ? <p className="text-sm text-slate-600">El expediente está con {abTxt}{r.enviadoLegal?` desde el ${String(r.enviadoLegal).slice(0,10)}`:""}.</p>
     : <p className="text-sm text-slate-600">Cliente persona moral: antes de contratos, el expediente pasa por dictamen legal.</p>}

    {(yaDictaminado(r)||enDictamen(r)) && (()=>{const lista=((r.archivos||{})[DOC_DICTAMEN])||[];
      return lista.length>0 ? <div className="mt-2"><p className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Archivo del dictamen</p><ArchivosDictamen lista={lista}/></div>
        : (yaDictaminado(r) ? <p className="mt-2 text-xs text-amber-700">El abogado no adjuntó archivo de dictamen.</p> : null);})()}

    {legal && enDictamen(r) && <div className="mt-3 space-y-2">
      <textarea rows={3} value={nota} onChange={e=>setNota(e.target.value)} placeholder="Resumen del dictamen (opcional)…" className="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-navy focus:ring-2 focus:ring-lime-soft"/>
      <p className="text-[11px] text-slate-400">Sube el documento del dictamen (PDF) desde tu vista de dictamen, con el botón 📎 Archivo, antes de marcarlo.</p>
      <button onClick={()=>accion(()=>apiDictaminado(r.id,nota.trim()),"Marcado como dictaminado.",{agregar:["Dictaminado"],campos:{dictamenLegal:{fecha:new Date().toISOString().slice(0,16),por:(USUARIO&&USUARIO.nombre)||"",nota:nota.trim()||null}}})} disabled={ocupado} className="rounded-lg border border-lime bg-lime px-4 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{ocupado?"Guardando…":"Marcar como dictaminado"}</button>
    </div>}

    {!legal && moral && !enDictamen(r) && !yaDictaminado(r) && <div className="mt-3">
      <p className="text-[11px] font-bold uppercase tracking-wide text-slate-500 mb-1">¿A quién se envía el dictamen?</p>
      <div className="flex flex-wrap gap-2">
        {ABOGADOS.map(a=><label key={a.correo} className={`cursor-pointer rounded-lg border px-3 py-2 text-sm ${abogado===a.correo?"border-navy bg-navy text-white":"border-stone-300 bg-white text-navy hover:border-navy"}`}>
          <input type="radio" name={`abogado-${r.id}`} value={a.correo} checked={abogado===a.correo} onChange={()=>setAbogado(a.correo)} className="sr-only"/>
          <span className="font-semibold">{a.nombre}</span><span className={`block text-[11px] ${abogado===a.correo?"text-white/80":"text-slate-500"}`}>{a.puesto}</span>
        </label>)}
      </div>
    </div>}

    {!legal && <div className="mt-3 flex flex-wrap gap-2">
      {moral && !enDictamen(r) && !yaDictaminado(r) &&
        <button onClick={()=>{const a=ABOGADOS.find(x=>x.correo===abogado);accion(()=>apiEnviarLegal(r.id,abogado),`Enviado a dictamen: ${a?(a.correo==="ambos"?"Iván Castillo y Juan Carlos Hernández":a.nombre):""}.`,res=>{const para=(res&&res.para)||(abogado==="ambos"?ABOGADOS.filter(x=>x.correo!=="ambos").map(x=>x.correo):[abogado]);const nombres=ABOGADOS.filter(x=>para.map(c=>String(c).toLowerCase()).includes(x.correo.toLowerCase())).map(x=>x.nombre);const loc=new Date().toISOString().slice(0,16);return {agregar:["En Dictamen"],campos:{enviadoLegal:loc,abogadoDictamen:{para,nombres}}};});}} disabled={ocupado||!expedienteCompleto||!abogado}
          title={!expedienteCompleto?"Primero completa el expediente":(!abogado?"Elige a qué abogado enviarlo":"")}
          className="rounded-lg border border-navy bg-navy px-4 py-2 text-sm font-semibold text-white hover:bg-navy-2 disabled:opacity-40">{ocupado?"Enviando…":"Enviar a dictamen legal"}</button>}
      {yaDictaminado(r) &&
        <button onClick={()=>accion(()=>apiEnviarContratos(r.id),"Enviado a Contratos.")} disabled={ocupado}
          className="rounded-lg border border-lime bg-lime px-4 py-2 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-40">{ocupado?"Enviando…":"Enviar a Contratos"}</button>}
      {moral && !enDictamen(r) && !yaDictaminado(r) && !expedienteCompleto &&
        <span className="self-center text-xs text-slate-400">Faltan documentos del expediente (sin contar contrato firmado, contrato en físico y videos de firma, que se recaban después).</span>}
    </div>}

    {msg && <p className="mt-2 rounded-lg border border-l-[6px] border-lime bg-lime-soft px-3 py-2 text-xs font-semibold text-navy">{msg}</p>}
    {err && <p className="mt-2 rounded-lg border border-l-[6px] border-red-500 bg-red-50 px-3 py-2 text-xs font-semibold text-red-700">{err}</p>}
  </div>);
}

/* ---------- Registro de cambios ---------- */
function HistorialCambios({id}){
  const [items,setItems]=useState(null);const [err,setErr]=useState("");
  useEffect(()=>{let vivo=true;apiHistorial(id).then(d=>{if(vivo)setItems(Array.isArray(d)?d:[]);}).catch(e=>{if(vivo)setErr(e.message);});return()=>{vivo=false;};},[id]);
  const fmt=s=>{const d=new Date(s);return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)} ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
  return (<div className="rounded-lg border border-stone-200 p-3">
    <h3 className="text-sm font-bold text-navy mb-2 inline-flex items-center gap-1.5"><Icon name="history" size={15}/> Últimos cambios</h3>
    {err?<p className="text-xs text-red-600">No se pudo cargar el historial: {err}</p>:
     items===null?<p className="text-xs text-slate-400">Cargando…</p>:
     items.length===0?<p className="text-xs text-slate-400">Sin cambios registrados desde que se activaron los usuarios.</p>:
     <ul className="space-y-1">{items.slice(0,10).map((c,i)=>(<li key={i} className="flex flex-wrap items-baseline gap-x-2 text-xs"><span className="font-semibold text-slate-700">{c.usuario||"—"}</span><span className={`rounded px-1.5 py-0.5 text-[10px] font-bold ${c.accion==="alta"?"bg-lime-soft text-lime-ink":"bg-slate-100 text-slate-600"}`}>{c.accion==="alta"?"Alta":"Edición"}</span><span className="text-slate-500">{fmt(c.fecha)}</span></li>))}</ul>}
  </div>);
}

/* ---------- Piezas ---------- */
function Campo({label,children}){return <label className="block"><span className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">{label}</span>{children}</label>;}
function Badges({r}){const es=(r.estatuses&&r.estatuses.length)?r.estatuses:[r.estatus];const ord=es.slice().sort((a,b)=>estIdx(a)-estIdx(b));return <div className="flex flex-wrap gap-1 justify-end max-w-[190px]">{ord.map(e=>{const c=ESTATUS_COLOR[e]||ESTATUS_COLOR[ESTATUS[0]];const p=e===r.estatus&&ord.length>1;return <span key={e} className={`inline-flex items-center rounded-full border px-2 py-0.5 text-[11px] font-medium whitespace-nowrap ${c.chip} ${p?"ring-1 ring-slate-400":""}`}>{e}</span>;})}</div>;}
function Badge({estatus}){const c=ESTATUS_COLOR[estatus]||ESTATUS_COLOR["Nueva"];return <span className={`inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-medium whitespace-nowrap ${c.chip}`}>{estatus}</span>;}
function ContactoTag({contacto,compacto,inline}){const co=contacto==="Contestó";const cls=co?"text-emerald-600":"text-red-500";const dot=co?"bg-emerald-500":"bg-red-500";if(inline)return <span className={`font-semibold ${cls}`}>{contacto}</span>;return <span className={`inline-flex items-center gap-1 text-xs font-medium ${cls}`}><span className={`h-1.5 w-1.5 rounded-full ${dot}`}></span>{!compacto&&contacto}</span>;}
function TableroEtapas({counts,total,activo,onPick}){
  return (
    <div className="mb-5 rounded-xl border border-stone-200 bg-white p-3">
      <div className="flex items-center justify-between mb-2"><h3 className="text-xs font-bold uppercase tracking-wide text-slate-500">Clientes por etapa</h3><span className="text-xs text-slate-400">Total: <span className="mono font-bold text-slate-700">{total}</span></span></div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        {counts.map(({est,n})=>{const c=ESTATUS_COLOR[est];const on=activo===est;return (
          <button key={est} onClick={()=>onPick(est)} className={`rounded-lg border px-2.5 py-2 text-left transition-all ${on?"border-slate-400 ring-2 ring-slate-300 bg-stone-50":"border-stone-200 hover:bg-stone-50"} ${n===0?"opacity-45":""}`}>
            <div className="flex items-center gap-1.5"><span className={`h-2.5 w-2.5 rounded-full ${c.spine}`}></span><span className="text-lg font-bold mono text-slate-900 leading-none">{n}</span></div>
            <p className="mt-1 text-[11px] font-medium text-slate-500 leading-tight">{est}</p>
          </button>);})}
      </div>
    </div>
  );
}
function Kpi({icon,label,valor,tono}){return <div className="rounded-xl border border-stone-200 bg-white px-4 py-3"><div className="flex items-center gap-1.5 text-slate-400"><Icon name={icon} size={16}/><span className="text-xs font-medium text-slate-500">{label}</span></div><p className={`mt-1 text-2xl font-bold mono ${tono}`}>{valor}</p></div>;}
function Tab({activo,onClick,children}){return <button onClick={onClick} className={`rounded-t px-4 py-2.5 text-sm font-semibold ${activo?"bg-navy text-white":"text-slate-500 hover:text-navy"}`} aria-selected={activo}>{children}</button>;}
function Select({value,onChange,options,prefijo}){return <select value={value} onChange={e=>onChange(e.target.value)} className="rounded-lg border border-stone-300 bg-white px-2.5 py-1.5 text-sm text-slate-700 outline-none focus:border-slate-400 max-w-[180px]">{options.map(o=><option key={o} value={o}>{o==="Todos"?`${prefijo}: Todos`:o}</option>)}</select>;}
function Vacio({texto}){return <div className="rounded-xl border border-dashed border-stone-300 bg-white py-12 text-center"><Icon name="calendar" size={28} className="mx-auto text-stone-300"/><p className="mt-2 text-sm text-slate-500 max-w-xs mx-auto">{texto}</p></div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
