function comprimir(file,maxPx,q){maxPx=maxPx||1600;q=q||0.72;return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type)){const fr=new FileReader();fr.onload=()=>res({b64:String(fr.result).split(",")[1],mime:file.type||"application/octet-stream",nombre:file.name||"archivo"});fr.onerror=()=>rej(new Error("no se pudo leer el archivo."));fr.readAsDataURL(file);return;}
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;const s=Math.min(1,maxPx/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    const d=c.toDataURL("image/jpeg",q);
    res({b64:d.split(",")[1],mime:"image/jpeg",nombre:String(file.name||"escaneo").replace(/\.[^.]+$/,"")+".jpg"});

function filaCliente(r){const o={"Ejecutivo":r.ejecutivo,"Cliente":r.cliente,"Folio Venta":r.folioVenta||"","Folio JJ":r.folioJJ||"","Tipo de contrato":r.tipoContrato||"","Tipo de cliente":r.tipoCliente,"Empresa":r.empresa,"Correo":r.correo,"Teléfono":r.telefono,"Equipo":(r.equipos||[]).filter(e=>e.tipo).map(e=>`${e.cantidad||1} x ${e.tipo}`).join(" ; "),"NIV":r.niv||"","Tipo de venta":r.tipoVenta,"Plazo (meses)":r.plazo||"","Adicionales":(r.adicionales||[]).join(", "),"Estatus":((r.estatuses&&r.estatuses.length)?r.estatuses.join(" · "):r.estatus),"Etapa principal":r.estatus};REQ_ALL.forEach(k=>{const v=(r.requisitos||{})[k];o[k]=v==="recibido"?"SI":v==="na"?"NA":"";});o["Pendiente actual"]=r.queFalta;o["Patio de entrega"]=r.patioEntrega||"";o["Entrega de fábrica o taller"]=r.entregaFabrica||"";o["Entrega programada"]=r.entregaProgramada;o["Valor de la venta"]=valorVenta(r);o["Compromiso"]=r.compromiso?r.compromiso.replace("T"," "):"";o["Bitácora"]=(r.bitacora||[]).map(be=>`${be.fecha} | ${be.tipo} | ${be.contacto} | ${be.resultado}`).join(" ;; ");const dg=diasEnGestion(r);o["Días en gestión"]=(dg===null?"":dg);o["Estado gestión"]=(dg===null?"":dg<=20?"En tiempo":dg<=40?"Medio plazo":dg<=60?"Por vencer":"Vencido");o["Notas"]=r.notas;return o;}

function detallePor(registros,cats,keyFn){const aoa=[];const anchor={};cats.forEach(cat=>{const items=registros.filter(r=>keyFn(r)===cat);if(!items.length)return;anchor[cat]=aoa.length+1;aoa.push([`${cat} — ${items.length} cliente(s)`]);aoa.push(["Cliente","Ejecutivo","Empresa","Equipo","Expediente","Última interacción","Entrega","Tipo venta"]);items.forEach(r=>{const st=reqStats(r);const u=ultInter(r);aoa.push([r.cliente,r.ejecutivo,r.empresa,equiposTxt(r),st.completo?"Completo":`${st.recibido}/${st.aplicables}`,u?`${u.fecha} · ${u.tipo} · ${u.contacto}`:"",r.entregaProgramada||"",(r.tipoVenta||"")+(r.plazo?` ${r.plazo}m`:"")]);});aoa.push([]);});return {aoa,anchor};}
function celdaLink(n,sheet,row){if(!sheet||!row)return n;return {f:`HYPERLINK("#${sheet}!A${row}","${n}")`,v:String(n)};}
function aoaConFormulas(R){const ws={};let maxc=0;R.forEach((row,ri)=>row.forEach((cell,ci)=>{maxc=Math.max(maxc,ci);const addr=XLSX.utils.encode_cell({r:ri,c:ci});if(cell&&typeof cell==="object"&&cell.f)ws[addr]={t:"s",f:cell.f,v:cell.v};else if(typeof cell==="number")ws[addr]={t:"n",v:cell};else if(cell!==undefined&&cell!==null&&cell!=="")ws[addr]={t:"s",v:String(cell)};}));ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,R.length-1),c:Math.max(2,maxc)}});ws["!cols"]=[{wch:36},{wch:16},{wch:36}];return ws;}
function construirDashboard(registros,ancE,ancJ){const R=[];const cnt=fn=>registros.filter(fn).length;R.push(["SEGUIMIENTO A CLIENTES · HT RENT — DASHBOARD"]);R.push(["Generado: "+HOY]);R.push([]);R.push(["RESUMEN GENERAL"]);R.push(["Total de clientes",registros.length]);R.push(["Expedientes completos",cnt(r=>reqStats(r).completo)]);R.push(["Expedientes por completar",cnt(r=>!CERRADOS.includes(r.estatus)&&!reqStats(r).completo)]);R.push(["Entregas próximas (7 días)",cnt(r=>r.entregaProgramada&&r.entregaProgramada>=HOY&&r.entregaProgramada<=addDays(HOY,7))]);R.push(["Llamadas pendientes",cnt(r=>estadoCompromiso(r,Date.now()))]);R.push([]);R.push(["CLIENTES POR ETAPA","","clic en el número para ver el detalle"]);ESTATUS.forEach(e=>{const n=cnt(r=>r.estatus===e);R.push([e,celdaLink(n,"DetalleEtapa",ancE[e])]);});R.push([]);R.push(["CLIENTES POR EJECUTIVO","","clic en el número para ver el detalle"]);[...new Set(registros.map(r=>r.ejecutivo).filter(Boolean))].sort().forEach(j=>{const n=cnt(r=>r.ejecutivo===j);R.push([j,celdaLink(n,"DetalleEjecutivo",ancJ[j])]);});R.push([]);R.push(["POR TIPO DE VENTA"]);TIPOVENTA.forEach(t=>{const n=cnt(r=>r.tipoVenta===t);if(n)R.push([t,n]);});R.push([]);R.push(["POR TIPO DE CLIENTE"]);TIPO_CLIENTE.forEach(t=>R.push([t,cnt(r=>r.tipoCliente===t)]));R.push([]);R.push(["POR EMPRESA"]);[...new Set(registros.map(r=>r.empresa).filter(Boolean))].sort().forEach(e=>R.push([e,cnt(r=>r.empresa===e)]));return aoaConFormulas(R);}
function construirLibro(registros){const wb=XLSX.utils.book_new();const de=detallePor(registros,ESTATUS,r=>r.estatus);const ej=[...new Set(registros.map(r=>r.ejecutivo).filter(Boolean))].sort();const dj=detallePor(registros,ej,r=>r.ejecutivo);const wsDash=construirDashboard(registros,de.anchor,dj.anchor);const wsCli=XLSX.utils.json_to_sheet(registros.map(filaCliente));const wsDE=XLSX.utils.aoa_to_sheet(de.aoa.length?de.aoa:[["Sin datos"]]);const wsDJ=XLSX.utils.aoa_to_sheet(dj.aoa.length?dj.aoa:[["Sin datos"]]);XLSX.utils.book_append_sheet(wb,wsDash,"Dashboard");XLSX.utils.book_append_sheet(wb,wsCli,"Clientes");XLSX.utils.book_append_sheet(wb,wsDE,"DetalleEtapa");XLSX.utils.book_append_sheet(wb,wsDJ,"DetalleEjecutivo");return wb;}

function Puerta({onEntrar}){
  const [modoAcc,setModoAcc]=useState("usuario");
  const [correo,setCorreo]=useState("");const [v,setV]=useState("");const [err,setErr]=useState("");const [verif,setVerif]=useState(true);
  const inpP="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none focus:border-navy focus:ring-2 focus:ring-lime-soft";
  async function conSesion(){
    const acc=await apiMiAcceso();
    if(!acc||!acc.nivel){setErr("Tu usuario no tiene acceso a Servicio a Clientes. Pide a un administrador que te asigne un rol en Plataforma HT.");return false;}
    USUARIO={nombre:acc.nombre||acc.correo||"",correo:acc.correo||"",nivel:acc.nivel,legal:!!acc.legal};SESION_PASS="";
    onEntrar(acc.nivel==="lectura"?"ver":"edit");return true;
  }
  useEffect(()=>{(async()=>{try{const {data}=await sb.auth.getSession();if(data&&data.session){await conSesion();}}catch(e){setErr("No se pudo verificar tu sesión: "+e.message);}finally{setVerif(false);}})();},[]);
  const entrarUsuario=async()=>{if(verif)return;const c=correo.trim(),p=v;if(!c||!p){setErr("Escribe tu correo y tu contraseña.");return;}setVerif(true);setErr("");
    try{const {error}=await sb.auth.signInWithPassword({email:c,password:p});
      if(error){setErr(/invalid/i.test(error.message)?"Ese correo y contraseña no coinciden. Son los mismos de Plataforma HT.":"No se pudo entrar: "+error.message);return;}
      await conSesion();
    }catch(e){setErr("No se pudo conectar con el servidor: "+e.message);}finally{setVerif(false);}};
  const entrarEquipo=async()=>{const p=v.trim();if(!p||verif)return;setVerif(true);setErr("");
    try{const nivel=await apiLogin(p);
      if(nivel==="edit"||nivel==="ver"){USUARIO=null;SESION_PASS=p;onEntrar(nivel);return;}
      setErr("Contraseña incorrecta.");
    }catch(e){setErr("No se pudo conectar con el servidor: "+e.message);}finally{setVerif(false);}};
  const enter=e=>{if(e.key==="Enter")(modoAcc==="usuario"?entrarUsuario():entrarEquipo());};
  return (<div className="grid min-h-screen place-items-center bg-navy px-5">
    <div className="w-full max-w-sm overflow-hidden rounded-lg border-2 border-navy-edge bg-white shadow-xl">
      <div className="border-b-[5px] border-lime bg-navy px-6 py-5">
        <div className="marca-ht" style={{display:"block"}}><b>HT RENT &gt;</b><span>ARRENDA Y CRECE</span></div>
      </div>
      <div className="p-6">
        <div className="mb-4"><h1 className="font-display text-2xl leading-tight text-navy">Seguimiento a Clientes</h1><p className="text-sm text-slate-500 mt-1">Módulo de Plataforma HT</p></div>
        {modoAcc==="usuario" ? (<div>
          <p className="mb-3 text-sm text-slate-500">Entra con tu usuario de Plataforma HT.</p>
          <label className="block text-xs font-semibold text-slate-600 mb-1">Correo</label>
          <input type="email" value={correo} autoFocus autoComplete="username" onChange={e=>{setCorreo(e.target.value);setErr("");}} onKeyDown={enter} className={inpP} placeholder="Tu correo de trabajo"/>
          <label className="block text-xs font-semibold text-slate-600 mb-1 mt-3">Contraseña</label>
          <input type="password" value={v} autoComplete="current-password" onChange={e=>{setV(e.target.value);setErr("");}} onKeyDown={enter} className={inpP}/>
        </div>) : (<div>
          <p className="mb-3 text-sm text-slate-500">Contraseña de equipo (solo durante la transición).</p>
          <input type="password" value={v} autoFocus onChange={e=>{setV(e.target.value);setErr("");}} onKeyDown={enter} className={inpP} placeholder="Contraseña de equipo"/>
        </div>)}
        {err && <p className="mt-2 text-xs font-semibold text-red-600">{err}</p>}
        <button onClick={modoAcc==="usuario"?entrarUsuario:entrarEquipo} disabled={verif} className="mt-4 w-full rounded-lg border border-lime bg-lime px-4 py-2.5 text-sm font-bold text-lime-dark hover:brightness-95 disabled:opacity-60">{verif?"Verificando…":"Entrar"}</button>
        <div className="mt-4 flex items-center justify-between gap-2 text-xs">
          <button onClick={()=>{setModoAcc(modoAcc==="usuario"?"equipo":"usuario");setV("");setErr("");}} className="font-semibold text-slate-500 underline hover:text-navy">{modoAcc==="usuario"?"Usar contraseña de equipo":"Entrar con mi usuario"}</button>
          <a href={PLATAFORMA_URL} className="font-semibold text-navy hover:underline">Ir a Plataforma HT</a>
        </div>
      </div>
    </div>
  </div>);
}

function VentasEntregas({registros,fEjec,ejecutivos}){
  const [anio,setAnio]=useState("Todos");
  const base=fEjec==="Todos"?registros:registros.filter(r=>r.ejecutivo===fEjec);
  const aniosSet=new Set();
  base.forEach(r=>{const v=mesDe(r.creado);if(v)aniosSet.add(v.anio);const e=fueEntregado(r)?mesDe(fechaEntrega(r)):null;if(e)aniosSet.add(e.anio);});
  const anios=[...aniosSet].sort((a,b)=>b-a);
  const okAnio=y=>anio==="Todos"||String(y)===anio;

  let ventasDinero=0,ventasUn=0,ventasNum=0,entrDinero=0,entrUn=0,entrNum=0;
  const porMes={}; const porEjec={};
  const addMes=(k,campo,dinero,un)=>{if(!porMes[k])porMes[k]={ventasD:0,ventasU:0,entrD:0,entrU:0};porMes[k][campo+"D"]+=dinero;porMes[k][campo+"U"]+=un;};
  const addEjec=(e,campo,dinero,un)=>{if(!porEjec[e])porEjec[e]={ventasD:0,ventasU:0,ventasN:0,entrD:0,entrU:0,entrN:0};porEjec[e][campo+"D"]+=dinero;porEjec[e][campo+"U"]+=un;porEjec[e][campo+"N"]+=1;};

  base.forEach(r=>{
    const val=valorVenta(r),un=unidades(r),ej=r.ejecutivo||"(sin ejecutivo)";
    const mv=mesDe(r.creado);
    if(mv&&okAnio(mv.anio)){ventasDinero+=val;ventasUn+=un;ventasNum++;addMes(mv.key,"ventas",val,un);addEjec(ej,"ventas",val,un);}
    if(fueEntregado(r)){const me=mesDe(fechaEntrega(r));if(me&&okAnio(me.anio)){entrDinero+=val;entrUn+=un;entrNum++;addMes(me.key,"entr",val,un);addEjec(ej,"entr",val,un);}}
  });

  const mesesOrden=Object.keys(porMes).sort();
  const maxMes=Math.max(1,...mesesOrden.map(k=>Math.max(porMes[k].ventasD,porMes[k].entrD)));
  const ejecs=Object.keys(porEjec).sort((a,b)=>porEjec[b].ventasD-porEjec[a].ventasD);
  const nombreMes=k=>{const[a,m]=k.split("-").map(Number);return MESES_V[m-1]+" "+a;};

  const KpiV=({label,dinero,unidades,num,tono})=>(<div className="rounded-xl border border-stone-200 bg-white px-4 py-3"><p className="text-xs font-medium text-slate-500">{label}</p><p className={`mt-1 text-2xl font-bold mono ${tono}`}>{pesos(dinero)}</p><p className="text-[11px] text-slate-400 mt-0.5">{num} operación(es) · {unidades} unidad(es)</p></div>);

  return (<div className="space-y-5">
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div><h2 className="text-lg font-bold text-slate-900">Ventas y Entregas</h2><p className="text-xs text-slate-500">Ventas por fecha de alta · Entregas por fecha de entrega{fEjec!=="Todos"?" · "+fEjec:""}</p></div>
      <select value={anio} onChange={e=>setAnio(e.target.value)} className="rounded-lg border border-stone-300 px-3 py-2 text-sm"><option>Todos</option>{anios.map(a=><option key={a}>{a}</option>)}</select>
    </div>

    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <KpiV label="Total vendido" dinero={ventasDinero} unidades={ventasUn} num={ventasNum} tono="text-slate-900"/>
      <KpiV label="Total entregado" dinero={entrDinero} unidades={entrUn} num={entrNum} tono="text-teal-600"/>
    </div>

    <div className="rounded-xl border border-stone-200 bg-white p-4">
      <h3 className="text-sm font-bold text-slate-700 mb-3">Por mes</h3>
      {mesesOrden.length===0?<p className="text-xs text-slate-400">Sin datos todavía.</p>:
      <div className="space-y-2.5">{mesesOrden.map(k=>(<div key={k}>
        <div className="flex justify-between text-xs mb-0.5"><span className="font-semibold text-slate-600">{nombreMes(k)}</span></div>
        <div className="flex items-center gap-1.5"><span className="w-16 text-[10px] text-slate-400">Vendido</span><div className="flex-1 h-4 rounded bg-stone-100 overflow-hidden"><div className="h-full bg-slate-500" style={{width:`${porMes[k].ventasD/maxMes*100}%`}}></div></div><span className="w-24 text-right mono text-[11px] font-semibold text-slate-600">{pesos(porMes[k].ventasD)}</span></div>
        <div className="flex items-center gap-1.5 mt-0.5"><span className="w-16 text-[10px] text-slate-400">Entregado</span><div className="flex-1 h-4 rounded bg-stone-100 overflow-hidden"><div className="h-full bg-teal-500" style={{width:`${porMes[k].entrD/maxMes*100}%`}}></div></div><span className="w-24 text-right mono text-[11px] font-semibold text-teal-600">{pesos(porMes[k].entrD)}</span></div>
      </div>))}</div>}
    </div>

    <div className="rounded-xl border border-stone-200 bg-white overflow-hidden">
      <h3 className="text-sm font-bold text-slate-700 p-4 pb-2">Por ejecutivo</h3>
      <div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-stone-50 text-left text-xs uppercase text-slate-500"><tr><th className="px-3 py-2">Ejecutivo</th><th className="px-3 py-2 text-right">Vendido</th><th className="px-3 py-2 text-right">Ventas</th><th className="px-3 py-2 text-right">Entregado</th><th className="px-3 py-2 text-right">Entregas</th></tr></thead>
      <tbody className="divide-y divide-stone-100">{ejecs.map(e=>(<tr key={e} className="hover:bg-stone-50"><td className="px-3 py-2 font-medium">{e}</td><td className="px-3 py-2 text-right mono">{pesos(porEjec[e].ventasD)}</td><td className="px-3 py-2 text-right text-slate-500">{porEjec[e].ventasN} · {porEjec[e].ventasU}u</td><td className="px-3 py-2 text-right mono text-teal-700">{pesos(porEjec[e].entrD)}</td><td className="px-3 py-2 text-right text-slate-500">{porEjec[e].entrN} · {porEjec[e].entrU}u</td></tr>))}
      {ejecs.length===0&&<tr><td colSpan={5} className="px-3 py-6 text-center text-slate-400">Sin datos.</td></tr>}</tbody>
      {ejecs.length>0&&<tfoot className="bg-stone-50 font-bold"><tr><td className="px-3 py-2">Total</td><td className="px-3 py-2 text-right mono">{pesos(ventasDinero)}</td><td className="px-3 py-2 text-right text-slate-500">{ventasNum} · {ventasUn}u</td><td className="px-3 py-2 text-right mono text-teal-700">{pesos(entrDinero)}</td><td className="px-3 py-2 text-right text-slate-500">{entrNum} · {entrUn}u</td></tr></tfoot>}
      </table></div>
    </div>
    <p className="text-[11px] text-slate-400">El valor de cada cliente se calcula con el precio de sus equipos (catálogo, editable en la ficha). Una venta = alta del cliente; una entrega = cliente marcado como Entregado.</p>
  </div>);
}

/* ============================================================
   EQUIPOS EN GESTIÓN — informe para Operaciones
   Qué tipo de unidades traemos en gestión (clientes abiertos),
   cuándo se espera entregarlas y dónde, para que Operaciones
   prepare/repare con anticipación. Todo se calcula en el
   navegador con los registros de la app (solo lectura).
   ============================================================ */
const EOP_HORIZ=[["inm","Vencida / ≤7 días",0,7],["d15","8–15 días",8,15],["d30","16–30 días",16,30],["d60","31–60 días",31,60],["m60","Más de 60 días",61,1e9]];
const EOP_PRIOS=["Alta","Media","Baja"];
const EOP_PISO={"Presentación con Cliente":30,"Documentando":20,"En Dictamen":15,"Dictaminado":10,"Asignación y Contrato":7,"Contrato enviado":5,"Contrato recibido":3,"Equipo listo":2,"Programación entrega":1,"Pend. entrega Fábrica":1,"Pend. entrega Cliente":1};
function eopCond(e){if(!e||!e.condicion)return "Sin dato";const c=condLabel(e.marca,e.condicion);return c==="Usado"?"Usado / recuperado":c;}
function eopPendientes(r){
  const lineas=(r.equipos||[]).filter(e=>e&&e.tipo).map(e=>({e,n:Number(e.cantidad)||1}));
  const tot=lineas.reduce((s,x)=>s+x.n,0);if(!tot)return [];
  const pend=r.entregaModo==="parcial"?faltanCli(r):tot;
  if(pend>=tot)return lineas;
  if(pend<=0)return [];
  const base=lineas.map(x=>({...x,q:x.n*pend/tot}));
  base.forEach(x=>{x.k=Math.floor(x.q);});
  let resto=pend-base.reduce((s,x)=>s+x.k,0);
  base.slice().sort((a,b)=>(b.q-b.k)-(a.q-a.k)).forEach(x=>{if(resto>0){x.k++;resto--;}});
  return base.filter(x=>x.k>0).map(x=>({e:x.e,n:x.k}));
}
function eopPrioridad(r,dias){
  if(esDevuelto(r))return "Baja";
  const et=etapaAbierta(r);
  if(r.entregaProgramada&&dias!=null&&dias<=15)return "Alta";
  if(et==="Entrega parcial"||estIdx(et)>=estIdx("Asignación y Contrato"))return "Alta";
  if(["Documentando","En Dictamen","Dictaminado"].includes(et))return "Media";
  return "Baja";
}
function eopHorizonte(d){if(d==null)return "m60";for(const [k,,a,b] of EOP_HORIZ)if(d<=b)return k;return "m60";}
const eopFecha=d=>d?pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear():"";
const eopSug=(c)=>{
  const listo=c.prio.Alta, pronto=c.h.inm+c.h.d15;
  if(!c.u)return "";
  if(/^Nuevo/.test(c.cond))return listo?`Confirmar con fábrica ${listo} unidad(es) nuevas de prioridad alta`:"Unidades nuevas: seguimiento con fábrica";
  if(listo||pronto)return `Tener listas ${Math.max(listo,pronto)} unidad(es) en las próximas 2 semanas`+(c.u>Math.max(listo,pronto)?`; programar ${c.u-Math.max(listo,pronto)} más`:"");
  return `Programar reparación de ${c.u} unidad(es) a mediano plazo`;
};

function EquiposGestion({registros,now}){
  const [empresa,setEmpresa]=useState("Todas");
  const [condF,setCondF]=useState("Todas");
  const [conDev,setConDev]=useState("no");
  const [abierto,setAbierto]=useState(null);
  const [bajando,setBajando]=useState(false);
  const hoy=useMemo(()=>{const d=new Date(now);d.setHours(0,0,0,0);return d;},[now]);
  const empresas=useMemo(()=>["Todas",...[...new Set(registros.map(r=>r.empresa).filter(Boolean))].sort()],[registros]);

  /* Promedios históricos: días de alta a entrega y unidades entregadas por mes (últimos 6 meses) */
  const hist=useMemo(()=>{
    const dias={},todos=[],mes={};
    const desde=new Date(hoy);desde.setMonth(desde.getMonth()-6);
    registros.forEach(r=>{
      if(empresa!=="Todas"&&r.empresa!==empresa)return;
      if(seccDe(r)!=="entregados")return;
      const d=diasAltaEntrega(r);const ep=equipoPrincipal(r);
      if(d!=null){todos.push(d);if(ep){const f=familiaEquipo(ep.tipo);(dias[f]=dias[f]||[]).push(d);}}
      const fe=fT(fechaEntrega(r));
      if(fe&&fe>=desde&&fe<=new Date(now))(r.equipos||[]).filter(e=>e&&e.tipo).forEach(e=>{const k=familiaEquipo(e.tipo)+"|"+eopCond(e);mes[k]=(mes[k]||0)+(Number(e.cantidad)||1);});
    });
    const promFam={};Object.keys(dias).forEach(f=>{promFam[f]={p:prom(dias[f]),n:dias[f].length};});
    const mensual={};Object.keys(mes).forEach(k=>{mensual[k]=mes[k]/6;});
    return {promFam,promGen:prom(todos),nGen:todos.length,mensual};
  },[registros,empresa,hoy,now]);

  /* Detalle: una fila por línea de equipo pendiente de entregar */
  const filas=useMemo(()=>{
    const out=[];
    registros.forEach(r=>{
      const s=seccDe(r);
      if(!(s==="activos"||(conDev==="si"&&s==="devueltos")))return;
      if(empresa!=="Todas"&&r.empresa!==empresa)return;
      const ini=inicioGestion(r);const antig=ini?Math.max(0,Math.floor(difD(ini,hoy))):null;
      const et=etapaAbierta(r);
      eopPendientes(r).forEach(({e,n})=>{
        const fam=familiaEquipo(e.tipo),cond=eopCond(e);
        if(condF!=="Todas"&&cond!==condF)return;
        let fecha,origen;
        const fp=fT(r.entregaProgramada);
        if(fp){fecha=fp;origen=fp<hoy?"Programada (vencida)":"Programada";}
        else{
          const pf=hist.promFam[fam];const pr=pf&&pf.n>=3?pf.p:hist.promGen;
          const piso=EOP_PISO[et]!=null?EOP_PISO[et]:7;
          const rest=Math.max(piso,Math.round((pr!=null?pr:45)-(antig||0)));
          fecha=new Date(hoy.getTime()+rest*DIA_MS);origen=pf&&pf.n>=3?"Estimada (prom. del tipo)":"Estimada (prom. general)";
        }
        const dias=Math.round(difD(hoy,fecha));
        out.push({r,cliente:r.cliente||"",ejec:ejecDe(r),empresa:r.empresa||"",etapa:esDevuelto(r)?"Devuelto a comercial":et,fam,cond,tipo:e.tipo,marca:e.marca||"",anio:e.anio||"",n,patio:r.patioEntrega||"Sin patio",fecha,origen,dias,h:eopHorizonte(Math.max(0,dias)),prio:eopPrioridad(r,dias),antig});
      });
    });
    return out.sort((a,b)=>EOP_PRIOS.indexOf(a.prio)-EOP_PRIOS.indexOf(b.prio)||a.fecha-b.fecha);
  },[registros,empresa,condF,conDev,hist,hoy]);

  const resumen=useMemo(()=>{
    const m={};
    filas.forEach(x=>{
      const k=x.fam+"|"+x.cond;
      const c=m[k]=m[k]||{k,fam:x.fam,cond:x.cond,u:0,cli:new Set(),prio:{Alta:0,Media:0,Baja:0},h:{inm:0,d15:0,d30:0,d60:0,m60:0},patios:{},tipos:{}};
      c.u+=x.n;c.cli.add(x.r.id);c.prio[x.prio]+=x.n;c.h[x.h]+=x.n;c.patios[x.patio]=(c.patios[x.patio]||0)+x.n;c.tipos[x.tipo]=(c.tipos[x.tipo]||0)+x.n;
    });
    return Object.values(m).map(c=>{
      const pf=hist.promFam[c.fam];
      return {...c,nCli:c.cli.size,promDias:pf?pf.p:null,promN:pf?pf.n:0,mensual:hist.mensual[c.k]||0,sug:eopSug(c)};
    }).sort((a,b)=>b.u-a.u||a.k.localeCompare(b.k));
  },[filas,hist]);

  const patios=useMemo(()=>{
    const m={},fams=new Set();
    filas.forEach(x=>{fams.add(x.fam);const p=m[x.patio]=m[x.patio]||{patio:x.patio,u:0,f:{},alta:0};p.u+=x.n;p.f[x.fam]=(p.f[x.fam]||0)+x.n;if(x.prio==="Alta")p.alta+=x.n;});
    const famsOrd=[...fams].sort((a,b)=>filas.filter(x=>x.fam===b).reduce((s,x)=>s+x.n,0)-filas.filter(x=>x.fam===a).reduce((s,x)=>s+x.n,0));
    return {rows:Object.values(m).sort((a,b)=>(a.patio==="Sin patio")-(b.patio==="Sin patio")||b.u-a.u),fams:famsOrd};
  },[filas]);

  const tot=useMemo(()=>{
    const t={u:0,cli:new Set(),usado:0,nuevo:0,alta:0,d15:0,d30:0,sinCond:0};
    filas.forEach(x=>{t.u+=x.n;t.cli.add(x.r.id);if(/^Usado|^Seminuevo/.test(x.cond))t.usado+=x.n;if(x.cond==="Nuevo")t.nuevo+=x.n;if(x.cond==="Sin dato")t.sinCond+=x.n;if(x.prio==="Alta")t.alta+=x.n;if(x.dias<=15)t.d15+=x.n;if(x.dias<=30)t.d30+=x.n;});
    t.nCli=t.cli.size;return t;
  },[filas]);

  const lectura=useMemo(()=>{
    const L=[];if(!tot.u)return L;
    const top=resumen[0];
    L.push(`Traemos ${tot.u} unidad(es) pendientes de entregar en ${tot.nCli} cliente(s); ${pctTxt(tot.usado,tot.u)} son usadas/recuperadas o seminuevas y ${pctTxt(tot.nuevo,tot.u)} nuevas.`);
    if(top)L.push(`El tipo con más demanda es ${top.fam} (${top.cond.toLowerCase()}): ${top.u} unidad(es), ${top.prio.Alta} de prioridad alta.`);
    const usadoAlta=resumen.filter(c=>/^Usado|^Seminuevo/.test(c.cond)&&c.prio.Alta>0).sort((a,b)=>b.prio.Alta-a.prio.Alta);
    if(usadoAlta.length)L.push(`Para taller (usadas con prioridad alta): ${usadoAlta.slice(0,4).map(c=>`${c.prio.Alta} ${c.fam} ${c.cond.toLowerCase()}`).join(", ")}.`);
    L.push(`En los próximos 15 días se esperan ${tot.d15} unidad(es) y en 30 días ${tot.d30} (fechas programadas o estimadas con el promedio histórico).`);
    const sobre=resumen.filter(c=>c.mensual>0&&c.cond!=="Sin dato"&&(c.h.inm+c.h.d15+c.h.d30)>c.mensual*1.3).sort((a,b)=>(b.h.inm+b.h.d15+b.h.d30)/b.mensual-(a.h.inm+a.h.d15+a.h.d30)/a.mensual);
    if(sobre.length)L.push(`Por encima de lo que normalmente se entrega al mes: ${sobre.slice(0,3).map(c=>`${c.fam} ${c.cond.toLowerCase()} (${c.h.inm+c.h.d15+c.h.d30} en 30 d vs ${Math.round(c.mensual*10)/10}/mes)`).join("; ")}.`);
    const pTop=patios.rows.find(p=>p.patio!=="Sin patio");if(pTop)L.push(`El patio con más unidades por preparar es ${pTop.patio} (${pTop.u}).`);
    if(tot.sinCond)L.push(`${tot.sinCond} unidad(es) no tienen condición capturada (nuevo/usado); conviene completarla en la ficha del cliente.`);
    return L;
  },[tot,resumen,patios]);

  const descargar=async()=>{
    setBajando(true);
    try{
      await solCargarScript(SOL_EXCELJS);
      const wb=new window.ExcelJS.Workbook();
      const hdr=ws=>{const r=ws.getRow(1);r.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF0B3D66"}};c.alignment={vertical:"middle",wrapText:true};});r.height=30;ws.views=[{state:"frozen",ySplit:1}];ws.autoFilter={from:{row:1,column:1},to:{row:1,column:ws.columnCount}};};
      const filtros=`Empresa: ${empresa} · Condición: ${condF} · Devueltos a comercial: ${conDev==="si"?"incluidos":"no incluidos"} · Generado ${eopFecha(new Date())}`;

      const w1=wb.addWorksheet("Resumen por tipo");
      w1.columns=[{header:"Tipo de equipo",width:26},{header:"Condición",width:18},{header:"Unidades en gestión",width:12},{header:"Clientes",width:10},{header:"Prioridad alta",width:10},{header:"Prioridad media",width:10},{header:"Prioridad baja",width:10},{header:"Vencida / ≤7 días",width:11},{header:"8–15 días",width:10},{header:"16–30 días",width:10},{header:"31–60 días",width:10},{header:"Más de 60 días",width:10},{header:"Entregas prom./mes (6 m)",width:12},{header:"Días prom. alta→entrega",width:12},{header:"Patios",width:34},{header:"Sugerencia para Operaciones",width:60}];
      resumen.forEach(c=>w1.addRow([c.fam,c.cond,c.u,c.nCli,c.prio.Alta,c.prio.Media,c.prio.Baja,c.h.inm,c.h.d15,c.h.d30,c.h.d60,c.h.m60,Math.round(c.mensual*10)/10,c.promDias!=null?Math.round(c.promDias):"",Object.entries(c.patios).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`${p} (${n})`).join(", "),c.sug]));
      const tr=w1.addRow(["TOTAL","",tot.u,tot.nCli,...EOP_PRIOS.map(p=>resumen.reduce((s,c)=>s+c.prio[p],0)),...EOP_HORIZ.map(([k])=>resumen.reduce((s,c)=>s+c.h[k],0)),"","","",""]);tr.font={bold:true};
      hdr(w1);
      w1.addRow([]);w1.addRow(["Lectura rápida"]).font={bold:true};lectura.forEach(x=>w1.addRow([x]));
      w1.addRow([]);w1.addRow([filtros]).font={italic:true,color:{argb:"FF64748B"}};
      w1.addRow(["Prioridad alta = cliente en Asignación y Contrato o etapa posterior, entrega parcial, o con entrega programada en ≤15 días. Media = Documentando / Dictamen. Baja = Presentación o devuelto a comercial."]).font={italic:true,color:{argb:"FF64748B"}};
      w1.addRow(["Fecha estimada: si no hay entrega programada, se usa el promedio histórico de días de alta a entrega del tipo de equipo (o el general) menos los días que lleva el cliente en gestión."]).font={italic:true,color:{argb:"FF64748B"}};

      const w2=wb.addWorksheet("Por patio");
      w2.columns=[{header:"Patio de entrega",width:26},{header:"Unidades",width:10},{header:"Prioridad alta",width:10},...patios.fams.map(f=>({header:f,width:14}))];
      patios.rows.forEach(p=>w2.addRow([p.patio,p.u,p.alta,...patios.fams.map(f=>p.f[f]||0)]));
      hdr(w2);

      const w3=wb.addWorksheet("Detalle");
      w3.columns=[{header:"Prioridad",width:10},{header:"Cliente",width:34},{header:"Ejecutivo",width:20},{header:"Empresa",width:10},{header:"Etapa",width:22},{header:"Tipo de equipo",width:22},{header:"Descripción",width:40},{header:"Marca",width:10},{header:"Año",width:7},{header:"Condición",width:16},{header:"Unidades pendientes",width:11},{header:"Patio de entrega",width:22},{header:"Fecha de entrega",width:12},{header:"Origen de la fecha",width:22},{header:"Días para entrega",width:10},{header:"Días en gestión",width:10}];
      filas.forEach(x=>{const row=w3.addRow([x.prio,x.cliente,x.ejec,x.empresa,x.etapa,x.fam,x.tipo,x.marca,x.anio,x.cond,x.n,x.patio,x.fecha,x.origen,x.dias,x.antig==null?"":x.antig]);row.getCell(13).numFmt="dd/mm/yyyy";if(x.prio==="Alta")row.getCell(1).font={bold:true,color:{argb:"FFB91C1C"}};});
      hdr(w3);

      const buf=await wb.xlsx.writeBuffer();
      const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`Equipos en gestion - Operaciones ${toISO(new Date())}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
    }catch(e){alert("No se pudo generar el Excel: "+e.message);}
    setBajando(false);
  };

  const prioCls={Alta:"bg-red-100 text-red-700",Media:"bg-amber-100 text-amber-700",Baja:"bg-slate-100 text-slate-600"};
  const th="px-2 py-2 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-500";
  const thr=th+" text-right";
  const td="px-2 py-1.5 text-sm text-slate-700";
  const tdr="px-2 py-1.5 text-right mono text-sm text-slate-700";
  const num=v=>v?v:<span className="text-slate-300">–</span>;

  return (<div className="space-y-5">
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div><h2 className="text-lg font-bold text-slate-900">Equipos en gestión</h2><p className="text-xs text-slate-500">Qué unidades traemos con clientes en proceso y cuándo se esperan entregar, para que Operaciones prepare y repare con anticipación</p></div>
      <div className="flex flex-wrap items-center gap-2">
        <SelPanel v={empresa} set={setEmpresa} pre="Empresa" opts={empresas}/>
        <SelPanel v={condF} set={setCondF} pre="Condición" opts={["Todas","Usado / recuperado","Seminuevo","Nuevo","Sin dato"]}/>
        <SelPanel v={conDev} set={setConDev} pre="Devueltos a comercial" opts={[["no","No incluir"],["si","Incluir"]]}/>
        <button onClick={descargar} disabled={bajando||!filas.length} className="inline-flex items-center gap-1.5 rounded-lg border border-navy-edge bg-navy px-3.5 py-1.5 text-sm font-semibold text-white hover:bg-navy-2 disabled:opacity-50"><Icon name="download" size={15}/>{bajando?"Generando…":"Descargar Excel"}</button>
      </div>
    </div>

    {!filas.length?<div className="rounded-xl border border-stone-200 bg-white p-8 text-center text-slate-400">No hay unidades pendientes de entregar con estos filtros.</div>:<>

    <div className="rounded-xl border border-navy/20 bg-white p-4">
      <h3 className="text-sm font-bold text-navy mb-2">Lectura rápida</h3>
      <ul className="space-y-1.5 text-sm text-slate-700 list-disc pl-5">{lectura.map((x,i)=><li key={i}>{x}</li>)}</ul>
    </div>

    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
      <Kpi icon="truck" label="Unidades en gestión" valor={tot.u} tono="text-slate-900"/>
      <Kpi icon="user" label="Clientes" valor={tot.nCli} tono="text-slate-900"/>
      <Kpi icon="tag" label="Usadas / recuperadas" valor={tot.usado} tono="text-teal-700"/>
      <Kpi icon="tag" label="Nuevas" valor={tot.nuevo} tono="text-sky-700"/>
      <Kpi icon="alert" label="Prioridad alta" valor={tot.alta} tono="text-red-600"/>
      <Kpi icon="calendar" label="Próximos 15 días" valor={tot.d15} tono="text-amber-600"/>
    </div>

    <div className="rounded-xl border border-stone-200 bg-white p-4">
      <h3 className="text-sm font-bold text-slate-700">Por tipo de equipo y condición</h3>

/* ============================================================
   PANEL DE CARTERA — comportamiento de la cartera de clientes
   Embudo, etapas donde se detienen, por ejecutivo comercial,
   por tipo de equipo y otros cortes. Todo se calcula en el
   navegador con los mismos registros de la app + el historial
   de etapas (sc_etapas_historial_u, solo lectura).
   ============================================================ */
const FUNNEL_PASOS=["Presentación","Documentación y dictamen","Asignación y contrato","Contrato enviado","Contrato recibido","Equipo listo","Programación de entrega","Pendiente de entrega","Entregado (parcial o total)"];
const PASO_DE={"Presentación con Cliente":0,"Documentando":1,"En Dictamen":1,"Dictaminado":1,"Asignación y Contrato":2,"Contrato enviado":3,"Contrato recibido":4,"Equipo listo":5,"Programación entrega":6,"Pend. entrega Fábrica":7,"Pend. entrega Cliente":7,"Entregado":8};
const ETAPAS_ABIERTAS=ESTATUS.filter(e=>!CERRADOS.includes(e));
const EQUIPO_FAMILIAS=[[/dolly/i,"Dolly"],[/cama\s*baja/i,"Cama baja"],[/caja/i,"Caja seca"],[/porta|burrita/i,"Portacontenedor / isotanque"],[/plataforma/i,"Plataforma"],[/volteo|g[oó]ndola/i,"Volteo / góndola"],[/tolva|granelera|tanque/i,"Tolva / granelera / tanque"],[/chatarrera|jaula/i,"Chatarrera / jaula"],[/encortinado/i,"Encortinado"]];
const DIA_MS=86400000;
const fT=s=>{if(!s)return null;const t=String(s);const d=new Date(t.length<=10?t+"T00:00:00":t);return isNaN(d.getTime())?null:d;};
const difD=(a,b)=>(b-a)/DIA_MS;
const prom=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const mediana=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const pctTxt=(a,b)=>b?((a/b)>=0.1||a===0?Math.round(a/b*100):Math.round(a/b*1000)/10)+"%":"–";
const dTxt=x=>(x==null||isNaN(x))?"–":(x>=10?Math.round(x):Math.round(x*10)/10)+" d";
function familiaEquipo(t){const s=String(t||"");for(const [re,n] of EQUIPO_FAMILIAS)if(re.test(s))return n;return "Otros";}
function equipoPrincipal(r){const eqs=(r.equipos||[]).filter(e=>e&&e.tipo);if(!eqs.length)return null;return eqs.slice().sort((a,b)=>(Number(b.cantidad)||0)-(Number(a.cantidad)||0))[0];}
function ejecDe(r){return String(r.ejecutivo||"").trim()||"(sin ejecutivo)";}
function inicioGestion(r){const a=fT(r.creado);const p=primeraInter(r);const b=p?fT(p.fecha):null;if(a&&b)return b<a?b:a;return a||b;}
function diasAltaEntrega(r){const a=inicioGestion(r),b=fT(fechaEntrega(r));if(!a||!b)return null;const d=difD(a,b);return d>=0?d:null;}
function ultimoContacto(r){const b=(r.bitacora||[]).map(x=>fT(x.fecha)).filter(Boolean);if(b.length)return new Date(Math.max(...b.map(x=>x.getTime())));return fT(r.creado);}
function esAbierto(r){const s=seccDe(r);return s==="activos"||s==="devueltos";}
function etapaAbierta(r){return CERRADOS.includes(r.estatus)?"Entrega parcial":r.estatus;}
function lineaEtapas(rows){
  const tl=[];
  rows.forEach(x=>{
    const es=Array.isArray(x.e)?x.e.filter(s=>ESTATUS.includes(s)):[];
    if(!es.length)return;
    const est=principal(es);
    if(!tl.length||tl[tl.length-1].est!==est)tl.push({est,desde:new Date(x.f),izqCens:tl.length===0&&x.a!=="alta"});
  });
  return tl;
}
function pasoAlcanzado(r,tl){
  if(seccDe(r)==="entregados")return 8;
  let m=-1;
  (r.estatuses||[]).forEach(e=>{if(PASO_DE[e]!=null)m=Math.max(m,PASO_DE[e]);});
  (tl||[]).forEach(x=>{if(PASO_DE[x.est]!=null)m=Math.max(m,PASO_DE[x.est]);});
  return Math.max(m,0);
}
function resumenGrupo(lista,now){
  const hoy=new Date(now);
  const g={n:lista.length,ent:0,can:0,dev:0,act:0,uni:0,uniEnt:0,diasEnt:[],ant:[],sinC:0,compV:0,docs:0,entV:0,porEtapa:{}};
  lista.forEach(r=>{
    const s=seccDe(r);
    if(s==="entregados")g.ent++;else if(s==="cancelados")g.can++;else if(s==="devueltos")g.dev++;else g.act++;
    g.uni+=unidades(r);g.uniEnt+=equiposEntregados(r);
    if(s==="entregados"){const d=diasAltaEntrega(r);if(d!=null)g.diasEnt.push(d);}
    if(s==="activos"||s==="devueltos"){
      const ini=inicioGestion(r);if(ini)g.ant.push(difD(ini,hoy));
      const uc=ultimoContacto(r);if(uc&&difD(uc,hoy)>=7)g.sinC++;
      if(estadoCompromiso(r,now)==="vencido")g.compV++;
      if(!listoParaDictamen(r))g.docs++;
      if(r.entregaProgramada&&r.entregaProgramada<HOY)g.entV++;
      const et=etapaAbierta(r);g.porEtapa[et]=(g.porEtapa[et]||0)+1;
    }
  });
  g.abiertos=g.act+g.dev;
  g.etapaTop=Object.keys(g.porEtapa).sort((a,b)=>g.porEtapa[b]-g.porEtapa[a])[0]||null;
  return g;
}
function agrupar(lista,keyFn,now){
  const m={};lista.forEach(r=>{const k=keyFn(r);(m[k]=m[k]||[]).push(r);});
  return Object.keys(m).map(k=>({k,g:resumenGrupo(m[k],now)})).sort((a,b)=>{const sa=/^(Sin |\()/.test(a.k),sb=/^(Sin |\()/.test(b.k);if(sa!==sb)return sa?1:-1;return b.g.n-a.g.n||a.k.localeCompare(b.k);});
}
const CORTES_EXTRA={
  "Tipo de venta":r=>r.tipoVenta||"Sin dato",
  "Empresa":r=>r.empresa||"Sin dato",
  "Tipo de cliente":r=>r.tipoCliente||"Sin dato",
  "Persona física / moral":r=>r.tipoPersona||"Sin dato",

  "Condición del equipo":r=>{const e=equipoPrincipal(r);return e&&e.condicion?condLabel(e.marca,e.condicion):"Sin dato";},
  "Patio de entrega":r=>r.patioEntrega||"Sin dato",
  "Tipo de contrato":r=>r.tipoContrato||"Sin dato",
  "Plazo":r=>r.plazo?r.plazo+" meses":"Sin plazo"
};

function SelPanel({v,set,opts,pre}){return <label className="inline-flex items-center gap-1.5 rounded-lg border border-stone-300 bg-white px-2.5 py-1.5 text-sm"><span className="text-xs text-slate-500">{pre}</span><select value={v} onChange={e=>set(e.target.value)} className="outline-none bg-transparent font-medium">{opts.map(o=>Array.isArray(o)?<option key={o[0]} value={o[0]}>{o[1]}</option>:<option key={o}>{o}</option>)}</select></label>;}
function PanelCartera({registros,now}){
  const [periodo,setPeriodo]=useState("todo");
  const [empresa,setEmpresa]=useState("Todas");
  const [corte,setCorte]=useState("Tipo de venta");
  const [hist,setHist]=useState(null);
  useEffect(()=>{let vivo=true;(async()=>{try{const d=USUARIO?await sbRpcU("sc_etapas_historial_u",{},2):await sbRpc("sc_etapas_historial",{p_pass:SESION_PASS},2);if(vivo)setHist({rows:Array.isArray(d)?d:[],ok:true});}catch(e){if(vivo)setHist({rows:[],ok:false,err:e.message});}})();return()=>{vivo=false;};},[registros.length]);

  const tls=useMemo(()=>{
    const m=new Map();if(!hist||!hist.ok)return m;
    const por={};hist.rows.forEach(x=>{(por[x.c]=por[x.c]||[]).push(x);});
    Object.keys(por).forEach(k=>{por[k].sort((a,b)=>new Date(a.f)-new Date(b.f));m.set(Number(k),lineaEtapas(por[k]));});
    return m;
  },[hist]);
  const logDesde=useMemo(()=>{if(!hist||!hist.ok||!hist.rows.length)return null;return new Date(Math.min(...hist.rows.map(x=>new Date(x.f).getTime())));},[hist]);

  const empresas=useMemo(()=>["Todas",...[...new Set(registros.map(r=>r.empresa).filter(Boolean))].sort()],[registros]);
  const base=useMemo(()=>registros.filter(r=>{
    if(empresa!=="Todas"&&r.empresa!==empresa)return false;
    if(periodo!=="todo"){const d=inicioGestion(r);if(!d||difD(d,new Date(now))>Number(periodo))return false;}
    return true;
  }),[registros,empresa,periodo,now]);

  const total=useMemo(()=>resumenGrupo(base,now),[base,now]);
  const porEjec=useMemo(()=>agrupar(base,ejecDe,now),[base,now]);
  const porEquipo=useMemo(()=>agrupar(base,r=>{const e=equipoPrincipal(r);return e?familiaEquipo(e.tipo):"Sin equipo";},now),[base,now]);
  const porCorte=useMemo(()=>agrupar(base,CORTES_EXTRA[corte],now),[base,corte,now]);
  const porMes=useMemo(()=>{
    const m={};base.forEach(r=>{const d=inicioGestion(r);if(!d)return;const k=d.getFullYear()+"-"+pad(d.getMonth()+1);(m[k]=m[k]||[]).push(r);});

  /* Embudo: cuántos clientes llegaron al menos a cada paso */
  const embudo=useMemo(()=>{
    const alc=FUNNEL_PASOS.map(()=>0);let cancSinEtapa=0;
    base.forEach(r=>{const tl=tls.get(r.id);const p=pasoAlcanzado(r,tl);for(let i=0;i<=p;i++)alc[i]++;if(seccDe(r)==="cancelados"&&!tl&&!(r.estatuses||[]).some(e=>PASO_DE[e]!=null))cancSinEtapa++;});
    return {alc,cancSinEtapa};
  },[base,tls]);
  const caidaMayor=useMemo(()=>{let best=null;for(let i=1;i<FUNNEL_PASOS.length;i++){const a=embudo.alc[i-1],b=embudo.alc[i];if(a>=5){const c=b/a;if(!best||c<best.c)best={i,c,a,b};}}return best;},[embudo]);

  /* Etapas donde se detienen los clientes abiertos */
  const velocidad=useMemo(()=>{
    const por={};const ids=new Set(base.map(r=>r.id));
    tls.forEach((tl,id)=>{if(!ids.has(id))return;for(let i=0;i<tl.length-1;i++){if(tl[i].izqCens)continue;if(tl[i+1].est==="Cancelado"||estIdx(tl[i+1].est)<estIdx(tl[i].est))continue;(por[tl[i].est]=por[tl[i].est]||[]).push(difD(tl[i].desde,tl[i+1].desde));}});
    return por;
  },[tls,base]);
  const filasEtapa=useMemo(()=>{
    const abiertos=base.filter(esAbierto);
    return [...ETAPAS_ABIERTAS,"Entrega parcial"].map(et=>{
      const L=abiertos.filter(r=>etapaAbierta(r)===et);if(!L.length)return null;
      const g=resumenGrupo(L,now);const dEt=[];let verif=0;
      L.forEach(r=>{const tl=tls.get(r.id);if(tl&&tl.length&&tl[tl.length-1].est===r.estatus){const last=tl[tl.length-1];dEt.push(difD(last.desde,new Date(now)));if(!(tl.length===1&&last.izqCens))verif++;}});
      const vel=velocidad[et]||[];
      return {et,n:L.length,g,antProm:prom(g.ant),dEtapa:prom(dEt),nEt:dEt.length,verif,velMed:mediana(vel),velN:vel.length};
    }).filter(Boolean);
  },[base,tls,velocidad,now]);
  const nAbiertos=total.abiertos;
  const maxEt=Math.max(1,...filasEtapa.map(f=>f.n));
  const dEtMax=Math.max(0,...filasEtapa.filter(f=>f.n>=2&&f.dEtapa!=null).map(f=>f.dEtapa));

  /* Ejecutivo × etapa (clientes abiertos) */
  const matriz=useMemo(()=>{
    const cols=filasEtapa.map(f=>f.et);
    const filas=porEjec.map(({k})=>{const L=base.filter(r=>ejecDe(r)===k&&esAbierto(r));const c={};L.forEach(r=>{const e=etapaAbierta(r);c[e]=(c[e]||0)+1;});return {k,c,t:L.length};}).filter(f=>f.t>0);
    return {cols,filas};
  },[base,porEjec,filasEtapa]);

  /* Lectura rápida */
  const lectura=useMemo(()=>{
    const L=[];const t=total;if(!t.n)return L;
    L.push(<span>De <b>{t.n}</b> clientes, <b>{t.ent}</b> ({pctTxt(t.ent,t.n)}) ya se entregaron, <b>{t.abiertos}</b> ({pctTxt(t.abiertos,t.n)}) siguen en proceso{t.dev>0?<span> (de ellos {t.dev} devueltos a comercial)</span>:null} y <b>{t.can}</b> ({pctTxt(t.can,t.n)}) se cancelaron.</span>);
    if(t.diasEnt.length>=3)L.push(<span>Los clientes que llegaron a entrega tardaron en promedio <b>{dTxt(prom(t.diasEnt))}</b> desde que inició su gestión (mitad de ellos en {dTxt(mediana(t.diasEnt))} o menos).</span>);
    if(caidaMayor)L.push(<span>El paso donde menos clientes han avanzado es de «{FUNNEL_PASOS[caidaMayor.i-1]}» a «{FUNNEL_PASOS[caidaMayor.i]}»: solo <b>{Math.round(caidaMayor.c*100)}%</b> de quienes llegaron a la primera ya pasaron a la segunda ({caidaMayor.b} de {caidaMayor.a}); el resto sigue ahí o se canceló.</span>);
    if(filasEtapa.length){
      const top=filasEtapa.slice().sort((a,b)=>b.n-a.n)[0];
      L.push(<span>Hoy la etapa con más clientes detenidos es «{top.et}»: <b>{top.n}</b> ({pctTxt(top.n,nAbiertos)} de los abiertos), con {dTxt(top.antProm)} promedio desde su inicio.</span>);
      const lento=filasEtapa.filter(f=>f.n>=2&&f.dEtapa!=null).sort((a,b)=>b.dEtapa-a.dEtapa)[0];
      if(lento&&lento.et!==top.et)L.push(<span>Donde más tiempo llevan sin cambiar de etapa es «{lento.et}»: {dTxt(lento.dEtapa)} en promedio.</span>);
    }
    const vel=Object.keys(velocidad).filter(k=>velocidad[k].length>=3).sort((a,b)=>mediana(velocidad[b])-mediana(velocidad[a]))[0];
    if(vel&&logDesde)L.push(<span>Con los cambios de etapa registrados desde el {corto(toISO(logDesde))}, la etapa que más tarda en avanzar es «{vel}» (mediana {dTxt(mediana(velocidad[vel]))}, {velocidad[vel].length} casos).</span>);
    const ej=porEjec.filter(x=>x.g.n>=5);
    if(ej.length>=2){
      const mejor=ej.slice().sort((x,y)=>y.g.ent/y.g.n-x.g.ent/x.g.n)[0],canc=ej.slice().sort((x,y)=>y.g.can/y.g.n-x.g.can/x.g.n)[0];
      L.push(<span>Por ejecutivo (con 5+ clientes): <b>{mejor.k}</b> tiene la mayor proporción entregada ({pctTxt(mejor.g.ent,mejor.g.n)}){canc.g.can>0?<span> y <b>{canc.k}</b> la mayor cancelación ({pctTxt(canc.g.can,canc.g.n)})</span>:null}.</span>);
    }
    const eq=porEquipo.filter(x=>x.k!=="Sin equipo");
    if(eq.length){
      const mas=eq[0],eq5=eq.filter(x=>x.g.n>=5),canc=eq5.slice().sort((a,b)=>b.g.can/b.g.n-a.g.can/a.g.n)[0];
      L.push(<span>Por tipo de equipo, <b>{mas.k}</b> concentra {mas.g.n} clientes ({pctTxt(mas.g.n,t.n)}){canc&&canc.g.can>0?<span>; la mayor cancelación está en <b>{canc.k}</b> ({pctTxt(canc.g.can,canc.g.n)})</span>:null}.</span>);
    }
    if(t.abiertos>0&&(t.sinC||t.compV||t.entV))L.push(<span>Alertas hoy: <b>{t.sinC}</b> clientes abiertos sin contacto en 7+ días, <b>{t.compV}</b> con llamada de compromiso vencida y <b>{t.entV}</b> con fecha de entrega ya vencida.</span>);
    return L;
  },[total,caidaMayor,filasEtapa,velocidad,logDesde,porEjec,porEquipo,nAbiertos]);

  const cargaInicial=useMemo(()=>{const m={};registros.forEach(r=>{if(r.creado)m[r.creado]=(m[r.creado]||0)+1;});const k=Object.keys(m).sort((a,b)=>m[b]-m[a])[0];return k&&registros.length>=20&&m[k]/registros.length>=0.15?{fecha:k,n:m[k]}:null;},[registros]);
  const nombreMes=k=>{const[a,m]=k.split("-").map(Number);return MESES_V[m-1]+" "+a;};

  return (<div className="space-y-5">
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div><h2 className="text-lg font-bold text-slate-900">Panel de cartera</h2><p className="text-xs text-slate-500">Cómo se han movido los clientes: avance, retrasos y resultados · {base.length} cliente(s) en el análisis</p></div>
      <div className="flex flex-wrap items-center gap-2">
        <SelPanel v={periodo} set={setPeriodo} pre="Inicio de gestión" opts={[["todo","Todo"],["30","Últimos 30 días"],["60","Últimos 60 días"],["90","Últimos 90 días"],["180","Últimos 180 días"]]}/>
        <SelPanel v={empresa} set={setEmpresa} pre="Empresa" opts={empresas}/>
      </div>
    </div>

    {total.n===0?<div className="rounded-xl border border-stone-200 bg-white p-8 text-center text-slate-400">No hay clientes con estos filtros.</div>:<>

    <div className="rounded-xl border border-navy/20 bg-white p-4">
      <h3 className="text-sm font-bold text-navy mb-2">Lectura rápida</h3>
      <ul className="space-y-1.5 text-sm text-slate-700 list-disc pl-5">{lectura.map((x,i)=><li key={i}>{x}</li>)}</ul>
    </div>

    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
      <Kpi icon="user" label="Clientes" valor={total.n} tono="text-slate-900"/>
      <Kpi icon="check" label="Entregados" valor={pctTxt(total.ent,total.n)} tono="text-emerald-700"/>
      <Kpi icon="clock" label="En proceso" valor={pctTxt(total.abiertos-total.dev,total.n)} tono="text-teal-600"/>
      <Kpi icon="left" label="Devueltos a comercial" valor={pctTxt(total.dev,total.n)} tono="text-orange-600"/>
      <Kpi icon="x" label="Cancelados" valor={pctTxt(total.can,total.n)} tono="text-rose-600"/>
      <Kpi icon="calendar" label="Días a entrega (prom.)" valor={dTxt(prom(total.diasEnt))} tono="text-slate-900"/>
    </div>
    <div className="rounded-xl border border-stone-200 bg-white p-4 space-y-2"><BarraCiclo g={total} alto="h-5"/><LeyendaCiclo/></div>

    <div className="rounded-xl border border-stone-200 bg-white p-4">
      <h3 className="text-sm font-bold text-slate-700">Embudo: ¿hasta dónde llegan los clientes?</h3>
      <p className="text-xs text-slate-500 mb-3">Cuántos clientes han llegado al menos a cada etapa (incluye a los que ya se entregaron o se cancelaron después de pasar por ella). Junto a cada barra: cuántos son y qué % del total; la flecha indica qué % de los que llegaron a la etapa anterior ya pasó a esta (los demás siguen ahí o se cancelaron).</p>
      <div className="space-y-2">{FUNNEL_PASOS.map((nom,i)=>{
        const n=embudo.alc[i],prev=i>0?embudo.alc[i-1]:null,conv=prev?n/prev:null;
        const esCaida=caidaMayor&&caidaMayor.i===i;
        return (<div key={nom}>
          <div className="flex items-center gap-2">
            <span className="w-44 shrink-0 text-xs font-semibold text-slate-600">{nom}</span>
            <div className="flex-1 h-5 rounded bg-stone-100 overflow-hidden"><div className={`h-full ${i===8?"bg-emerald-600":"bg-teal-500"}`} style={{width:`${n/total.n*100}%`}}></div></div>
            <span className="w-28 text-right mono text-xs font-semibold text-slate-700">{n} · {pctTxt(n,total.n)}</span>
            <span className={`w-40 text-right text-[11px] ${esCaida?"font-bold text-red-600":"text-slate-400"}`}>{conv==null?"":`↳ ${Math.round(conv*100)}% ya pasó de la anterior`}</span>
          </div>
        </div>);
      })}</div>
      {embudo.cancSinEtapa>0&&<p className="mt-2 text-[11px] text-slate-400">{embudo.cancSinEtapa} cliente(s) cancelado(s) no tienen etapa previa registrada; se cuentan solo en «Presentación».</p>}
      <p className="mt-1 text-[11px] text-slate-400">«Documentación y dictamen» agrupa Documentando, En Dictamen y Dictaminado (el dictamen aplica solo a persona moral).</p>
    </div>

    <div className="rounded-xl border border-stone-200 bg-white overflow-hidden">
      <div className="p-4 pb-2"><h3 className="text-sm font-bold text-slate-700">¿Dónde se detienen los clientes abiertos?</h3><p className="text-xs text-slate-500">{nAbiertos} cliente(s) abiertos hoy, por etapa actual. En rojo, la etapa donde llevan más tiempo sin cambiar.</p></div>
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="bg-stone-50 text-left text-xs uppercase text-slate-500"><tr>
          <th className="px-3 py-2">Etapa actual</th><th className="px-3 py-2 min-w-[160px]">Clientes abiertos</th>
          <th className="px-3 py-2 text-right" title="Días promedio desde el inicio de la gestión">Antigüedad</th>
          <th className="px-3 py-2 text-right" title="Días promedio que llevan en la etapa actual, según el historial de cambios">Días en la etapa</th>
          <th className="px-3 py-2 text-right" title="Mediana de días que tardaron los clientes que ya salieron de esta etapa hacia una posterior">Tarda en avanzar</th>
          <th className="px-3 py-2 text-right">Sin contacto 7d+</th><th className="px-3 py-2 text-right">Compromiso vencido</th><th className="px-3 py-2 text-right">Docs. pendientes</th><th className="px-3 py-2 text-right">Entrega vencida</th>
        </tr></thead>
        <tbody className="divide-y divide-stone-100">{filasEtapa.map(f=>{
          const peor=f.n>=2&&f.dEtapa!=null&&dEtMax>0&&f.dEtapa===dEtMax;
          const c=ESTATUS_COLOR[f.et];
          return (<tr key={f.et} className="hover:bg-stone-50">
            <td className="px-3 py-2"><span className={`inline-block rounded border px-2 py-0.5 text-xs font-semibold ${c?c.chip:"bg-amber-50 text-amber-800 border-amber-200"}`}>{f.et}</span></td>
            <td className="px-3 py-2"><div className="flex items-center gap-2"><div className="flex-1 h-3 rounded bg-stone-100 overflow-hidden"><div className="h-full bg-slate-500" style={{width:`${f.n/maxEt*100}%`}}></div></div><span className="w-20 text-right mono text-xs font-semibold text-slate-700">{f.n} · {pctTxt(f.n,nAbiertos)}</span></div></td>
            <td className="px-3 py-2 text-right mono">{dTxt(f.antProm)}</td>
            <td className={`px-3 py-2 text-right mono ${peor?"font-bold text-red-600":""}`}>{dTxt(f.dEtapa)}{f.nEt>0&&f.verif<f.nEt&&<span className="ml-1 text-[10px] font-normal text-slate-400" title="En algunos clientes la fecha exacta de entrada a la etapa es anterior al historial; el dato es un mínimo.">≥</span>}</td>
            <td className="px-3 py-2 text-right mono">{f.velMed==null?<span className="text-slate-300">–</span>:<span>{dTxt(f.velMed)} <span className="text-[10px] text-slate-400">({f.velN})</span></span>}</td>
            <td className="px-3 py-2 text-right mono">{f.g.sinC>0?<span className="font-semibold text-red-600">{f.g.sinC}</span>:<span className="text-slate-300">0</span>}</td>
            <td className="px-3 py-2 text-right mono">{f.g.compV>0?<span className="font-semibold text-red-600">{f.g.compV}</span>:<span className="text-slate-300">0</span>}</td>
            <td className="px-3 py-2 text-right mono">{f.g.docs>0?<span className="font-semibold text-indigo-600">{f.g.docs}</span>:<span className="text-slate-300">0</span>}</td>
            <td className="px-3 py-2 text-right mono">{f.g.entV>0?<span className="font-semibold text-red-600">{f.g.entV}</span>:<span className="text-slate-300">0</span>}</td>
          </tr>);})}
          {filasEtapa.length===0&&<tr><td colSpan={9} className="px-3 py-6 text-center text-slate-400">No hay clientes abiertos.</td></tr>}
        </tbody>
      </table></div>
      <p className="px-4 py-2 text-[11px] text-slate-400">{hist&&!hist.ok?`No se pudo leer el historial de etapas (${hist.err}); «Días en la etapa» y «Tarda en avanzar» no están disponibles.`:logDesde?`El historial de cambios de etapa existe desde el ${corto(toISO(logDesde))}; antes de esa fecha no se guardó cuándo cambió cada cliente de etapa. «≥» marca promedios con datos anteriores al historial (el tiempo real es igual o mayor). «Tarda en avanzar» solo usa cambios completos observados (el número entre paréntesis es cuántos).`:"Cargando historial de etapas…"} «Docs. pendientes» = faltan documentos previos al contrato.</p>
    </div>

    <TablaSegmento titulo="Por ejecutivo comercial" sub="Cómo va la cartera de cada ejecutivo; el % es sobre sus clientes." filas={porEjec} total={total} etiqueta="Ejecutivo comercial"/>

    {matriz.filas.length>0&&<div className="rounded-xl border border-stone-200 bg-white overflow-hidden">
      <div className="p-4 pb-2"><h3 className="text-sm font-bold text-slate-700">Ejecutivo × etapa actual</h3><p className="text-xs text-slate-500">Dónde está hoy la cartera abierta de cada ejecutivo. Más oscuro = mayor parte de sus clientes abiertos.</p></div>
      <div className="overflow-x-auto"><table className="w-full text-xs">
        <thead className="bg-stone-50 text-left uppercase text-slate-500"><tr><th className="px-3 py-2">Ejecutivo</th>{matriz.cols.map(c=><th key={c} className="px-2 py-2 text-center font-semibold">{c}</th>)}<th className="px-3 py-2 text-right">Abiertos</th></tr></thead>
        <tbody className="divide-y divide-stone-100">{matriz.filas.map(f=>(<tr key={f.k}>
          <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">{f.k}</td>
          {matriz.cols.map(c=>{const v=f.c[c]||0;const sh=f.t?v/f.t:0;return <td key={c} className="px-2 py-2 text-center mono" style={{background:v?`rgba(11,61,102,${0.08+sh*0.55})`:"transparent",color:sh>0.45?"#fff":"#15203B"}}>{v||""}</td>;})}
          <td className="px-3 py-2 text-right mono font-semibold">{f.t}</td>
        </tr>))}</tbody>
      </table></div>
    </div>}

    <TablaSegmento titulo="Por tipo de equipo" sub="Cada cliente se agrupa por el equipo principal de su pedido (el de mayor cantidad). «Unidades entregadas» sí cuenta todas las unidades." filas={porEquipo} total={total} etiqueta="Tipo de equipo" conUnidades/>

    <div className="space-y-2">
      <div className="flex flex-wrap items-center gap-2"><h3 className="text-sm font-bold text-slate-700">Otros cortes</h3><SelPanel v={corte} set={setCorte} pre="Ver por" opts={Object.keys(CORTES_EXTRA)}/></div>
      <TablaSegmento titulo={"Por "+corte.toLowerCase()} filas={porCorte} total={total} etiqueta={corte}/>
    </div>

    <div className="rounded-xl border border-stone-200 bg-white p-4">
      <h3 className="text-sm font-bold text-slate-700">Por mes de inicio de gestión</h3>
      <p className="text-xs text-slate-500 mb-3">De los clientes que entraron cada mes, ¿cuántos ya se entregaron, siguen abiertos o se cancelaron?</p>
      <div className="space-y-2.5">{porMes.map(({k,g})=>(<div key={k} className="flex items-center gap-2">
        <span className="w-32 shrink-0 text-xs font-semibold text-slate-600">{nombreMes(k)}</span>
        <div className="flex-1"><BarraCiclo g={g} alto="h-4"/></div>
        <span className="w-12 text-right mono text-xs text-slate-500">{g.n}</span>
        <span className="w-44 text-right text-[11px] text-slate-500"><span className="text-emerald-700 font-semibold">{pctTxt(g.ent,g.n)}</span> entr. · <span className="text-teal-700 font-semibold">{pctTxt(g.abiertos,g.n)}</span> abiertos · <span className="text-rose-600 font-semibold">{pctTxt(g.can,g.n)}</span> canc.</span>
      </div>))}</div>
      {cargaInicial&&<p className="mt-3 text-[11px] text-slate-400">{cargaInicial.n} clientes tienen fecha de alta {cargaInicial.fecha} (carga inicial de la app); para ellos el inicio de gestión se toma de su primer contacto en bitácora cuando es anterior.</p>}
    </div>

    <p className="text-[11px] text-slate-400">«Inicio de gestión» = la más antigua entre la fecha de alta y el primer contacto en bitácora. «Días a entrega» usa la fecha de entrega registrada en la ficha. «Devueltos a comercial» son clientes regresados al ejecutivo para completar información; cuentan como abiertos en el embudo y en la tabla de etapas.</p>
    </>}
  </div>);
}

function interpretarCli(texto, ctx){
  const t=" "+_norm(texto)+" ";
  const res={busca:[]}; const hits=[];
  const STOP=new Set(["de","del","la","el","los","las","con","en","y","o","que","me","muestra","muestrame","dame","quiero","ver","todos","todas","clientes","cliente","por","para","un","una","estatus","etapa","los"]);
  const setExacto=(lista,label,key)=>{let mejor=null;(lista||[]).forEach(op=>{const n=_norm(op);if(!n)return;const re=new RegExp("(^| )"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( |$)");if(re.test(t)){if(!mejor||n.length>_norm(mejor).length)mejor=op;}});if(mejor){res[key]=mejor;hits.push(label+": "+mejor);}return mejor;};
  setExacto(ctx.ejecutivos,"Ejecutivo","ejec");
  setExacto(ctx.estatus,"Etapa","estatus");
  if(!res.estatus){
    if(/ entregad/.test(t)){res.estatus="Entregado";hits.push("Etapa: Entregado");}
    else if(/ cancelad/.test(t)){res.estatus="Cancelado";hits.push("Etapa: Cancelado");}
  }
  // palabras restantes -> búsqueda por texto (nombre de cliente, NIV, folio, equipo, empresa, contrato)
  const usados=_norm([res.ejec,res.estatus].filter(Boolean).join(" ")).split(" ");
  const palabras=_norm(texto).split(" ").filter(w=>w.length>=3&&!STOP.has(w)&&usados.indexOf(w)<0);
  if(palabras.length){res.busca=[...new Set(palabras)];hits.push("Texto: "+res.busca.join(" "));}
  return {res,hits};
}

function BuscadorIA({onAplicar,ctx}){
  const [q,setQ]=useState("");const [msg,setMsg]=useState(null);
  const aplicar=()=>{if(!q.trim())return;const {res,hits}=interpretarCli(q,ctx);
    if(hits.length===0){setMsg({ok:false,txt:"No reconocí filtros. Prueba con ejecutivo, etapa (documentando, entregado, cancelado…), o nombre/NIV/folio."});return;}
    onAplicar(res);setMsg({ok:true,txt:"Aplicado → "+hits.join(" · ")});};
  return (<div className="mb-4 rounded-xl border border-indigo-200 bg-indigo-50/40 p-3">
    <div className="flex items-center gap-2">
      <span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-indigo-600 text-white text-xs font-bold">IA</span>
      <input value={q} onChange={e=>{setQ(e.target.value);setMsg(null);}} onKeyDown={e=>{if(e.key==="Enter")aplicar();}} placeholder="Escribe: clientes de Omar entregados… o documentando de Aracely…" className="flex-1 rounded-lg border border-indigo-200 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-400"/>
      <button onClick={aplicar} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Buscar</button>
    </div>
