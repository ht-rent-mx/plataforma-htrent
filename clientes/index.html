            <div className="flex items-center gap-1.5 rounded-lg border border-stone-300 bg-white px-2.5"><Icon name="search" size={14} className="text-slate-400"/><input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar cliente, NIV, folio, tel…" className="py-1.5 text-sm outline-none w-48"/></div>
            <Select value={fEjec} onChange={cambiarEjec} options={["Todos",...ejecutivos]} prefijo="Ejecutivo"/>
            <Select value={fCli} onChange={setFCli} options={clientesOpc} prefijo="Cliente"/>
            <Select value={orden} onChange={setOrden} options={["Predeterminado","Más días en proceso","Menos días en proceso"]} prefijo="Orden"/>
          </div>
        </div>

        {fEstatus && <div className="mb-3"><span className="inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700">Etapa: {fEstatus} <button onClick={()=>setFEstatus("")} className="text-slate-500 hover:text-red-500"><Icon name="x" size={13}/></button></span></div>}
        {vista==="ventas" && <VentasEntregas registros={registros} fEjec={fEjec} ejecutivos={ejecutivos}/>}
        {vista==="panel" && !ES_LEGAL() && <PanelCartera registros={registros} now={now}/>}
        {vista==="equipos" && !ES_LEGAL() && <EquiposGestion registros={registros} now={now}/>}
        {vista==="clientes" && (()=>{
          const cActivos=mostrados.filter(r=>seccDe(r)==="activos").length;
          const cEntreg=mostrados.filter(r=>seccDe(r)==="entregados").length;
          const cCancel=mostrados.filter(r=>seccDe(r)==="cancelados").length;
          const cDevu=mostrados.filter(r=>seccDe(r)==="devueltos").length;
          const sub=[["activos","En seguimiento",cActivos,"text-slate-700"],["entregados","Entregados",cEntreg,"text-teal-700"],["devueltos","Devueltos",cDevu,"text-purple-700"],["cancelados","Cancelados",cCancel,"text-rose-700"]];
          const lista=mostrados.filter(r=>seccDe(r)===subLista);
          return (<div>
            <div className="mb-3 inline-flex rounded-xl border border-stone-300 bg-white p-0.5">{sub.map(([k,l,n,col])=>(<button key={k} onClick={()=>setSubLista(k)} className={`rounded-lg px-3 py-1.5 text-xs font-semibold transition-all ${subLista===k?"bg-stone-800 text-white":`${col} hover:bg-stone-100`}`}>{l} <span className={`ml-0.5 ${subLista===k?"text-white/70":"text-slate-400"}`}>({n})</span></button>))}</div>
            {lista.length?<div className="grid gap-3 sm:grid-cols-2">{lista.map(r=><Tarjeta key={r.id} r={r} now={now} onEdit={setEditando} onListo={marcarLlamada}/>)}</div>:<Vacio texto={subLista==="activos"?"No hay clientes en seguimiento con los filtros actuales.":subLista==="entregados"?"No hay clientes entregados con los filtros actuales.":subLista==="devueltos"?"No hay clientes devueltos a comercial con los filtros actuales.":"No hay clientes cancelados con los filtros actuales."}/>}
          </div>);
        })()}
        {vista==="tablero" && <VistaTablero registros={visibles} now={now} onEdit={setEditando}/>}
        {vista==="lista" && <VistaLista registros={visibles} now={now} onEdit={setEditando}/>}
        {vista==="dia" && <AgendaDia dia={dia} setDia={setDia} agenda={agenda} onEdit={setEditando}/>}
      </main>

      {editando && ES_LEGAL() && editando!=="nuevo" && <FichaLegal r={editando} onClose={()=>setEditando(null)} onCambio={()=>{setEditando(null);recargar();}}/>}
      {editando && !ES_LEGAL() && <Modal onCambiado={recargar} puedeEditar={puedeEditar} inicial={editando==="nuevo"?null:editando} fEjec={fEjec} ejecutivos={ejecutivos} cliPorEjec={cliPorEjec} onClose={()=>setEditando(null)} onSave={guardar} onEliminado={id=>{setRegistros(prev=>prev.filter(r=>r.id!==id));setEditando(null);setSync("Tarjeta #"+id+" eliminada ✓ (en Papelera)");}}/>}
      {verPapelera && <Papelera onClose={()=>setVerPapelera(false)} onRestaurado={()=>{recargar();}}/>}
    </div>
  );
}

/* ---------- Banner ---------- */
function Banner({urgentes,now,onEdit,onListo,hayVencidas}){
  const tono=hayVencidas?"border-red-300 bg-red-50":"border-amber-300 bg-amber-50";
  return (<div className={`mb-4 rounded-xl border ${tono} px-4 py-3`}><div className="flex items-center gap-2 mb-2"><Icon name="bell" size={16} className={hayVencidas?"text-red-600":"text-amber-600"}/><p className={`text-sm font-bold ${hayVencidas?"text-red-700":"text-amber-800"}`}>{urgentes.length} {urgentes.length===1?"llamada":"llamadas"} por atender</p></div><div className="flex flex-wrap gap-2">{urgentes.map(r=>{const venc=estadoCompromiso(r,now)==="vencido";return (<div key={r.id} className={`inline-flex items-center gap-2 rounded-lg border bg-white px-2.5 py-1.5 ${venc?"border-red-300":"border-amber-300"}`}><span className={`h-2 w-2 rounded-full ${venc?"bg-red-500":"bg-amber-500"}`}></span><button onClick={()=>onEdit(r)} className="text-sm font-semibold text-slate-800 hover:underline">{r.cliente}</button>{r.telefono && <a href={`tel:${r.telefono.replace(/[^0-9+]/g,"")}`} className="text-xs text-slate-500 hover:text-slate-800 mono">{r.telefono}</a>}<span className="text-xs text-slate-500 mono">{venc?"venció":""} {hora(r.compromiso)}</span><button onClick={()=>onListo(r.id)} title="Marcar realizada" className="grid h-5 w-5 place-items-center rounded text-emerald-600 hover:bg-emerald-50"><Icon name="check" size={14}/></button></div>);})}</div></div>);
}

/* ---------- Agenda Día ---------- */
function AgendaDia({dia,setDia,agenda,onEdit}){
  return (<div>
    <div className="flex items-center justify-between mb-4 rounded-lg border border-stone-200 bg-white px-3 py-2.5"><button onClick={()=>setDia(addDays(dia,-1))} className="grid h-8 w-8 place-items-center rounded-md hover:bg-stone-100 text-slate-600"><Icon name="left" size={18}/></button><div className="text-center"><p className="text-sm font-bold capitalize text-slate-900">{largo(dia)}</p><button onClick={()=>setDia(HOY)} className="text-xs text-amber-600 hover:underline mono">ir a hoy</button></div><button onClick={()=>setDia(addDays(dia,1))} className="grid h-8 w-8 place-items-center rounded-md hover:bg-stone-100 text-slate-600"><Icon name="right" size={18}/></button></div>
    {agenda.length===0?<Vacio texto="Sin interacciones registradas este día."/>:<div className="space-y-2">{agenda.map(({r,be})=>(<button key={r.id+"-"+be.id} onClick={()=>onEdit(r)} className="flex w-full items-start gap-3 rounded-lg border border-stone-200 bg-white p-3 text-left hover:shadow-sm"><TipoTag tipo={be.tipo}/><div className="min-w-0 flex-1"><div className="flex items-center gap-2"><p className="font-semibold text-slate-900 truncate">{r.cliente}</p><ContactoTag contacto={be.contacto} compacto/></div><p className="text-xs text-slate-500">{r.ejecutivo}</p>{be.resultado && <p className="mt-1 text-sm text-slate-600">{be.resultado}</p>}</div><Badge estatus={r.estatus}/></button>))}</div>}
  </div>);
}

/* ---------- Tablero ---------- */
function VistaTablero({registros,now,onEdit}){
  const panel=React.useRef(null), pista=React.useRef(null), arrastre=React.useRef(null);
  const [m,setM]=useState({ancho:0,visible:0,pos:0});
  const medir=React.useCallback(()=>{const p=panel.current;if(!p)return;setM({ancho:p.scrollWidth,visible:p.clientWidth,pos:p.scrollLeft});},[]);
  useEffect(()=>{medir();let ro=null;const p=panel.current;
    if(window.ResizeObserver&&p){ro=new ResizeObserver(medir);ro.observe(p);}
    window.addEventListener("resize",medir);
    return()=>{if(ro)ro.disconnect();window.removeEventListener("resize",medir);};},[registros,medir]);
  const sobra=Math.max(0,m.ancho-m.visible);
  const anchoPulgar=m.ancho>0?Math.max(8,(m.visible/m.ancho)*100):100;
  const izqPulgar=sobra>0?(m.pos/sobra)*(100-anchoPulgar):0;
  const irA=(clientX,rect)=>{const p=panel.current;if(!p||sobra<=0)return;
    const libre=rect.width*(1-anchoPulgar/100);
    const x=Math.min(Math.max(clientX-rect.left-(rect.width*anchoPulgar/100)/2,0),libre);
    p.scrollLeft=(libre>0?x/libre:0)*sobra;};
  const alBajar=e=>{const pista0=pista.current;if(!pista0)return;const rect=pista0.getBoundingClientRect();
    irA(e.clientX,rect);arrastre.current=rect;
    const mover=ev=>irA(ev.clientX,arrastre.current);
    const soltar=()=>{arrastre.current=null;window.removeEventListener("pointermove",mover);window.removeEventListener("pointerup",soltar);};
    window.addEventListener("pointermove",mover);window.addEventListener("pointerup",soltar);};
  return (<div>
    {sobra>0 && <div ref={pista} onPointerDown={alBajar} role="scrollbar" aria-label="Desplazar el tablero" aria-orientation="horizontal" title="Arrastra para ver las demás etapas"
      className="mb-2 h-3 w-full cursor-pointer rounded-full bg-stone-200 select-none touch-none">
      <div className="h-3 rounded-full bg-navy transition-[left] duration-75" style={{width:anchoPulgar+"%",marginLeft:izqPulgar+"%"}}></div>
    </div>}
    <div ref={panel} onScroll={medir} className="flex gap-3 overflow-x-auto pb-2">{ESTATUS.map(est=>{const items=registros.filter(r=>r.estatus===est);return (<div key={est} className="min-w-[200px] flex-1"><div className="flex items-center gap-2 mb-2 px-1"><span className={`h-2 w-2 rounded-full ${ESTATUS_COLOR[est].spine}`}></span><h3 className="text-xs font-bold uppercase tracking-wide text-slate-600 leading-tight">{est}</h3><span className="ml-auto text-xs text-slate-400 mono">{items.length}</span></div><div className="space-y-2">{items.map(r=><TarjetaMini key={r.id} r={r} now={now} onEdit={onEdit}/>)}{items.length===0 && <div className="rounded-lg border border-dashed border-stone-300 py-6 text-center text-xs text-slate-400">—</div>}</div></div>);})}</div>
  </div>);
}

/* ---------- Lista ---------- */
function VistaLista({registros,now,onEdit}){
  const orden=[...registros].sort((a,b)=>a.cliente.localeCompare(b.cliente));
  if(!orden.length)return <Vacio texto="No hay clientes con los filtros actuales."/>;
  return (<div className="overflow-x-auto rounded-lg border border-stone-200 bg-white"><table className="w-full text-sm"><thead><tr className="border-b border-stone-200 text-left text-xs uppercase tracking-wide text-slate-500"><th className="px-3 py-2.5 font-semibold">Cliente / Ejecutivo</th><th className="px-3 py-2.5 font-semibold">Tipo</th><th className="px-3 py-2.5 font-semibold">Equipo</th><th className="px-3 py-2.5 font-semibold">Estatus</th><th className="px-3 py-2.5 font-semibold">Expediente</th><th className="px-3 py-2.5 font-semibold">Últ. interacción</th><th className="px-3 py-2.5 font-semibold">Entrega</th><th className="px-3 py-2.5"></th></tr></thead><tbody>{orden.map(r=>{const st=reqStats(r);const u=ultInter(r);return (<tr key={r.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50"><td className="px-3 py-2.5"><p className="font-semibold text-slate-900">{r.cliente}</p><p className="text-xs text-slate-500">{r.ejecutivo}{r.telefono?" · "+r.telefono:""}</p></td><td className="px-3 py-2.5 text-xs text-slate-600 whitespace-nowrap">{r.tipoCliente==="Cliente Recurrente"?"Recurrente":"Nuevo"}</td><td className="px-3 py-2.5 text-slate-700 max-w-[170px]">{equiposTxt(r)||<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5"><Badge estatus={r.estatus}/></td><td className="px-3 py-2.5 whitespace-nowrap">{st.completo?<span className="inline-flex items-center gap-1 text-xs font-semibold text-emerald-600"><Icon name="check" size={12}/>Completo</span>:<span className="text-xs font-medium text-indigo-600 mono">{st.recibido}/{st.aplicables}</span>}</td><td className="px-3 py-2.5 whitespace-nowrap text-xs text-slate-500">{u?`${corto(u.fecha)} · ${u.contacto}`:<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5 whitespace-nowrap">{r.entregaProgramada?<span className="inline-flex items-center gap-1 text-emerald-700"><Icon name="truck" size={13}/>{corto(r.entregaProgramada)}</span>:<span className="text-slate-300">—</span>}</td><td className="px-3 py-2.5"><button onClick={()=>onEdit(r)} className="text-slate-400 hover:text-slate-700"><Icon name="pencil" size={15}/></button></td></tr>);})}</tbody></table></div>);
}

/* ---------- Expediente bar ---------- */
function primeraInter(r){const b=(r.bitacora||[]).filter(x=>x.fecha).slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));return b[0]||null;}
function diasEnGestion(r){const p=primeraInter(r);if(!p)return null;const fin=(r.devueltoComercial&&r.fechaDevuelto)?parse(r.fechaDevuelto):parse(HOY);return Math.max(0,Math.round((fin-parse(p.fecha))/86400000));}
function Cronometro({r}){
  if(["Entregado","Cancelado"].includes(r.estatus))return null;
  const d=diasEnGestion(r); if(d===null)return null;
  const pausado=esDevuelto(r);
  const pct=Math.min(100,Math.max(0,d/60*100)); const vencido=d>60;
  const col=d<=20?"text-emerald-600":d<=40?"text-amber-600":d<=60?"text-orange-600":"text-red-600";
  return (<div className="mt-2">
    <div className="flex items-center justify-between text-xs mb-1"><span className="font-semibold text-slate-600 inline-flex items-center gap-1"><Icon name="clock" size={12}/> Gestión (60 días){pausado&&<span className="ml-1 rounded bg-purple-100 px-1 py-0.5 text-[9px] font-bold text-purple-700">⏸ en comercial</span>}</span><span className={`mono font-bold ${col}`}>{vencido?`Vencido +${d-60}d`:`Día ${d} de 60`}</span></div>
    <div className="relative h-2 w-full rounded-full overflow-hidden" style={{background:"linear-gradient(to right,#22c55e 0%,#22c55e 28%,#fbbf24 40%,#f59e0b 60%,#f97316 78%,#ef4444 100%)"}}><div className="absolute -top-0.5 h-3 w-1 rounded bg-slate-900" style={{left:`calc(${pct}% - 2px)`}}></div></div>
    <p className="mt-1 text-[11px] text-slate-400">{vencido?"Fuera del plazo de 60 días":`Quedan ${60-d} días para entregar`}</p>
  </div>);
}
function ReqBarra({r}){
  const st=reqStats(r);
  if(st.completo)return <div className="mt-2 inline-flex items-center gap-1.5 rounded-md border border-emerald-200 bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700"><Icon name="clip" size={12}/> Expediente completo</div>;
  const pct=st.aplicables?Math.round(st.recibido/st.aplicables*100):0;
  return (<div className="mt-2"><div className="flex items-center justify-between text-xs mb-1"><span className="font-semibold text-slate-600 inline-flex items-center gap-1"><Icon name="clip" size={12}/> Expediente</span><span className="mono text-indigo-600 font-semibold">{st.recibido}/{st.aplicables}</span></div><div className="h-1.5 w-full rounded-full bg-stone-200 overflow-hidden"><div className="h-full bg-indigo-500" style={{width:pct+"%"}}></div></div>{st.faltan.length>0 && <p className="mt-1 text-xs text-slate-500 truncate">Faltan: {st.faltan.slice(0,3).join(", ")}{st.faltan.length>3?` +${st.faltan.length-3}`:""}</p>}</div>);
}

/* ---------- Tags ---------- */
function TipoTag({tipo}){return <span className="rounded border border-stone-200 bg-stone-50 px-1.5 py-0.5 text-[10px] font-bold tracking-wide text-slate-500 mono shrink-0">{TIPO_ABBR[tipo]||tipo}</span>;}
function EmpresaTag({empresa}){return empresa?<span className="rounded bg-slate-800 px-1.5 py-0.5 text-[10px] font-bold text-white mono">{empresa}</span>:null;}
function ClienteTipoTag({tc}){const rec=tc==="Cliente Recurrente";return <span className={`inline-flex items-center gap-0.5 rounded px-1.5 py-0.5 text-[10px] font-bold ${rec?"bg-teal-100 text-teal-700":"bg-sky-100 text-sky-700"}`}><Icon name="user" size={9}/>{rec?"RECURRENTE":"NUEVO"}</span>;}

/* ---------- Tarjeta ---------- */
function Tarjeta({r,now,onEdit,onListo}){
  const c=ESTATUS_COLOR[r.estatus];const e=estadoCompromiso(r,now);const eqt=equiposTxt(r);const u=ultInter(r);const nb=(r.bitacora||[]).length;
  const ring=e==="vencido"?"ring-2 ring-red-400 border-red-300":e==="proximo"?"ring-2 ring-amber-400 border-amber-300":"border-stone-200";
  return (<div className={`group relative w-full overflow-hidden rounded-xl border bg-white transition-shadow hover:shadow-md ${ring}`}><span className={`absolute inset-y-0 left-0 w-1.5 ${c.spine}`}></span>
    <button onClick={()=>onEdit(r)} className="block w-full p-4 pl-5 text-left">
      <div className="flex items-start justify-between gap-2"><div className="flex items-center gap-2 min-w-0">{e && <span className={`h-2.5 w-2.5 rounded-full shrink-0 ${e==="vencido"?"bg-red-500":e==="proximo"?"bg-amber-500":"bg-sky-400"}`}></span>}<div className="min-w-0"><div className="flex items-center gap-1.5"><p className={`font-bold leading-tight truncate ${e==="vencido"?"text-red-700":e==="proximo"?"text-amber-800":"text-slate-900"}`}>{r.cliente}</p></div><p className="text-xs text-slate-500 mt-0.5">{r.ejecutivo}</p>{r.tipoContrato&&<span className={`mt-1 inline-block rounded border px-1.5 py-0.5 text-[10px] font-bold ${r.tipoContrato==="Notariado"?"border-violet-200 bg-violet-50 text-violet-700":"border-sky-200 bg-sky-50 text-sky-700"}`}>Contrato {r.tipoContrato}</span>}{esDevuelto(r)&&<span className="mt-1 ml-1 inline-block rounded border border-purple-300 bg-purple-50 px-1.5 py-0.5 text-[10px] font-bold text-purple-700">Devuelto a comercial</span>}{(r.tipoPersona||"")==="Persona moral"&&<span className="mt-1 ml-1 inline-block rounded border border-stone-300 bg-stone-50 px-1.5 py-0.5 text-[10px] font-bold text-slate-600">Persona moral</span>}{enDictamen(r)&&<span className="mt-1 ml-1 inline-block rounded border border-sky-300 bg-sky-50 px-1.5 py-0.5 text-[10px] font-bold text-sky-700">En dictamen{diasDesde(r.enviadoLegal)!=null?` · día ${diasDesde(r.enviadoLegal)}`:""}</span>}{esParcial(r)&&<span className="mt-1 ml-1 inline-block rounded border border-amber-300 bg-amber-50 px-1.5 py-0.5 text-[10px] font-bold text-amber-700">Entrega parcial {entregadosCli(r)}/{unidades(r)}</span>}{(r.folioVenta||r.folioJJ)&&<p className="text-[10px] text-slate-400 mono mt-0.5">{r.folioVenta?`V: ${r.folioVenta}`:""}{r.folioVenta&&r.folioJJ?"  ·  ":""}{r.folioJJ?`JJ: ${r.folioJJ}`:""}</p>}</div></div><div className="flex flex-col items-end gap-1 shrink-0"><Badges r={r}/><div className="flex items-center gap-1"><ClienteTipoTag tc={r.tipoCliente}/><EmpresaTag empresa={r.empresa}/></div></div></div>
      {eqt && <p className="mt-2 text-xs font-medium text-slate-600 inline-flex items-start gap-1"><Icon name="truck" size={12} className="text-slate-400 mt-0.5 shrink-0"/><span>{eqt}</span></p>}
      {r.niv && <p className="mt-1 text-xs text-slate-500 mono truncate">NIV: {String(r.niv).split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).join(", ")}</p>}{r.tipoVenta && <p className="mt-1 text-xs text-slate-500"><span className="font-semibold text-slate-600">{r.tipoVenta}</span>{r.plazo?` · ${r.plazo} meses`:""}</p>}
      <div className="mt-2 rounded-md bg-stone-50 border border-stone-100 px-2 py-1.5 text-xs">{u?(<div className="flex items-start gap-1.5"><Icon name="history" size={12} className="text-slate-400 mt-0.5 shrink-0"/><div className="min-w-0"><span className="font-semibold text-slate-600">{corto(u.fecha)} · {u.tipo} · </span><ContactoTag contacto={u.contacto} inline/>{u.resultado && <span className="text-slate-600"> — {u.resultado}</span>}<span className="text-slate-400 mono"> · {nb} {nb===1?"interacción":"interacciones"}</span></div></div>):<span className="text-slate-400 inline-flex items-center gap-1"><Icon name="history" size={12}/> Sin interacciones aún</span>}</div>
      {r.adicionales&&r.adicionales.length>0 && <div className="mt-2 flex flex-wrap gap-1">{r.adicionales.map(a=><span key={a} className="inline-flex items-center gap-0.5 rounded bg-stone-100 px-1.5 py-0.5 text-[10px] font-medium text-slate-500"><Icon name="tag" size={9}/>{a}</span>)}</div>}
      <Cronometro r={r}/><ReqBarra r={r}/>{numArchivos(r)>0&&<p className="mt-1 text-[11px] font-semibold text-emerald-600">{numArchivos(r)} archivo(s) en el expediente</p>}
      {r.queFalta && <div className="mt-2 flex items-start gap-1.5 rounded-md bg-amber-50 px-2 py-1.5 text-xs text-amber-800"><Icon name="alert" size={13} className="mt-0.5 shrink-0"/><span><span className="font-semibold">Pendiente:</span> {r.queFalta}</span></div>}

/* ---------- Modal ---------- */
function Papelera({onClose,onRestaurado}){
  const [lista,setLista]=useState(null);const [err,setErr]=useState("");const [ocupado,setOcupado]=useState(0);
  function cargar(){setErr("");apiPapelera().then(setLista).catch(e=>setErr(e.message));}
  useEffect(cargar,[]);
  async function restaurar(x){
    if(!window.confirm(`¿Restaurar la tarjeta #${x.id} · ${x.cliente||""}?`))return;
    setOcupado(x.pid);
    try{await apiRestaurar(x.pid);onRestaurado&&onRestaurado();cargar();}
    catch(e){alert("No se pudo restaurar: "+e.message);}
    finally{setOcupado(0);}
  }
  const fmt=s=>{try{return new Date(s).toLocaleString("es-MX",{dateStyle:"short",timeStyle:"short"});}catch(e){return s;}};
  return (<div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/50 p-4" onClick={onClose}>
    <div className="w-full max-w-3xl rounded-2xl bg-white shadow-xl" onClick={e=>e.stopPropagation()}>
      <div className="flex items-center justify-between border-b border-stone-200 px-5 py-3"><div><div className="text-lg font-bold text-navy">🗑 Papelera</div><div className="text-xs text-slate-500">Tarjetas eliminadas. Restaura cualquiera si se borró por error.</div></div><button onClick={onClose} className="rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-600 hover:bg-stone-100">Cerrar</button></div>
      <div className="p-5">
        {err && <div className="mb-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{err}</div>}
        {lista===null && !err && <div className="text-sm text-slate-500">Cargando…</div>}
        {lista && !lista.length && <div className="text-sm text-slate-500">La papelera está vacía.</div>}
        {lista && lista.length>0 && <ul className="space-y-2">{lista.map(x=>(<li key={x.pid} className="flex flex-wrap items-center gap-3 rounded-xl border border-stone-200 px-4 py-3">
          <div className="min-w-0 flex-1">
            <div className="text-sm font-bold text-navy">#{x.id} · {x.cliente||"(sin nombre)"}</div>
            <div className="text-xs text-slate-500">{x.ejecutivo||""}{x.folioVenta?" · "+String(x.folioVenta).trim():""}{x.estatus?" · "+x.estatus:""}</div>
            <div className="mt-1 text-xs text-slate-600">Eliminada por <b>{x.usuario||"—"}</b> el {fmt(x.fecha)} · Motivo: {x.motivo||"—"}</div>
          </div>
          <button onClick={()=>restaurar(x)} disabled={ocupado===x.pid} className="shrink-0 rounded-lg border border-navy bg-navy px-3 py-1.5 text-xs font-semibold text-white hover:bg-navy-2 disabled:opacity-40">{ocupado===x.pid?"Restaurando…":"↩ Restaurar"}</button>
        </li>))}</ul>}
      </div>
    </div>
  </div>);
}
/* ============================================================
   SOLICITUD ALTA DE CLIENTE  +  VALIDACIÓN DE DOCUMENTOS
   Versión sin costo: todo se lee en el navegador.
     · Excel de la solicitud → SheetJS (ya cargado)
     · PDF con texto (CSF del SAT, PDFs digitales) → pdf.js
     · Escaneos y fotos → Tesseract.js (OCR en español)
   Nada se envía a servicios de pago. Se guarda dentro de la tarjeta
   (campo "solicitud"), sin cambios en Supabase.
   REGLAS AJUSTABLES: SOL_MIN_REF, SOL_FACULTADES_REQ, SOL_CSF_MAX_DIAS,
   SOL_AVAL_EDAD_AVISO.
   ============================================================ */
const SOL_MIN_REF=2;                              // mínimo por tipo de referencia
const SOL_FACULTADES={
  administracion:{l:"Actos de administración",re:/ACTOS?\s+DE\s+ADMINISTRACION/},
  titulos:{l:"Suscribir títulos de crédito",re:/TITULOS?\s+DE\s+CREDITO/},
  pleitos:{l:"Pleitos y cobranzas",re:/PLEITOS\s+Y\s+COBRANZAS/},
  dominio:{l:"Actos de dominio",re:/ACTOS?\s+DE\s+DOMINIO/},
};
const SOL_FACULTADES_REQ=["administracion","titulos"]; // las que debe tener el representante
const SOL_CSF_MAX_DIAS=90;                        // antigüedad máxima de la constancia
const SOL_AVAL_EDAD_AVISO=70;                     // aviso informativo para Legal
const SOL_USO_CFDI=["G01 Adquisición de mercancias","G02 Devoluciones, descuentos o bonificaciones","G03 Gastos en general","I01 Construcciones","I02 Mobilario y equipo de oficina por inversiones","I03 Equipo de transporte","I04 Equipo de computo y accesorios","I05 Dados, troqueles, moldes, matrices y herramental","I06 Comunicaciones telefónicas","I07 Comunicaciones satelitales","I08 Otra maquinaria y equipo","P01 Por definir"];
const SOL_METODO=["PUE / PAGO UNA EXHIBICION","PPD / PAGO EN PARCIALIDADES"];
const SOL_FORMA=["EFECTIVO","CHEQUE","TRANSFERENCIA ELECTRONICA","POR DEFINIR"];
const SOL_EDO_CIVIL=["SOLTERO","CASADO","UNIÓN LIBRE","DIVORCIADO","VIUDO"];
const SOL_CLASES_TR=["Tractocamiones","Remolques","Camiones"];
const SOL_PARTICULAS=new Set(["DE","DEL","LA","LAS","LOS","Y","E","MC","MAC","VON","VAN","DA","DI","DAS","EL"]);

/* ---------- estructura vacía ---------- */
const solPersona=()=>({nombre:"",rfc:"",calle:"",colonia:"",cp:"",municipio:"",estado:"",estadoCivil:"",profesion:"",celular:"",telCasa:"",telOficina:"",correo:""});
const solRefFam=()=>({nombre:"",direccion:"",telefono:"",parentesco:""});
const solRefCom=()=>({empresa:"",contacto:"",telefono:"",tiempo:""});
function solVacia(){return {
  fiscal:{razonSocial:"",nombreComercial:"",calle:"",colonia:"",cp:"",municipio:"",estado:"",rfc:"",tipoCliente:"",contacto:"",celular:"",correo:"",web:""},
  rep:solPersona(),
  avales:[{...solPersona(),tiempo:"",parentesco:""}],
  pagos:{nombre:"",celular:"",telOficina:"",usoCfdi:"",metodoPago:"",formaPago:"",correosFactura:"",comentarios:""},
  refFam:[solRefFam(),solRefFam(),solRefFam()],
  refCli:[solRefCom(),solRefCom(),solRefCom()],
  refProv:[solRefCom(),solRefCom(),solRefCom()],
  bancos:[{banco:"",cuenta:"",apertura:"",saldo:"",ejecutivo:"",telefono:""}],
  transporte:SOL_CLASES_TR.map(c=>({clase:c,tipo:"",marca:"",modelo:"",placa:"",color:""})),
  docs:{}, revisiones:{}, actualizado:""
};}
function solNormaliza(s){const v=solVacia();if(!s)return v;return {...v,...s,
  fiscal:{...v.fiscal,...(s.fiscal||{})},rep:{...v.rep,...(s.rep||{})},pagos:{...v.pagos,...(s.pagos||{})},
  avales:(s.avales&&s.avales.length?s.avales:v.avales).map(a=>({...solPersona(),tiempo:"",parentesco:"",...a})),
  refFam:s.refFam||v.refFam,refCli:s.refCli||v.refCli,refProv:s.refProv||v.refProv,
  bancos:s.bancos&&s.bancos.length?s.bancos:v.bancos,transporte:s.transporte&&s.transporte.length?s.transporte:v.transporte,
  docs:s.docs||{},revisiones:s.revisiones||{}};}

/* ---------- normalización y comparación ---------- */
function solN(s){return String(s==null?"":s).toUpperCase().replace(/Ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"Ñ").replace(/[^A-Z0-9Ñ&]+/g," ").trim();}
function solTokens(s){return solN(s).split(" ").filter(t=>t&&!SOL_PARTICULAS.has(t));}
const SOL_REGIMEN_RE=/\s+(SOCIEDAD ANONIMA PROMOTORA DE INVERSION|SOCIEDAD ANONIMA BURSATIL|SOCIEDAD ANONIMA|SOCIEDAD DE RESPONSABILIDAD LIMITADA|SOCIEDAD POR ACCIONES SIMPLIFICADA|SOCIEDAD CIVIL|ASOCIACION CIVIL|SOCIEDAD COOPERATIVA|S ?A ?P ?I|S ?A ?B|S ?DE ?R ?L|S ?A ?S|S ?A|S ?C|A ?C|S ?C ?L)( (DE )?(C ?V|CAPITAL VARIABLE|R ?L|RESPONSABILIDAD LIMITADA))*( DE C ?V| DE CAPITAL VARIABLE)?$/;
function solSinRegimen(s){return solN(s).replace(SOL_REGIMEN_RE,"").trim();}
function solTieneRegimen(s){return SOL_REGIMEN_RE.test(solN(s));}
function solSoloDig(s){return String(s==null?"":s).replace(/\D/g,"");}
function solLev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
function solTokEq(a,b){return a===b||(b.length>=5&&Math.abs(a.length-b.length)<=1&&solLev(a,b)<=1);}
/* similitud entre dos textos (0..1) por palabras significativas */
function solSimil(a,b){const A=solTokens(a),B=solTokens(b);if(!A.length||!B.length)return 0;let hit=0;const usados=new Set();
  A.forEach(t=>{const j=B.findIndex((u,k)=>!usados.has(k)&&solTokEq(u,t));if(j>=0){hit++;usados.add(j);}});return hit/Math.max(A.length,B.length);}

/* ---------- RFC ---------- */
function solRfc(s){return String(s||"").toUpperCase().replace(/[\s\-\.]/g,"");}
function solRfcDigito(rfc){const D="0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ Ñ";const r=rfc.length===12?" "+rfc:rfc;let s=0;for(let i=0;i<12;i++){const v=D.indexOf(r[i]);if(v<0)return null;s+=v*(13-i);}const res=s%11;if(res===0)return "0";const d=11-res;return d===10?"A":String(d);}
function solRfcFecha(rfc){const m=rfc.match(/^[A-ZÑ&]{3,4}(\d{2})(\d{2})(\d{2})/);if(!m)return null;const yy=+m[1],mm=+m[2],dd=+m[3];const hoy=new Date();const y=yy>hoy.getFullYear()%100?1900+yy:2000+yy;const d=new Date(y,mm-1,dd);if(d.getMonth()!==mm-1||d.getDate()!==dd)return null;return d;}
function solEdad(d){if(!d)return null;const h=new Date();let e=h.getFullYear()-d.getFullYear();if(h<new Date(h.getFullYear(),d.getMonth(),d.getDate()))e--;return e;}
function solPrimVocalInt(w){for(let i=1;i<w.length;i++)if("AEIOU".includes(w[i]))return w[i];return "X";}
function solIniFisica(nombre){const t=solN(nombre).split(" ").filter(x=>x&&!SOL_PARTICULAS.has(x));if(t.length<3)return [];
  const out=[];const arma=(pat,mat,noms)=>{let nom=noms[0];if(noms.length>1&&/^(JOSE|J|MARIA|MA|M)$/.test(nom))nom=noms[1];return pat[0]+solPrimVocalInt(pat)+mat[0]+nom[0];};
  out.push(arma(t[t.length-2],t[t.length-1],t.slice(0,t.length-2)));   // NOMBRE PATERNO MATERNO
  out.push(arma(t[0],t[1],t.slice(2)));                                  // PATERNO MATERNO NOMBRE
  return out;}
const SOL_STOP_MORAL=new Set(["DE","DEL","LA","LAS","LOS","EL","Y","E","EN","PARA","POR","CON","A","SOCIEDAD","COMPANIA","CIA","SOC","COOPERATIVA","MC","MAC","VON","VAN","THE","OF","AND"]);
function solIniMoral(razon){const t=solSinRegimen(razon).split(" ").filter(x=>x&&!SOL_STOP_MORAL.has(x));if(!t.length)return "";
  if(t.length>=3)return t[0][0]+t[1][0]+t[2][0];if(t.length===2)return t[0][0]+t[1].slice(0,2);return t[0].slice(0,3);}
/* revisa un RFC: devuelve lista de {nivel,texto} */
function solRevisaRfc(rfcIn,nombre,tipo){const out=[];const rfc=solRfc(rfcIn);
  if(!rfc){out.push({n:"error",t:"Sin RFC capturado"});return out;}
  const largo=tipo==="moral"?12:13;
  if(rfc.length!==largo){out.push({n:"error",t:`RFC de ${rfc.length} caracteres; para ${tipo==="moral"?"persona moral son 12":"persona física son 13"}`});return out;}
  if(!(tipo==="moral"?/^[A-ZÑ&]{3}\d{6}[A-Z0-9]{3}$/:/^[A-ZÑ&]{4}\d{6}[A-Z0-9]{3}$/).test(rfc)){out.push({n:"error",t:"RFC con formato inválido"});return out;}
  const f=solRfcFecha(rfc);if(!f)out.push({n:"error",t:"La fecha dentro del RFC no es válida"});
  const dv=solRfcDigito(rfc);if(dv&&dv!==rfc[rfc.length-1])out.push({n:"warn",t:`Dígito verificador no cuadra (esperado ${dv}); revisa que el RFC esté bien escrito`});
  if(nombre){if(tipo==="moral"){const ini=solIniMoral(nombre);if(ini&&ini!==rfc.slice(0,3))out.push({n:"warn",t:`Las letras del RFC (${rfc.slice(0,3)}) no corresponden a la razón social (se esperaba ${ini})`});}
    else{const c=solIniFisica(nombre);if(c.length&&c.indexOf(rfc.slice(0,4))<0)out.push({n:"warn",t:`Las letras del RFC (${rfc.slice(0,4)}) no corresponden al nombre (se esperaba ${c[0]})`});}}
  if(!out.length)out.push({n:"ok",t:"RFC válido y congruente con el nombre"});
  return out;}

/* ---------- búsqueda de nombres en texto (tolerante a errores de OCR) ---------- */
function solPalabras(txt){return solN(txt).split(" ").filter(Boolean);}
function solBuscaNombre(words,nombre){const toks=solTokens(nombre).filter(t=>t.length>1);if(toks.length<2)return [];
  const W=toks.length+4;const res=[];let ultimo=-99;
  for(let i=0;i<words.length;i++){if(i<ultimo+W)continue;if(!toks.some(t=>solTokEq(words[i],t)))continue;
    const ventana=words.slice(i,i+W);const usados=new Set();let ok=true;
    for(const t of toks){const j=ventana.findIndex((w,k)=>!usados.has(k)&&solTokEq(w,t));if(j<0){ok=false;break;}usados.add(j);}
    if(ok){res.push(i);ultimo=i;}}
  return res;}
const SOL_CARGO_RE=/APODERAD|ADMINISTRADOR UNICO|GERENTE GENERAL|DIRECTOR GENERAL|PRESIDENTE|CONSEJO DE ADMINISTRACION|REPRESENTANTE LEGAL|SE OTORGA|OTORGA PODER|PODER GENERAL|PODER ESPECIAL|SE DESIGNA|SE NOMBRA|NOMBRAMIENTO/;
const SOL_SOCIO_RE=/SOCIO|ACCIONISTA|ACCIONES|PARTES? SOCIAL|SUSCRIBE|SUSCRITO|APORTACION|COMPARECE/;
const SOL_REVOCA_RE=/REVOC/;
/* analiza un nombre dentro del texto de un documento */
function solAnalizaNombre(words,nombre){const pos=solBuscaNombre(words,nombre);const r={veces:pos.length,cargo:false,socio:false,revocado:false,facultades:[]};
  const fac=new Set();
  pos.forEach(i=>{const cerca=words.slice(Math.max(0,i-40),i+60).join(" ");
    if(SOL_CARGO_RE.test(cerca))r.cargo=true;if(SOL_SOCIO_RE.test(cerca))r.socio=true;
    if(SOL_REVOCA_RE.test(words.slice(Math.max(0,i-25),i+25).join(" ")))r.revocado=true;
    const amplio=words.slice(Math.max(0,i-300),i+900).join(" ");
    Object.keys(SOL_FACULTADES).forEach(k=>{if(SOL_FACULTADES[k].re.test(amplio))fac.add(k);});});
  r.facultades=[...fac];return r;}

/* ---------- Constancia de situación fiscal (SAT) ---------- */
const SOL_MESES=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
function solLeeCSF(texto){const T=" "+String(texto||"").toUpperCase().replace(/Ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"Ñ").replace(/\s+/g," ")+" ";
  const g=(re)=>{const m=T.match(re);return m?m[1].trim().slice(0,120):"";};
  const d={
    rfc:g(/RFC:?\s*([A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3})\b/),
    razonSocial:g(/RAZON SOCIAL:?\s*(.+?)\s+(?:REGIMEN CAPITAL|NOMBRE COMERCIAL|FECHA INICIO|ESTATUS)/),
    regimenCapital:g(/REGIMEN CAPITAL:?\s*(.+?)\s+(?:NOMBRE COMERCIAL|FECHA INICIO|ESTATUS)/),
    curp:g(/CURP:?\s*([A-Z]{4}\d{6}[HMX][A-Z]{5}[A-Z0-9]\d)/),
    nombres:g(/NOMBRE ?\(S\):?\s*(.+?)\s+PRIMER APELLIDO/),
    ap1:g(/PRIMER APELLIDO:?\s*(.+?)\s+SEGUNDO APELLIDO/),
    ap2:g(/SEGUNDO APELLIDO:?\s*(.*?)\s+(?:FECHA INICIO|ESTATUS|NOMBRE COMERCIAL)/),
    cp:g(/CODIGO POSTAL:?\s*(\d{5})/),
    vialidad:g(/NOMBRE DE (?:LA )?VIALIDAD:?\s*(.+?)\s+NUMERO EXTERIOR/),
    numExt:g(/NUMERO EXTERIOR:?\s*([A-Z0-9\-]+)/),
    colonia:g(/NOMBRE DE LA COLONIA:?\s*(.+?)\s+NOMBRE DE LA LOCALIDAD|NOMBRE DE LA COLONIA:?\s*(.+?)\s+NOMBRE DEL MUNICIPIO/),
    municipio:g(/DEMARCACION TERRITORIAL:?\s*(.+?)\s+NOMBRE DE LA ENTIDAD/),
    estado:g(/ENTIDAD FEDERATIVA:?\s*(.+?)\s+(?:ENTRE CALLE|Y CALLE|ACTIVIDADES|CORREO)/),
    estatus:g(/ESTATUS EN EL PADRON:?\s*([A-Z]+)/),
    emision:""};
  if(!d.colonia){const m=T.match(/NOMBRE DE LA COLONIA:?\s*(.+?)\s+NOMBRE DEL MUNICIPIO/);if(m)d.colonia=m[1].trim();}
  const em=T.match(/EMISION:?.{0,80}?\b(\d{1,2}) DE ([A-Z]+) DE (\d{4})/);
  if(em){const mi=SOL_MESES.indexOf(em[2]);if(mi>=0)d.emision=`${em[3]}-${String(mi+1).padStart(2,"0")}-${String(em[1]).padStart(2,"0")}`;}
  if(!d.razonSocial&&d.nombres)d.razonSocial=[d.nombres,d.ap1,d.ap2].filter(Boolean).join(" ");
  d.esCSF=/CONSTANCIA DE SITUACION FISCAL|CEDULA DE IDENTIFICACION FISCAL|IDCIF/.test(T)&&!!d.rfc;
  return d;}

/* ---------- datos encontrados en cualquier documento ---------- */
function solHallazgos(texto,sol,tipoPersona){const words=solPalabras(texto);const compacto=words.join("");

const SOL_PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const SOL_PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const _solScripts={};
function solCargarScript(src){if(!_solScripts[src])_solScripts[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=res;s.onerror=()=>{delete _solScripts[src];rej(new Error("no se pudo descargar el lector de documentos. Revisa tu internet e intenta de nuevo."));};document.head.appendChild(s);});return _solScripts[src];}

const SOL_TEXTOS={}; // texto leído en esta sesión (para revalidar sin volver a leer)
async function solLeerArchivo(file,{onProg,cancel}){
  const nombre=file.name||"archivo";const tipo=file.type||"";
  if(/\.(xlsx|xlsm|xls)$/i.test(nombre)){const buf=await file.arrayBuffer();return {metodo:"excel",wb:XLSX.read(buf,{type:"array",cellDates:true})};}
  if(/pdf/i.test(tipo)||/\.pdf$/i.test(nombre)){
    await solCargarScript(SOL_PDFJS);window.pdfjsLib.GlobalWorkerOptions.workerSrc=SOL_PDFJS_WORKER;
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const n=pdf.numPages;
    const partes=[];let ocr=0;let worker=null;
    try{for(let p=1;p<=n;p++){if(cancel&&cancel.v)throw new Error("lectura cancelada.");
      onProg&&onProg(`Leyendo página ${p} de ${n}…`,(p-1)/n);
      const page=await pdf.getPage(p);const tc=await page.getTextContent();let t=tc.items.map(i=>i.str).join(" ");
      if(t.replace(/\s/g,"").length<40){ // página escaneada → OCR
        if(!worker)worker=await solOcrWorker(onProg);
        const vp=page.getViewport({scale:2});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;

        t=(await worker.recognize(c)).data.text;ocr++;c.width=c.height=0;}
      partes.push(t);}}

  if(/^image\//i.test(tipo)||/\.(jpe?g|png|webp|bmp)$/i.test(nombre)){
    if(/heic|heif/i.test(tipo+nombre))throw new Error("las fotos HEIC de iPhone no se pueden leer; mándala como JPG o PDF.");
    const w=await solOcrWorker(onProg);try{onProg&&onProg("Reconociendo texto de la imagen…",.5);return {metodo:"ocr",texto:(await w.recognize(file)).data.text,paginas:1,ocrPags:1};}finally{await w.terminate();}}

function SolicitudAlta({f,puedeEditar,onClose,onAplicar,subirDoc}){
  const llave="sol-borrador-"+(f.id||"nuevo");
  const [sol,setSolS]=useState(()=>{const base=solNormaliza(f.solicitud);try{const b=JSON.parse(localStorage.getItem(llave)||"null");if(b&&b.guardado>(base.actualizado||"")&&window.confirm("Hay una captura de la solicitud que no se aplicó a la tarjeta. ¿Recuperarla?"))return solNormaliza(b.sol);}catch(e){}return base;});
  const solRef=React.useRef(sol);
  const tipoPersona=f.tipoPersona||(solRfc(sol.fiscal.rfc).length===13?"Persona física":"Persona moral");
  const setSol=fn=>setSolS(p=>{const n=typeof fn==="function"?fn(p):fn;solRef.current=n;try{localStorage.setItem(llave,JSON.stringify({guardado:new Date().toISOString(),sol:n}));}catch(e){}return n;});
  const [tab,setTab]=useState("captura");const [prog,setProg]=useState(null);const [subirTambien,setSubirTambien]=useState(true);
  const cancelRef=React.useRef({v:false});const ro=!puedeEditar;

  async function cargar(slot,file){if(!file)return;cancelRef.current={v:false};setProg({k:slot.k,msg:"Abriendo archivo…",pct:0});
    try{const r=await solLeerArchivo(file,{onProg:(msg,pct)=>setProg({k:slot.k,msg,pct}),cancel:cancelRef.current});
      if(r.metodo==="excel"){if(slot.k!=="solicitud"){alert("Para este documento usa PDF o foto; el Excel solo aplica a la solicitud.");return;}
        if(!importarExcel(r.wb,file.name))return;setTab("validacion");}
      else{const reg={archivo:file.name,fecha:HOY,metodo:r.metodo,paginas:r.paginas,ocrPags:r.ocrPags};
        reg.hall=solHallazgos(r.texto,solRef.current,tipoPersona);if(slot.csf)reg.csf=solLeeCSF(r.texto);
        if(r.texto.replace(/\s/g,"").length<30)alert(`No se pudo leer texto en "${file.name}". Si es foto, que sea nítida, de frente y con buena luz.`);
        setSol(p=>{const docs={...p.docs};if(slot.multi){const arr=(Array.isArray(docs[slot.k])?docs[slot.k]:[]).filter(d=>d.archivo!==file.name);SOL_TEXTOS[slot.k+"|"+file.name]=r.texto;docs[slot.k]=[...arr,reg];}else{SOL_TEXTOS[slot.k+"|"+file.name]=r.texto;docs[slot.k]=reg;}return {...p,docs};});}
      if(subirTambien&&subirDoc&&slot.up){setProg({k:slot.k,msg:"Subiendo al expediente (Google Drive)…",pct:1});const ok=await subirDoc(slot.up,file);
        if(ok)setSol(p=>{const docs={...p.docs};const marca=d=>d&&d.archivo===file.name?{...d,subido:true}:d;docs[slot.k]=Array.isArray(docs[slot.k])?docs[slot.k].map(marca):marca(docs[slot.k]);return {...p,docs};});}
    }catch(e){alert("No se pudo leer "+file.name+": "+e.message);}
    finally{setProg(null);}}
  function revalidar(){let faltan=0;setSol(p=>{const docs={...p.docs};Object.keys(docs).forEach(k=>{const arr=Array.isArray(docs[k])?docs[k]:[docs[k]];const nuevos=arr.map(d=>{const t=d&&SOL_TEXTOS[k+"|"+d.archivo];if(!d||d.metodo==="excel")return d;if(!t){faltan++;return d;}return {...d,hall:solHallazgos(t,p,tipoPersona)};});docs[k]=Array.isArray(docs[k])?nuevos:nuevos[0];});return {...p,docs};});
    setTimeout(()=>alert(faltan?`Listo. ${faltan} documento(s) se leyeron en otra sesión: vuelve a cargarlos para revalidarlos con los datos actuales.`:"Listo, se revalidaron los documentos con los datos actuales."),50);}
  function quitarDoc(k,idx){if(!window.confirm("¿Quitar esta lectura? (El archivo en el expediente no se borra.)"))return;setSol(p=>{const docs={...p.docs};if(Array.isArray(docs[k])){docs[k]=docs[k].filter((_,i)=>i!==idx);}else delete docs[k];return {...p,docs};});}

    setSol(p=>{const rv={...(p.revisiones||{})};if(!nota.trim())delete rv[x.id];else rv[x.id]={nota:nota.trim(),por:(USUARIO&&USUARIO.nombre)||"",fecha:HOY};return {...p,revisiones:rv};});}
  const [bajando,setBajando]=useState(false);
