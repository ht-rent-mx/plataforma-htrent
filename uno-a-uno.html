const hoy = () => new Date().toISOString().slice(0,10);
const periodoActual = () => new Date().toISOString().slice(0,7);
const dias = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000);
const fFecha = (d) => { if(!d) return '—'; const p=String(d).slice(0,10).split('-'); if(p.length<3) return d;
  const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return p[2]+' '+m[+p[1]-1]+' '+p[0]; };
const fPeriodo = (p) => { if(!p) return '—'; const m=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const x=String(p).split('-'); return (m[+x[1]-1]||'')+' '+x[0]; };
const iniciales = (n) => String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const clave = (c) => (c.area||'')+'-'+(c.rol||'');
const semanaISO = (f) => {
  const d = new Date(f+'T12:00:00'); const j = new Date(d.getFullYear(),0,1);
  return 'Sem '+String(Math.ceil((((d-j)/86400000)+j.getDay()+1)/7)).padStart(2,'0');
};

function kpisDeRol(area, rol){
  const base = (KPIS[area]||[]).filter(k => (k.peso[rol]||0) > 0);
  const suma = base.reduce((a,k)=>a+k.peso[rol],0) || 1;
  return base.map(k => ({...k, pesoRol:k.peso[rol], pesoNorm:+(k.peso[rol]/suma*100).toFixed(2)}));
}
function cumplimiento(k, valor){
  const v = parseFloat(valor);
  if (valor === '' || valor === null || valor === undefined || isNaN(v)) return null;
  if (k.evalua === 'semaforo'){
    if (k.dir === 'mayor') return v >= k.verde ? FACTOR.verde : (v >= k.amarillo ? FACTOR.amarillo : FACTOR.rojo);
    return v <= k.verde ? FACTOR.verde : (v <= k.amarillo ? FACTOR.amarillo : FACTOR.rojo);
  }
  if (k.dir === 'mayor') return Math.max(0, Math.min(100, k.meta ? v/k.meta*100 : 0));
  if (v <= 0) return 100;
  return Math.max(0, Math.min(100, k.meta/v*100));
}
function nivelDe(area, pct, rol){
  const esc = ESCALAS[area] || ESCALAS.SC;
  const n = esc.niveles.find(x => pct >= x.min) || esc.niveles[esc.niveles.length-1];
  return {...n, bonoPct:n.bono[rol]||0, referencia:esc.referencia};
}
function globalDe(colab, periodo, kpisData){
  const lista = kpisDeRol(colab.area, colab.rol);
  const regs = kpisData.filter(r => r.colaboradorId===colab.id && r.periodo===periodo);
  let acum=0, pesoUsado=0; const detalle=[];
  lista.forEach(k=>{
    const r = regs.find(x=>x.kpiId===k.id);
    const c = r ? cumplimiento(k, r.resultado) : null;
    if (c !== null){ acum += c*k.pesoNorm/100; pesoUsado += k.pesoNorm; }
    detalle.push({...k, resultado:r?r.resultado:'', comentario:r?r.comentario:'', cumpl:c});
  });
  const pct = pesoUsado>0 ? +(acum/pesoUsado*100).toFixed(1) : null;
  return {pct, detalle, cobertura:+pesoUsado.toFixed(0)};
}
function colorPct(p){ if(p===null||p===undefined) return 'var(--line)'; if(p>=85) return 'var(--green)'; if(p>=75) return 'var(--navy)'; if(p>=60) return 'var(--amber)'; return 'var(--red)'; }

function jsonp(action, data){
  return new Promise((res, rej)=>{
    if(!CONFIG.API_URL || CONFIG.API_URL.indexOf('http')!==0)
      return rej(new Error('Falta configurar la URL del backend en CONFIG.API_URL.'));
    const cb = 'cb'+Date.now()+Math.floor(Math.random()*1000);
    const s = document.createElement('script');
    const to = setTimeout(()=>{fin(); rej(new Error('El servidor no respondió a tiempo.'));}, 25000);
    function fin(){ clearTimeout(to); try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (r)=>{ fin(); (r && r.ok) ? res(r.data) : rej(new Error((r&&r.error)||'Error desconocido')); };
    s.onerror = ()=>{ fin(); rej(new Error('No se pudo conectar con el backend.')); };
    s.src = CONFIG.API_URL+'?callback='+cb+'&token='+encodeURIComponent(CONFIG.TOKEN)
          +'&action='+encodeURIComponent(action)+'&data='+encodeURIComponent(JSON.stringify(data||{}));
    document.body.appendChild(s);
  });
}

function esperarHT(){

}
function Login({onEntrar}){
  const [err, setErr] = useState('');

function estadoSesion(colab, sesiones){
  const s = sesiones.filter(x=>x.colaboradorId===colab.id && x.estado==='Realizada')
                    .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const ultima = s[0] ? String(s[0].fecha).slice(0,10) : null;
  const limite = colab.frecuencia==='SEMANAL' ? 7 : 14;
  const d = ultima ? dias(ultima, hoy()) : null;
  return {ultima, d, vencida: d===null || d>limite, limite, total:s.length};
}
function acuerdosDe(colab, acuerdos){
  const mios = acuerdos.filter(a=>a.colaboradorId===colab.id);
  const abiertos = mios.filter(a=>a.estado==='Pendiente'||a.estado==='En curso');
  const vencidos = abiertos.filter(a=>a.fechaCompromiso && String(a.fechaCompromiso).slice(0,10) < hoy());
  const cerrados = mios.filter(a=>a.estado==='Cumplido');
  const tasa = mios.length ? Math.round(cerrados.length/mios.length*100) : null;
  return {mios, abiertos, vencidos, cerrados, tasa};
}

function ListaSesiones({sesiones, verSesion, acuerdos}){

/* ============================================================
   11. RUTINA SEMANAL
   ============================================================ */
function PanelRutina({colab, data, verSesion}){
  const ses = data.Sesiones.filter(s=>s.colaboradorId===colab.id)
                .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const conRutina = ses.filter(s=>data.Rutinas.some(r=>r.sesionId===s.id));
  const cat = RUTINAS[clave(colab)] || [];

  // promedio por actividad en las últimas 8 semanas
  const ultimas = conRutina.slice(0,8).map(s=>s.id);
  const porAct = cat.map(a=>{
    const rs = data.Rutinas.filter(r=>ultimas.includes(r.sesionId) && r.actividad===a);
    const v = rs.length ? rs.reduce((x,r)=>x+(parseFloat(r.score)||0),0)/rs.length : null;
    return {a, v: v===null?null:Math.round(v*100), n:rs.length};
  });

  return (
    <div className="grid g2">
      <div className="card">
        <div className="hd"><h3>Semanas registradas</h3></div>
        <div className="tw">
          {!conRutina.length ? <Vacio titulo="Sin rutina capturada" texto="La rutina se llena dentro de la sesión, en el bloque 03."/> :
          <table><thead><tr><th>Semana</th><th>Fecha</th><th>Promedio</th><th></th></tr></thead>
          <tbody>{conRutina.map(s=>{
            const pr = Math.round((parseFloat(s.promedioRutina)||0)*100);
            return <tr key={s.id}>
              <td className="dato">{s.semana || semanaISO(String(s.fecha).slice(0,10))}</td>
              <td className="dato">{fFecha(s.fecha)}</td>
              <td><div className="dato" style={{fontWeight:600,color:colorPct(pr)}}>{pr}%</div><Barra pct={pr} color={colorPct(pr)}/></td>
              <td><button className="btn gh sm" onClick={()=>verSesion(s)}>Abrir</button></td>
            </tr>;})}
          </tbody></table>}
        </div>
      </div>

      <div className="card">
        <div className="hd"><h3>Dónde se gana y dónde se pierde</h3></div>
        <div className="bd">
          <div className="sub" style={{marginBottom:12}}>Promedio por actividad en las últimas 8 semanas capturadas. Lo que aparece abajo es lo que hay que trabajar en la 1 a 1.</div>
          {porAct.slice().sort((a,b)=>(a.v===null?101:a.v)-(b.v===null?101:b.v)).map(x=>(
            <div key={x.a} style={{padding:'8px 0',borderBottom:'1px solid var(--paper)'}}>
              <div style={{display:'flex',gap:10,alignItems:'center'}}>
                <div style={{flex:1,fontSize:13.5}}>{x.a}</div>
                <div className="dato" style={{fontWeight:600,color:colorPct(x.v),width:50,textAlign:'right'}}>{x.v===null?'—':x.v+'%'}</div>
              </div>
              <div style={{marginTop:5}}><Barra pct={x.v||0} color={colorPct(x.v)}/></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   12. KPIs
   ============================================================ */
function PanelKPIs({colab, data, periodo, setPeriodo, guardar, soloLectura}){
  const g = globalDe(colab, periodo, data.KPIs);
  const [vals, setVals] = useState({});
  const [coment, setComent] = useState({});
  const [guardando, setGuardando] = useState(false);

  useEffect(()=>{
    const v={}, c={};
    g.detalle.forEach(k=>{ v[k.id]=(k.resultado===0||k.resultado)?String(k.resultado):''; c[k.id]=k.comentario||''; });
    setVals(v); setComent(c);
  }, [colab.id, periodo, data.KPIs.length]);

  const ejecArea = data.Colaboradores.find(x=>x.area===colab.area && x.rol==='EJEC');
  const sugerido = colab.rol==='COORD' && ejecArea ? globalDe(ejecArea, periodo, data.KPIs).pct : null;

  const previo = useMemo(()=>{
    const lista = kpisDeRol(colab.area, colab.rol);
    let acum=0, peso=0;
    lista.forEach(k=>{ const c=cumplimiento(k, vals[k.id]); if(c!==null){acum+=c*k.pesoNorm/100; peso+=k.pesoNorm;} });
    return peso>0 ? +(acum/peso*100).toFixed(1) : null;
  }, [vals, colab.id]);
  const nv = previo!==null ? nivelDe(colab.area, previo, colab.rol) : null;

  async function guardarTodo(){
    setGuardando(true);
    const regs = [];
    kpisDeRol(colab.area, colab.rol).forEach(k=>{
      const ex = data.KPIs.find(r=>r.colaboradorId===colab.id && r.periodo===periodo && r.kpiId===k.id);
      if(vals[k.id]==='' && !ex) return;
      regs.push({id: ex?ex.id:'', colaboradorId:colab.id, periodo, kpiId:k.id, resultado:vals[k.id], comentario:coment[k.id]||''});
    });
    if(regs.length) await guardar('KPIs', regs);
    setGuardando(false);
  }

  return (
    <div className="card">
      <div className="hd"><h3>KPIs de {colab.nombre.split(' ')[0]}</h3><div style={{flex:1}}></div>
        <input type="month" value={periodo} onChange={e=>setPeriodo(e.target.value)} style={{width:160}}/></div>
      <div className="bd">
        <div className="aviso info">
          {colab.area==='DOC'
            ? <>Evaluación por semáforo, igual que tu matriz de Documentación: verde vale {FACTOR.verde}%, amarillo {FACTOR.amarillo}% y rojo {FACTOR.rojo}%. Los porcentajes se capturan como número entero (98, no 0.98).</>
            : <>Evaluación proporcional contra la meta, topada al 100% por indicador: rebasar una meta no compensa otra por debajo.</>}
        </div>

        <div className="kpirow" style={{borderBottom:'1px solid var(--line)',paddingBottom:6}}>
          <div className="eyebrow">Indicador</div><div className="eyebrow">Meta</div>
          <div className="eyebrow">Resultado</div><div className="eyebrow">Cumplimiento</div>
        </div>

        {kpisDeRol(colab.area, colab.rol).map(k=>{
          const c = cumplimiento(k, vals[k.id]);
          return (
            <div key={k.id}>
              <div className="kpirow">
                <div>
                  <div className="nm">{k.nombre}</div>
                  <div className="mt">Peso {k.pesoNorm}% · {k.fuente}</div>
                </div>
                <div className="dato" style={{fontSize:13}}>
                  {k.evalua==='semaforo'
                    ? <>V {k.dir==='menor'?'≤':'≥'}{k.verde} · A {k.amarillo}</>
                    : <>{k.dir==='menor'?'≤ ':'≥ '}{k.meta} {k.u}</>}
                </div>
                <div>
                  <input type="number" step="0.1" value={vals[k.id]||''} disabled={soloLectura}
                    onChange={e=>setVals({...vals,[k.id]:e.target.value})} placeholder="—"/>
                  {k.id==='sc7' && sugerido!==null && !soloLectura &&
                    <button className="btn gh sm" style={{marginTop:5,width:'100%'}}
                      onClick={()=>setVals({...vals,[k.id]:String(sugerido)})}>Usar {sugerido}%</button>}
                </div>
                <div>
                  <div className="dato" style={{fontWeight:600,color:colorPct(c)}}>{c===null?'—':Math.round(c)+'%'}</div>
                  <Barra pct={c||0} color={colorPct(c)}/>
                </div>
              </div>
              {!soloLectura
                ? <input type="text" placeholder="Nota del periodo (opcional): qué explica este número"
                    value={coment[k.id]||''} onChange={e=>setComent({...coment,[k.id]:e.target.value})}
                    style={{marginBottom:10,fontSize:13}}/>
                : (coment[k.id] ? <div className="sub" style={{marginBottom:10}}>{coment[k.id]}</div> : null)}
            </div>
          );
        })}

        <div className="hr"></div>
        <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          <div>
            <div className="eyebrow">Resultado global del periodo</div>
            <div className="dato" style={{fontSize:34,fontWeight:600,color:colorPct(previo)}}>{previo===null?'—':previo+'%'}</div>
          </div>
          {nv && <div><span className={'tag '+nv.cls}>{nv.nombre}</span>
            <div className="sub" style={{marginTop:4}}>Bono proyectado: <b>{nv.bonoPct}%</b> {nv.referencia}</div></div>}
          <div style={{flex:1}}></div>
          {!soloLectura &&
            <button className="btn" onClick={guardarTodo} disabled={guardando}>
              {guardando ? <span className="spin"></span> : null} Guardar KPIs del periodo</button>}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   13. ACUERDOS
   ============================================================ */
function PanelAcuerdos({colab, acuerdos, guardar, soloLectura}){
  const [edit, setEdit] = useState(null);
  const orden = [...acuerdos].sort((a,b)=>String(b.fechaCompromiso).localeCompare(String(a.fechaCompromiso)));
  async function cambiarEstado(a, estado){
    await guardar('Acuerdos', [{...a, estado, fechaCierre:(estado==='Cumplido'||estado==='Cancelado')?hoy():''}]);
  }
  return (
    <div className="card">
      <div className="hd"><h3>Acuerdos de {colab.nombre.split(' ')[0]}</h3><div style={{flex:1}}></div>
        {!soloLectura && <button className="btn gh sm" onClick={()=>setEdit({colaboradorId:colab.id, estado:'Pendiente', responsable:'Colaborador', fechaCompromiso:hoy()})}>+ Nuevo acuerdo</button>}</div>
      <div className="tw">
        {!orden.length ? <Vacio titulo="Sin acuerdos" texto="Los acuerdos nacen en la sesión 1 a 1. Máximo tres por sesión."/> :
        <table><thead><tr><th>Acuerdo</th><th>Responsable</th><th>Compromiso</th><th>Estado</th><th></th></tr></thead>
        <tbody>{orden.map(a=>{
          const tarde = (a.estado==='Pendiente'||a.estado==='En curso') && a.fechaCompromiso && String(a.fechaCompromiso).slice(0,10)<hoy();
          return <tr key={a.id}>
            <td style={{maxWidth:360}}>{a.descripcion}{a.evidencia && <div className="sub">Evidencia: {a.evidencia}</div>}</td>
            <td>{a.responsable}</td>
            <td className="dato" style={{whiteSpace:'nowrap',color:tarde?'var(--red)':'inherit'}}>{fFecha(a.fechaCompromiso)}</td>
            <td><span className={'tag '+(a.estado==='Cumplido'?'t-ok':tarde?'t-rj':a.estado==='Cancelado'?'t-gr':'t-al')}>{tarde?'Vencido':a.estado}</span></td>
            <td style={{whiteSpace:'nowrap'}}>
              {!soloLectura && <>
                {a.estado!=='Cumplido' && <button className="btn gh sm" onClick={()=>cambiarEstado(a,'Cumplido')}>Cumplido</button>}{' '}
                <button className="btn gh sm" onClick={()=>setEdit(a)}>Editar</button></>}
            </td>
          </tr>;})}
        </tbody></table>}
      </div>
      {edit && <FormAcuerdo acuerdo={edit} onCerrar={()=>setEdit(null)} guardar={guardar}/>}
    </div>
  );
}

function FormAcuerdo({acuerdo, onCerrar, guardar}){

  const [g, setG] = useState(false);
  async function ok(){ setG(true); await guardar('Acuerdos',[f]); setG(false); onCerrar(); }

    <Modal titulo={f.id?'Editar acuerdo':'Nuevo acuerdo'} onCerrar={onCerrar}
      pie={<><button className="btn gh" onClick={onCerrar}>Cancelar</button>

          placeholder="Ej.: Enviar el reporte de expedientes pendientes cada viernes antes de las 14:00."/></Campo>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Campo etiqueta="Responsable">
          <select value={f.responsable} onChange={e=>setF({...f,responsable:e.target.value})}>

        <Campo etiqueta="Fecha compromiso">
          <input type="date" value={String(f.fechaCompromiso||'').slice(0,10)} onChange={e=>setF({...f,fechaCompromiso:e.target.value})}/></Campo>
        <Campo etiqueta="Estado">
          <select value={f.estado} onChange={e=>setF({...f,estado:e.target.value})}>
            <option>Pendiente</option><option>En curso</option><option>Cumplido</option><option>Cancelado</option></select></Campo>
        <Campo etiqueta="Evidencia esperada" ayuda="cómo sabremos que se cumplió">
          <input type="text" value={f.evidencia||''} onChange={e=>setF({...f,evidencia:e.target.value})}/></Campo>
      </div>
      <Campo etiqueta="Comentario de seguimiento"><textarea value={f.comentario||''} onChange={e=>setF({...f,comentario:e.target.value})} style={{minHeight:60}}/></Campo>
    </Modal>
  );
}

/* ============================================================
   14. DESARROLLO Y COMPETENCIAS
   ============================================================ */
function PanelDesarrollo({colab, data, guardar, soloLectura}){
  const items = data.Desarrollo.filter(d=>d.colaboradorId===colab.id);
  const comps = data.Competencias.filter(d=>d.colaboradorId===colab.id);
  const cat = COMPETENCIAS[clave(colab)] || [];

  const [editC, setEditC] = useState(null);

  return (
    <div className="grid g2">
      <div className="card">
        <div className="hd"><h3>Plan de desarrollo</h3><div style={{flex:1}}></div>
          {!soloLectura && <button className="btn gh sm" onClick={()=>setEdit({colaboradorId:colab.id, estado:'En curso', avance:0, nivelActual:'2', nivelObjetivo:'4', trimestre:'2026-T3', competencia:cat[0]||''})}>+ Competencia</button>}</div>
        <div className="bd">
          {!items.length ? <Vacio titulo="Sin plan de desarrollo" texto="Una o dos competencias por trimestre. Más de dos a la vez no se desarrolla ninguna."/> :

                  <div style={{fontWeight:600}}>{d.competencia}</div>
                  <div className="sub">Nivel {d.nivelActual} → {d.nivelObjetivo} · {d.trimestre} · <span className="tag t-nt">{d.estado}</span></div>
                  {d.acciones && <div style={{fontSize:13.5,marginTop:6}}><b>Acciones:</b> {d.acciones}</div>}
                  {d.evidencia && <div style={{fontSize:13.5}}><b>Evidencia:</b> {d.evidencia}</div>}
                </div>
                <div style={{width:160}}>
                  <div className="dato" style={{fontWeight:600,marginBottom:4}}>{d.avance||0}%</div>
                  <Barra pct={d.avance||0} color={colorPct(d.avance)}/>
                  {!soloLectura && <button className="btn gh sm" style={{marginTop:8}} onClick={()=>setEdit(d)}>Editar</button>}
                </div>
              </div>
            </div>))}
        </div>
      </div>

      <div className="card">
        <div className="hd"><h3>Competencias del puesto</h3></div>
        <div className="bd">
          <div className="sub" style={{marginBottom:12}}>Evaluación de 1 a 5. Sirve para ver el perfil completo, no solo el número del mes.</div>
          {cat.map(c=>{
            const ev = comps.find(x=>x.competencia===c);
            const n = ev ? parseInt(ev.nivel,10)||0 : 0;
            return (
              <div key={c} style={{padding:'9px 0',borderBottom:'1px solid var(--paper)'}}>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                  <div style={{flex:1,fontSize:13.5}}>{c}</div>
                  <div className="dato" style={{fontWeight:600,color:n?colorPct(n/5*100):'var(--gray)'}}>{n?n+'/5':'—'}</div>

      </Modal>}

  );
}

        <Campo etiqueta="Nivel actual" ayuda="1 a 5"><input type="number" min="1" max="5" value={f.nivelActual} onChange={e=>setF({...f,nivelActual:e.target.value})}/></Campo>
        <Campo etiqueta="Nivel objetivo"><input type="number" min="1" max="5" value={f.nivelObjetivo} onChange={e=>setF({...f,nivelObjetivo:e.target.value})}/></Campo>
        <Campo etiqueta="Trimestre"><input type="text" value={f.trimestre} onChange={e=>setF({...f,trimestre:e.target.value})} placeholder="2026-T3"/></Campo>
      </div>
      <Campo etiqueta="Acciones concretas" ayuda="qué va a hacer, no qué va a 'mejorar'">
        <textarea value={f.acciones} onChange={e=>setF({...f,acciones:e.target.value})}
          placeholder="Ej.: Dirigir la junta semanal de entregas dos veces al mes y recibir retroalimentación al terminar."/></Campo>
      <Campo etiqueta="Evidencia de avance"><input type="text" value={f.evidencia} onChange={e=>setF({...f,evidencia:e.target.value})}/></Campo>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Campo etiqueta="Avance (%)"><input type="number" min="0" max="100" value={f.avance} onChange={e=>setF({...f,avance:e.target.value})}/></Campo>
        <Campo etiqueta="Estado"><select value={f.estado} onChange={e=>setF({...f,estado:e.target.value})}>
          <option>En curso</option><option>Logrado</option><option>En pausa</option></select></Campo>
      </div>
    </Modal>
  );
}

function PanelPerfil({colab, guardar, soloLectura}){
  const [f, setF] = useState(colab);

    ['driver','Driver / sueños','qué lo mueve de verdad, dentro y fuera del trabajo'],

  return (
    <div className="card">

          soloLectura
            ? <div key={k} style={{marginBottom:14}}>

            {g?<span className="spin"></span>:null} Guardar perfil</button>}
      </div>
    </div>
  );
}

/* ============================================================
   16. PLAN GERENCIAL DE 90 DÍAS
   ============================================================ */
function PlanGerencial({data, guardar, soloLectura}){
  const [fase, setFase] = useState('Todas');
  const [edit, setEdit] = useState(null);
  const filas = data.PlanGerencial.filter(p=>fase==='Todas'||p.fase===fase)
                  .sort((a,b)=>(+a.semana)-(+b.semana));
  const nom = (id)=>{ const c=data.Colaboradores.find(x=>x.id===id); return c?c.nombre.split(' ')[0]:(id==='ADMIN'?'Roger':'—'); };
  const total = data.PlanGerencial.length;
  const cumpl = data.PlanGerencial.filter(p=>p.estatus==='Cumplida').length;
  const bloq  = data.PlanGerencial.filter(p=>p.estatus==='Bloqueada').length;
  const prom  = total ? Math.round(data.PlanGerencial.reduce((a,p)=>a+(parseFloat(p.avance)||0),0)/total) : 0;

  return (
    <div>
      <div className="grid g4" style={{marginBottom:18}}>
        {[['Actividades',total,'var(--ink)'],['Cumplidas',cumpl,'var(--green)'],['Bloqueadas',bloq,bloq?'var(--red)':'var(--ink)'],['Avance promedio',prom+'%',colorPct(prom)]].map(([l,v,c])=>
          <div key={l} className="card"><div className="bd">
            <div className="eyebrow">{l}</div>
            <div className="dato" style={{fontSize:30,fontWeight:600,color:c}}>{v}</div></div></div>)}
      </div>

      <div className="card">
        <div className="hd"><h3>Plan operativo de 90 días</h3><div style={{flex:1}}></div>
          <select value={fase} onChange={e=>setFase(e.target.value)} style={{width:150}}>
            <option>Todas</option><option>Fase 1</option><option>Fase 2</option><option>Fase 3</option></select></div>
        <div className="tw">
          {!filas.length ? <Vacio titulo="Sin actividades" texto="El plan se siembra al ejecutar crearEstructura en el backend."/> :
          <table><thead><tr><th>Sem</th><th>Área</th><th>Actividad</th><th>Entregable</th><th>Resp.</th><th>Compromiso</th><th>Estatus</th><th>Avance</th><th></th></tr></thead>
          <tbody>{filas.map(p=>{
            const tarde = p.estatus!=='Cumplida' && p.estatus!=='Cancelada' && p.fechaCompromiso && String(p.fechaCompromiso).slice(0,10)<hoy();
            const av = parseFloat(p.avance)||0;
            return <tr key={p.id}>
              <td className="dato">{p.semana}</td>
              <td className="sub">{p.area}</td>
              <td style={{maxWidth:260}}>{p.actividad}{p.bloqueo && <div className="sub" style={{color:'var(--red)'}}>Bloqueo: {p.bloqueo}</div>}</td>
              <td className="sub" style={{maxWidth:180}}>{p.entregable}</td>
              <td>{nom(p.responsableId)}</td>
              <td className="dato" style={{whiteSpace:'nowrap',color:tarde?'var(--red)':'inherit'}}>{fFecha(p.fechaCompromiso)}</td>
              <td><span className={'tag '+(p.estatus==='Cumplida'?'t-ok':p.estatus==='Bloqueada'?'t-rj':tarde?'t-rj':p.estatus==='En proceso'?'t-al':'t-gr')}>{tarde&&p.estatus!=='Bloqueada'?'Fuera de fecha':p.estatus}</span></td>
              <td style={{minWidth:90}}><div className="dato" style={{fontWeight:600,color:colorPct(av)}}>{av}%</div><Barra pct={av} color={colorPct(av)}/></td>
              <td>{!soloLectura && <button className="btn gh sm" onClick={()=>setEdit(p)}>Editar</button>}</td>
            </tr>;})}
          </tbody></table>}
        </div>
      </div>

      {edit && <Modal titulo={'Semana '+edit.semana+' · '+edit.area} onCerrar={()=>setEdit(null)}
        pie={<><button className="btn gh" onClick={()=>setEdit(null)}>Cancelar</button>
             <button className="btn" onClick={async()=>{await guardar('PlanGerencial',[edit]); setEdit(null);}}>Guardar</button></>}>
        <div style={{marginBottom:14}}>
          <div className="eyebrow">Actividad</div><div style={{fontSize:14.5}}>{edit.actividad}</div>
          <div className="sub" style={{marginTop:4}}>Entregable: {edit.entregable}</div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <Campo etiqueta="Estatus"><select value={edit.estatus} onChange={e=>setEdit({...edit,estatus:e.target.value})}>
            {ESTATUS_PLAN.map(s=><option key={s}>{s}</option>)}</select></Campo>
          <Campo etiqueta="Avance (%)"><input type="number" min="0" max="100" value={edit.avance} onChange={e=>setEdit({...edit,avance:e.target.value})}/></Campo>
          <Campo etiqueta="Fecha compromiso"><input type="date" value={String(edit.fechaCompromiso||'').slice(0,10)} onChange={e=>setEdit({...edit,fechaCompromiso:e.target.value})}/></Campo>
          <Campo etiqueta="Responsable"><input type="text" value={edit.responsableId} onChange={e=>setEdit({...edit,responsableId:e.target.value})} placeholder="C1, C3, ADMIN…"/></Campo>
        </div>
        <Campo etiqueta="Bloqueo principal" ayuda="qué impide avanzar, y de quién depende">
          <textarea value={edit.bloqueo||''} onChange={e=>setEdit({...edit,bloqueo:e.target.value})} style={{minHeight:60}}/></Campo>
        <Campo etiqueta="Siguiente acción">
          <textarea value={edit.siguienteAccion||''} onChange={e=>setEdit({...edit,siguienteAccion:e.target.value})} style={{minHeight:60}}/></Campo>
      </Modal>}
    </div>
  );
}

/* ============================================================
   17. SESIÓN 1 A 1
   ============================================================ */
function Sesion({data, colaboradorId, sesion, periodo, onCerrar, guardar, soloLectura}){
  const cols = data.Colaboradores.filter(c=>c.rol!=='ADMIN' && String(c.activo).toUpperCase()!=='NO');
  const [paso, setPaso] = useState(0);
  const [f, setF] = useState(()=>({
    colaboradorId: colaboradorId || (cols[0]?cols[0].id:''),
    fecha: hoy(), estado:'Realizada', duracionMin:45, animo:3,
    checkin:'', logros:'', mejoras:'', refuerzo:'', obstaculos:'', apoyo:'',
    temasColaborador:'', notasPrivadas:'', proximaSesion:'', reglas:'',
    seguir:'', empezar:'', dejar:'', metaSemana:'', feedbackMeta:'', promedioRutina:'', semana:'',
    ...(sesion||{})
  }));
  const colab = cols.find(c=>c.id===f.colaboradorId) || cols[0];
  const cat = colab ? (RUTINAS[clave(colab)] || []) : [];

  const [scores, setScores] = useState(()=>{
    const s = {};
    if(sesion){ data.Rutinas.filter(r=>r.sesionId===sesion.id).forEach(r=>{ s[r.actividad]=String(r.score); }); }
    return s;
  });
  const [nuevos, setNuevos] = useState([]);
  const [g, setG] = useState(false);

  const marcadas = String(f.reglas||'').split(',').filter(Boolean);
  const previos = data.Acuerdos.filter(a=>a.colaboradorId===f.colaboradorId && (a.estado==='Pendiente'||a.estado==='En curso'));
  const gl = colab ? globalDe(colab, periodo, data.KPIs) : {pct:null, detalle:[]};
  const sesionPrevia = data.Sesiones.filter(s=>s.colaboradorId===f.colaboradorId && s.id!==f.id && s.estado==='Realizada')
                        .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0];

  const promedio = useMemo(()=>{
    const v = cat.map(a=>scores[a]).filter(x=>x!==undefined && x!=='').map(parseFloat);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
  }, [scores, colab && colab.id]);

  function toggleRegla(id){
    const s = new Set(marcadas);
    s.has(id) ? s.delete(id) : s.add(id);
    setF({...f, reglas:[...s].join(',')});
  }

  const completos = [
    marcadas.length>=3, !!f.checkin, promedio!==null, gl.pct!==null,
    !!(f.logros && f.mejoras), !!(f.seguir||f.empezar||f.dejar),
    !!f.metaSemana || nuevos.length>0
  ];

  async function guardarSesion(){
    setG(true);
    const cab = {...f, promedioRutina: promedio===null?'':promedio.toFixed(3), semana: semanaISO(String(f.fecha).slice(0,10))};
    const r = await guardar('Sesiones', [cab], true);
    const idSesion = (r && r[0] && r[0].id) || f.id;
    if(idSesion){
      const rut = cat.filter(a=>scores[a]!==undefined && scores[a]!=='').map(a=>{
        const ex = sesion ? data.Rutinas.find(x=>x.sesionId===sesion.id && x.actividad===a) : null;
        return {id: ex?ex.id:'', sesionId:idSesion, colaboradorId:f.colaboradorId, semana:cab.semana, actividad:a, score:scores[a], comentario:''};
      });
      if(rut.length) await guardar('Rutinas', rut);
      const listos = nuevos.filter(a=>a.descripcion.trim());
      if(listos.length) await guardar('Acuerdos', listos.map(a=>({...a, sesionId:idSesion, colaboradorId:f.colaboradorId})));
    }
    setG(false); onCerrar();
  }

  const pie = (
    <>
      <button className="btn gh" onClick={onCerrar}>Cancelar</button>
      {paso>0 && <button className="btn gh" onClick={()=>setPaso(paso-1)}>Anterior</button>}
      {paso<6 && <button className="btn" onClick={()=>setPaso(paso+1)}>Siguiente</button>}
      {paso===6 && <button className="btn amb" onClick={guardarSesion} disabled={g}>{g?<span className="spin"></span>:null} Guardar sesión</button>}
    </>
  );

  const opciones = [['1','100% — completo'],['0.9','90% — casi'],['0.75','75% — parcial'],['0.5','50% — a medias'],['0.25','25% — apenas'],['0','0% — no se hizo']];

  return (
    <Modal titulo={(sesion?'Sesión 1 a 1 · ':'Nueva sesión 1 a 1 · ')+(colab?colab.nombre:'')} onCerrar={onCerrar} pie={soloLectura?null:pie}>
      <div className="riel">
        {PASOS.map((p,i)=>
          <button key={p.n} className={(paso===i?'on ':'')+(completos[i]?'hecho':'')} onClick={()=>setPaso(i)}>
            <span className="n">{p.n}</span><span className="t">{p.t}</span></button>)}
      </div>

      {paso===0 && <div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <Campo etiqueta="Colaborador">
            <select value={f.colaboradorId} disabled={!!sesion||soloLectura} onChange={e=>setF({...f,colaboradorId:e.target.value})}>
              {cols.map(c=><option key={c.id} value={c.id}>{c.nombre} — {c.puesto}</option>)}</select></Campo>
          <Campo etiqueta="Fecha"><input type="date" value={String(f.fecha).slice(0,10)} disabled={soloLectura} onChange={e=>setF({...f,fecha:e.target.value})}/></Campo>
        </div>
        {colab && (colab.driver||colab.flowTips) &&
          <div className="aviso info" style={{marginBottom:14}}>
            {colab.driver && <div><b>Lo que lo mueve:</b> {colab.driver}</div>}
            {colab.flowTips && <div style={{marginTop:4}}><b>Cómo trabajar con él:</b> {colab.flowTips}</div>}
          </div>}
        {sesionPrevia && sesionPrevia.metaSemana &&
          <div className="aviso warn" style={{marginBottom:14}}>
            <b>Meta que se comprometió la vez pasada:</b> {sesionPrevia.metaSemana}
            <div style={{marginTop:4,fontSize:13}}>Empieza preguntando por esto, no por la operación.</div>
          </div>}
        {previos.length>0 &&
          <div className="aviso info" style={{marginBottom:14}}>
            <b>Acuerdos abiertos ({previos.length}):</b>
            <ul style={{margin:'6px 0 0 18px',padding:0}}>
              {previos.map(a=><li key={a.id} style={{fontSize:13.5}}>{a.descripcion} — vence {fFecha(a.fechaCompromiso)}</li>)}
            </ul>
          </div>}
        <div className="reglas">
          <h4>Reglas de una interacción productiva</h4>
          <div className="sub" style={{marginBottom:6}}>Marca las que se cumplieron. Es autoevaluación tuya, no del colaborador.</div>
          {REGLAS.map(gr=>
            <div key={gr.g}>
              <div className="grp">{gr.g}</div>
              {gr.items.map(i=>
                <label key={i.id}>
                  <input type="checkbox" checked={marcadas.includes(i.id)} disabled={soloLectura} onChange={()=>toggleRegla(i.id)}/>
                  <span>{i.t}</span></label>)}
            </div>)}
        </div>
      </div>}

      {paso===1 && <div>
        <div className="sub" style={{marginBottom:12}}>Abre por la persona, no por la tarea. Deja que hable primero.</div>
        <Campo etiqueta="¿Cómo viene? Check-in personal" ayuda="carga de trabajo, ánimo, algo fuera del trabajo que esté pesando">
          <textarea value={f.checkin} disabled={soloLectura} onChange={e=>setF({...f,checkin:e.target.value})}
            placeholder="¿Cómo estuvo tu semana? ¿Qué te quitó energía? ¿Qué te la dio?"/></Campo>
        <Campo etiqueta="Temas que trae el colaborador" ayuda="su agenda va antes que la tuya">
          <textarea value={f.temasColaborador} disabled={soloLectura} onChange={e=>setF({...f,temasColaborador:e.target.value})} style={{minHeight:64}}/></Campo>
        <Campo etiqueta="Ánimo percibido (1 a 5)">
          <input type="range" min="1" max="5" value={f.animo} disabled={soloLectura} onChange={e=>setF({...f,animo:e.target.value})} style={{width:'100%'}}/>
          <div className="sub">{['Desgastado','Bajo','Estable','Bien','Muy motivado'][(+f.animo||3)-1]}</div></Campo>
      </div>}

      {paso===2 && <div>
        <div className="sub" style={{marginBottom:12}}>Rutina de la semana. Puntúa qué tanto se sostuvo cada actividad; el promedio se calcula solo.</div>
        {!cat.length && <div className="aviso warn">No hay rutina definida para este puesto. Agrégala en la constante RUTINAS del archivo.</div>}
        {cat.map(a=>{
          const v = scores[a];
          const pct = v===undefined||v===''?null:Math.round(parseFloat(v)*100);
          return (
            <div key={a} className="rut">
              <div style={{fontSize:13.5}}>{a}</div>
              <select value={v===undefined?'':v} disabled={soloLectura} onChange={e=>setScores({...scores,[a]:e.target.value})}>
                <option value="">Sin evaluar</option>
                {opciones.map(([val,l])=><option key={val} value={val}>{l}</option>)}
              </select>
              <div className="pctc dato" style={{fontWeight:600,color:colorPct(pct),textAlign:'right'}}>{pct===null?'—':pct+'%'}</div>
            </div>);
        })}
        {promedio!==null &&
          <div style={{marginTop:16,display:'flex',alignItems:'center',gap:14}}>
            <div>
              <div className="eyebrow">Promedio de la semana</div>
              <div className="dato" style={{fontSize:32,fontWeight:600,color:colorPct(promedio*100)}}>{Math.round(promedio*100)}%</div>
            </div>
            <div style={{flex:1}}><Barra pct={promedio*100} color={colorPct(promedio*100)}/></div>
          </div>}
      </div>}

      {paso===3 && <div>
        <div className="sub" style={{marginBottom:12}}>Resultados de {fPeriodo(periodo)}. Habla de datos, no de impresiones.</div>
        {gl.pct===null && <div className="aviso warn">No hay KPIs capturados para este periodo. Captúralos en la pestaña KPIs.</div>}
        {gl.detalle.map(k=>(
          <div key={k.id} style={{display:'flex',gap:12,alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--paper)'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13.5,fontWeight:500}}>{k.nombre}</div>
              <div className="sub">Meta {k.dir==='menor'?'≤':'≥'} {k.evalua==='semaforo'?k.verde:k.meta} {k.u} · peso {k.pesoNorm}%</div>
            </div>
            <div className="dato" style={{width:70,textAlign:'right'}}>{k.resultado===''?'—':k.resultado+' '+k.u}</div>
            <div style={{width:80}}>
              <div className="dato" style={{fontWeight:600,color:colorPct(k.cumpl),fontSize:13}}>{k.cumpl===null?'—':Math.round(k.cumpl)+'%'}</div>
              <Barra pct={k.cumpl||0} color={colorPct(k.cumpl)}/>
            </div>
          </div>))}
        {gl.pct!==null && colab &&
          <div style={{marginTop:14,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
            <div className="dato" style={{fontSize:30,fontWeight:600,color:colorPct(gl.pct)}}>{gl.pct}%</div>
            <span className={'tag '+nivelDe(colab.area,gl.pct,colab.rol).cls}>
              {nivelDe(colab.area,gl.pct,colab.rol).nombre} · bono {nivelDe(colab.area,gl.pct,colab.rol).bonoPct}%</span>
          </div>}
      </div>}

      {paso===4 && <div>
        <div className="sub" style={{marginBottom:12}}>Se abre reconociendo, se ajusta con un dato, se cierra con confianza.</div>
        <Campo etiqueta="MÁS · Qué hizo bien" ayuda="hecho concreto y observable, no 'echas ganas'">
          <textarea value={f.logros} disabled={soloLectura} onChange={e=>setF({...f,logros:e.target.value})}
            placeholder="Ej.: Sacaste las 14 entregas de la quincena sin una sola reprogramación."/></Campo>
        <Campo etiqueta="MENOS · Qué necesita ajustar" ayuda="una sola conducta, con el dato que la sostiene y el impacto que tuvo">
          <textarea value={f.mejoras} disabled={soloLectura} onChange={e=>setF({...f,mejoras:e.target.value})}
            placeholder="Ej.: Tres expedientes se regresaron por falta de firma; eso movió la entrega dos días."/></Campo>
        <Campo etiqueta="MÁS · Cierre de confianza" ayuda="por qué crees que puede resolverlo">
          <textarea value={f.refuerzo} disabled={soloLectura} onChange={e=>setF({...f,refuerzo:e.target.value})} style={{minHeight:64}}/></Campo>
      </div>}

      {paso===5 && <div>
        <div className="sub" style={{marginBottom:12}}>Esta parte la contesta él, no tú. Anota sus palabras.</div>
        <Campo etiqueta="¿Qué debo seguir haciendo?">
          <textarea value={f.seguir} disabled={soloLectura} onChange={e=>setF({...f,seguir:e.target.value})} style={{minHeight:62}}/></Campo>
        <Campo etiqueta="¿Qué debo empezar a hacer?">
          <textarea value={f.empezar} disabled={soloLectura} onChange={e=>setF({...f,empezar:e.target.value})} style={{minHeight:62}}/></Campo>
        <Campo etiqueta="¿Qué debo dejar de hacer?">
          <textarea value={f.dejar} disabled={soloLectura} onChange={e=>setF({...f,dejar:e.target.value})} style={{minHeight:62}}/></Campo>
        <div className="hr"></div>
        <Campo etiqueta="Obstáculos que reporta" ayuda="lo que le impide avanzar y no depende solo de él">
          <textarea value={f.obstaculos} disabled={soloLectura} onChange={e=>setF({...f,obstaculos:e.target.value})} style={{minHeight:62}}/></Campo>
        <Campo etiqueta="Apoyo que necesita de mí" ayuda="qué me toca destrabar como gerente">
          <textarea value={f.apoyo} disabled={soloLectura} onChange={e=>setF({...f,apoyo:e.target.value})} style={{minHeight:62}}/></Campo>
        {!soloLectura &&
          <Campo etiqueta="Notas privadas" ayuda="solo tú las ves; nunca se envían a la vista del colaborador">
            <textarea value={f.notasPrivadas} onChange={e=>setF({...f,notasPrivadas:e.target.value})} style={{minHeight:62}}/></Campo>}
      </div>}

      {paso===6 && <div>
        {sesionPrevia && sesionPrevia.metaSemana &&
          <Campo etiqueta="Cierre de la meta anterior" ayuda={'Se comprometió a: '+sesionPrevia.metaSemana}>
            <textarea value={f.feedbackMeta} disabled={soloLectura} onChange={e=>setF({...f,feedbackMeta:e.target.value})}
              placeholder="¿Se cumplió? ¿Qué la facilitó o la estorbó?" style={{minHeight:62}}/></Campo>}
        <Campo etiqueta="Una sola meta para el siguiente periodo" ayuda="una. Si son tres, no es meta, es lista de pendientes">
          <textarea value={f.metaSemana} disabled={soloLectura} onChange={e=>setF({...f,metaSemana:e.target.value})} style={{minHeight:62}}/></Campo>
        <div className="hr"></div>
        <div className="sub" style={{marginBottom:12}}>Máximo tres acuerdos. Cada uno con dueño y fecha, o no es un acuerdo.</div>
        {nuevos.map((a,i)=>(
          <div key={i} style={{border:'1px solid var(--line)',borderRadius:9,padding:12,marginBottom:10}}>
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              <span className="chip">Acuerdo {i+1}</span><div style={{flex:1}}></div>
              <button className="btn dg sm" onClick={()=>setNuevos(nuevos.filter((_,j)=>j!==i))}>Quitar</button>
            </div>
            <textarea value={a.descripcion} placeholder="¿Qué se compromete a hacer, exactamente?" style={{minHeight:56,marginBottom:8}}
              onChange={e=>{const n=[...nuevos]; n[i]={...a,descripcion:e.target.value}; setNuevos(n);}}/>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
              <select value={a.responsable} onChange={e=>{const n=[...nuevos]; n[i]={...a,responsable:e.target.value}; setNuevos(n);}}>
                <option>Colaborador</option><option>Gerente</option><option>Ambos</option></select>
              <input type="date" value={a.fechaCompromiso} onChange={e=>{const n=[...nuevos]; n[i]={...a,fechaCompromiso:e.target.value}; setNuevos(n);}}/>
              <input type="text" placeholder="Evidencia" value={a.evidencia}
                onChange={e=>{const n=[...nuevos]; n[i]={...a,evidencia:e.target.value}; setNuevos(n);}}/>
            </div>
          </div>))}
        {nuevos.length<3 && !soloLectura &&
          <button className="btn gh sm" onClick={()=>setNuevos([...nuevos,{descripcion:'',responsable:'Colaborador',fechaCompromiso:hoy(),estado:'Pendiente',evidencia:''}])}>+ Agregar acuerdo</button>}
        <div className="hr"></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <Campo etiqueta="Próxima sesión"><input type="date" value={String(f.proximaSesion||'').slice(0,10)} disabled={soloLectura} onChange={e=>setF({...f,proximaSesion:e.target.value})}/></Campo>
          <Campo etiqueta="Estado de esta sesión">
            <select value={f.estado} disabled={soloLectura} onChange={e=>setF({...f,estado:e.target.value})}>
              <option>Realizada</option><option>Programada</option><option>Cancelada</option></select></Campo>
        </div>
      </div>}
    </Modal>
  );
}

/* ============================================================
   18. AJUSTES
   ============================================================ */
function Ajustes({data, guardar, recargar, claveActual}){
  const [edit, setEdit] = useState(null);
  const [claves, setClaves] = useState(null);
  const [cargandoC, setCargandoC] = useState(false);

  async function verClaves(){
    setCargandoC(true);
    try{ setClaves(await jsonp('getClaves',{clave:claveActual})); }catch(e){ setClaves([]); }
    setCargandoC(false);
  }
  return (
    <div className="grid g2">
      <div className="card">
        <div className="hd"><h3>Colaboradores</h3><div style={{flex:1}}></div>
          <button className="btn gh sm" onClick={()=>setEdit({area:'SC',rol:'EJEC',frecuencia:'QUINCENAL',activo:'SI'})}>+ Agregar</button></div>
        <div className="tw"><table>
          <thead><tr><th>Nombre</th><th>Puesto</th><th>1 a 1</th><th>Activo</th><th></th></tr></thead>
          <tbody>{data.Colaboradores.map(c=>
            <tr key={c.id}><td>{c.nombre}</td><td className="sub">{c.puesto}</td>
              <td>{c.frecuencia==='SEMANAL'?'Semanal':c.frecuencia==='QUINCENAL'?'Quincenal':'—'}</td>
              <td><span className={'tag '+(String(c.activo).toUpperCase()==='NO'?'t-gr':'t-ok')}>{String(c.activo).toUpperCase()==='NO'?'Inactivo':'Activo'}</span></td>
              <td><button className="btn gh sm" onClick={()=>setEdit(c)}>Editar</button></td></tr>)}
          </tbody></table></div>
      </div>

      <div className="card">
        <div className="hd"><h3>Claves de acceso</h3></div>
        <div className="bd">
          <div className="sub" style={{marginBottom:12}}>
            Cada quien entra con su clave y el servidor le entrega únicamente sus datos. Cambia cualquier clave desde la ficha del colaborador.
          </div>
          {!claves && <button className="btn gh sm" onClick={verClaves} disabled={cargandoC}>{cargandoC?<span className="spin"></span>:null} Mostrar claves</button>}
          {claves && claves.map(c=>
            <div key={c.id} style={{display:'flex',gap:10,alignItems:'center',padding:'7px 0',borderBottom:'1px solid var(--paper)'}}>
              <div style={{flex:1,fontSize:13.5}}>{c.nombre}</div>
              <div className="dato" style={{fontWeight:600}}>{c.clave||'—'}</div>
            </div>)}
          <div className="hr"></div>
          <div className="eyebrow">Backend</div>
          <div className="dato" style={{fontSize:11.5,wordBreak:'break-all',marginBottom:10}}>{CONFIG.API_URL}</div>
          <button className="btn gh sm" onClick={recargar}>Recargar datos</button>
        </div>
      </div>
      {edit && <FormColaborador c={edit} onCerrar={()=>setEdit(null)} guardar={guardar}/>}
    </div>
  );
}

function FormColaborador({c, onCerrar, guardar}){
  const [f, setF] = useState({nombre:'',puesto:'',correo:'',notas:'',fechaIngreso:'',clave:'',...c});
  const [g, setG] = useState(false);
  async function ok(){
    setG(true);
    const reg = {...f};
    if(!String(reg.clave||'').trim()) delete reg.clave;   // no borra la clave existente
    await guardar('Colaboradores',[reg]); setG(false); onCerrar();
  }
  return (
    <Modal titulo={f.id?'Editar colaborador':'Nuevo colaborador'} onCerrar={onCerrar}
      pie={<><button className="btn gh" onClick={onCerrar}>Cancelar</button>
           <button className="btn" onClick={ok} disabled={!f.nombre||g}>{g?<span className="spin"></span>:null} Guardar</button></>}>
      <Campo etiqueta="Nombre"><input type="text" value={f.nombre} onChange={e=>setF({...f,nombre:e.target.value})}/></Campo>
      <Campo etiqueta="Puesto"><input type="text" value={f.puesto} onChange={e=>setF({...f,puesto:e.target.value})}/></Campo>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Campo etiqueta="Área"><select value={f.area} onChange={e=>setF({...f,area:e.target.value})}>
          <option value="SC">Servicio a Clientes</option><option value="DOC">Documentos</option><option value="GER">Gerencia</option></select></Campo>
        <Campo etiqueta="Rol"><select value={f.rol} onChange={e=>setF({...f,rol:e.target.value})}>
          <option value="COORD">Coordinador</option><option value="EJEC">Ejecutivo</option><option value="ADMIN">Administrador</option></select></Campo>
        <Campo etiqueta="Frecuencia de 1 a 1"><select value={f.frecuencia} onChange={e=>setF({...f,frecuencia:e.target.value})}>
          <option value="SEMANAL">Semanal</option><option value="QUINCENAL">Quincenal</option></select></Campo>
        <Campo etiqueta="Activo"><select value={f.activo} onChange={e=>setF({...f,activo:e.target.value})}>
          <option value="SI">Sí</option><option value="NO">No</option></select></Campo>
      </div>
      <Campo etiqueta="Correo"><input type="email" value={f.correo} onChange={e=>setF({...f,correo:e.target.value})}/></Campo>
      <Campo etiqueta="Clave de acceso" ayuda="déjala vacía para conservar la actual">
        <input type="text" value={f.clave||''} onChange={e=>setF({...f,clave:e.target.value.toUpperCase()})} placeholder="Sin cambios"/></Campo>
    </Modal>
  );
}

/* ============================================================
   19. APP
   ============================================================ */
const VACIA = {Colaboradores:[],Sesiones:[],Acuerdos:[],KPIs:[],Desarrollo:[],Rutinas:[],Competencias:[],PlanGerencial:[]};

function App(){
  const [claveAcceso, setClaveAcceso] = useState(null);
  const [usuario, setUsuario] = useState(null);
  const [data, setData] = useState(VACIA);
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState('');
  const [toast, setToast] = useState(null);
  const [vista, setVista] = useState('panel');
  const [sel, setSel] = useState(null);
  const [periodo, setPeriodo] = useState(periodoActual());
  const [sesionAbierta, setSesionAbierta] = useState(null);

  function aviso(t, err){ setToast({t,err}); setTimeout(()=>setToast(null), 3200); }

  async function cargar(c){
    const k = c || claveAcceso;
    setCargando(true); setError('');
    try{ const d = await jsonp('getAll',{clave:k}); setData({...VACIA, ...d}); }
    catch(e){ setError(e.message); }
    setCargando(false);
  }

  async function entrar(c, u){
    setClaveAcceso(c); setUsuario(u);
    setVista(u.esAdmin?'panel':'mi');
    if(!u.esAdmin) setSel(u.id);
    await cargar(c);
  }
  function salir(){ setClaveAcceso(null); setUsuario(null); setData(VACIA); setSel(null); window.HT && window.HT.salir(); }

  async function guardar(hoja, registros, devolver){
    try{
      const r = await jsonp('upsertLote', {hoja, registros, clave:claveAcceso});
      const copia = {...data}; copia[hoja] = [...copia[hoja]];
      r.forEach(reg=>{
        const i = copia[hoja].findIndex(x=>x.id===reg.id);
        if(i>=0) copia[hoja][i] = {...copia[hoja][i], ...reg}; else copia[hoja].push(reg);
      });
      if(hoja==='Colaboradores' && window.HT){
        for(const reg of registros){
          if(reg && reg.id && String(reg.clave||'').trim()){
            try{ await window.HT.guardarClave(reg.id, String(reg.clave).trim()); }
            catch(e){ aviso('Se guardó en la hoja, pero no se actualizó el acceso en la plataforma: '+e.message, true); }
          }
        }
      }
      setData(copia); aviso('Guardado');
      return devolver ? r : true;
    }catch(e){ aviso(e.message, true); return false; }
  }

  if(!usuario) return <Login onEntrar={entrar}/>;

  const esAdmin = usuario.esAdmin;
  const cols = data.Colaboradores.filter(c=>c.rol!=='ADMIN' && String(c.activo).toUpperCase()!=='NO');
  const colabSel = sel ? data.Colaboradores.find(c=>c.id===sel) : null;
  const yo = data.Colaboradores.find(c=>c.id===usuario.id);

  return (
    <div className="app">
      <aside className="rail">
        <div className="marca">
          <div className="ht">Plataforma HT</div>
          <div className="sub2">Interacciones 1 a 1</div>
        </div>
        <nav className="nav">
          {esAdmin && <>
            <button className={vista==='panel'?'on':''} onClick={()=>{setVista('panel');setSel(null);}}>
              <span className="glyph">▣</span> Panel general</button>
            <div className="sec">Mi equipo</div>
            {cols.map(c=>
              <button key={c.id} className={sel===c.id&&vista==='ficha'?'on':''} onClick={()=>{setSel(c.id);setVista('ficha');}}>
                <span className="glyph">{c.rol==='COORD'?'◆':'◇'}</span> {c.nombre.split(' ')[0]} {c.nombre.split(' ')[1]||''}</button>)}
            <div className="sec">Gerencia</div>
            <button className={vista==='plan'?'on':''} onClick={()=>{setVista('plan');setSel(null);}}>
              <span className="glyph">▤</span> Plan de 90 días</button>
            <button className={vista==='ajustes'?'on':''} onClick={()=>{setVista('ajustes');setSel(null);}}>
              <span className="glyph">⚙</span> Ajustes</button>
          </>}
          {!esAdmin && <>
            <button className={vista==='mi'?'on':''} onClick={()=>setVista('mi')}>
              <span className="glyph">◈</span> Mi seguimiento</button>
            {data.PlanGerencial.length>0 &&
              <button className={vista==='plan'?'on':''} onClick={()=>setVista('plan')}>
                <span className="glyph">▤</span> Mis actividades</button>}
          </>}
        </nav>
        <div className="pieRail">
          {usuario.nombre}
          <br/><a href="index.html">← Volver a módulos</a>
          <br/><button onClick={salir}>Cerrar sesión</button>
        </div>
      </aside>

      <main className="main">
        <div className="top">
          <div>
            <div className="eyebrow">{vista==='ficha'&&colabSel ? colabSel.puesto : (esAdmin?'Servicio a Clientes · Documentos':usuario.puesto)}</div>
            <h1>{vista==='panel'?'Panel general':vista==='ajustes'?'Ajustes':vista==='plan'?(esAdmin?'Plan operativo de 90 días':'Mis actividades del plan'):(colabSel?colabSel.nombre:'Mi seguimiento')}</h1>
          </div>
          <div className="sp"></div>
          {cargando && <span className="spin"></span>}
          <a className="btn gh sm" href="index.html" style={{textDecoration:'none'}}>← Módulos</a>
        </div>

        <div className="cont">
          {error && <div className="aviso"><b>No se pudo cargar la información.</b> {error}
            <div style={{marginTop:8}}><button className="btn gh sm" onClick={()=>cargar()}>Reintentar</button></div></div>}

          {!error && esAdmin && vista==='panel' &&
            <Panel data={data} periodo={periodo} setPeriodo={setPeriodo}
              abrir={(id)=>{setSel(id);setVista('ficha');}}
              nuevaSesion={(id)=>setSesionAbierta({nueva:true, colaboradorId:id})}/>}

          {!error && esAdmin && vista==='ficha' && colabSel &&
            <Ficha colab={colabSel} data={data} periodo={periodo} setPeriodo={setPeriodo} guardar={guardar}
              nuevaSesion={(id)=>setSesionAbierta({nueva:true, colaboradorId:id})}
              verSesion={(s)=>setSesionAbierta(s)}/>}

          {!error && !esAdmin && vista==='mi' && yo &&
            <Ficha colab={yo} data={data} periodo={periodo} setPeriodo={setPeriodo}
              guardar={async()=>false} nuevaSesion={()=>{}} soloLectura={true}
              verSesion={(s)=>setSesionAbierta(s)}/>}

          {!error && vista==='plan' &&
            <PlanGerencial data={data} guardar={guardar} soloLectura={!esAdmin}/>}

          {!error && esAdmin && vista==='ajustes' &&
            <Ajustes data={data} guardar={guardar} recargar={()=>cargar()} claveActual={claveAcceso}/>}
        </div>
      </main>

      {sesionAbierta &&
        <Sesion data={data} periodo={periodo}
          colaboradorId={sesionAbierta.colaboradorId || sel || usuario.id}
          sesion={sesionAbierta.nueva ? null : sesionAbierta}
          onCerrar={()=>setSesionAbierta(null)} guardar={guardar} soloLectura={!esAdmin}/>}

      {toast && <div className={'toast'+(toast.err?' err':'')}>{toast.t}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
